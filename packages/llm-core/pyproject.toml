[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML>=6.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
