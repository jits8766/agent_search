# llm_core pricing reference
# ============================================================================
# Single source of truth for per-model token pricing (USD per 1M tokens).
# Why this file is in `llm_core/` rather than each service's `base.yaml`:
#   * Pricing is metadata about the model, not application config.
#   * Adding a new vendor SKU is a one-file edit.
#   * Vendors do NOT expose per-token pricing via API — maintain by hand when
#     vendors publish a price change. Re-check:
#         OpenAI:    https://openai.com/api/pricing/
#         Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#         Google:    https://ai.google.dev/pricing
#         xAI:       https://docs.x.ai/developers/pricing
#         Z.AI/GLM:  https://docs.z.ai/guides/overview/pricing
#         Qwen:      https://docs.qwencloud.com/developer-guides/getting-started/pricing
#         DeepSeek:  https://api-docs.deepseek.com/quick_start/pricing
# Last reviewed: 2026-07-22 (gap-fill vs live llm_core discovery after API-key rotate;
# OpenAI developers.openai.com/api/docs/models/* + Google ai.google.dev/pricing).
# Missing model → still selectable; cost_analysis falls back to `default` below.
# Skip ids with no published USD/1M token range on the vendor portal (fakes, Cursor
# aliases, unlisted gateway SKUs).
# Tiered / long-context surcharges: store the common (<threshold) rate only.
#
# selection_exclusions: model ids removed from LLMProvider discovery ranking.
# selection_max_output_usd_per_million: priced chat SKUs with output USD/M
# strictly greater than this are also removed from ranking (see pricing.py).

selection_exclusions: []

selection_max_output_usd_per_million: 75

