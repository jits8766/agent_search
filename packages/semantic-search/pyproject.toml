[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-search"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llm-core",
    "boto3==1.40.64",
    "botocore==1.40.76",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.2",
    "qdrant-client==1.17.1",
    "fastembed==0.8.0",
    "redis==5.2.1",
    "torch==2.13.0",
    "transformers==5.5.0",
    "scikit-learn==1.8.0",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml>=6.0",
    "sqlglot",
    "python-multipart>=0.0.31",
    "symspellpy>=6.7.7",
    "starlette>=1.3.1",
    "cryptography>=50.0.0",
    "authlib>=1.6.12",
    "lxml>=6.1.0",
    "tornado>=6.5.7",
    "pydantic-settings>=2.14.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
rag = [
    "spacy>=3.8.0,<4.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv.sources]
llm-core = { workspace = true }
# CPU wheel index declared at workspace root (auc-semantic-search/pyproject.toml).
torch = { index = "pytorch-cpu" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["semantic_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
