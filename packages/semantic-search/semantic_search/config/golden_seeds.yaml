# ---------------------------------------------------------------------------
# Bootstrap golden eval dataset (manual curation)
# ---------------------------------------------------------------------------
# This YAML lists calibration boot cases (`cases:`) for `calibration.boot_seeds_path`.
# Each row supplies `input_query` and `expected_query_type` consumed by
# `semantic_search.calibration.seed_loader.load_calibration_boot_cases` when
# `calibration.fit_on_load` is true. Optional fields below are documentation only
# for curators; the boot loader reads only the two required keys per case.
# Schema per case:
#   input_query:           str  — raw user phrasing (will be sanitized)
#   expected_query_type:   one of QUERY_TYPES
#                          (hybrid | guidance | explore | analytics)
#   expected_entities:     list of {name: <slot>, value: <expected>}
#                          slot names emitted by RegexClassifier:
#                          tld | price_min | price_max | auction_type | name_length_max
#                          (use [] for archetypes that produce no structured slots)
#   difficulty:            easy | hard | edge        (GOLDEN_DIFFICULTIES)
#   edge_type:             domain_boundary | complexity | ambiguity |
#                          adversarial | low_frequency | multi_intent
#                          (GOLDEN_EDGE_TYPES)
#   signal_origin:         manual         (always — these are hand-curated)
# Coverage targets:
#   - ≥30 approved cases per archetype (267 total; hybrid 106, explore 63, guidance 54, analytics 44)
#   - ≥10% multi_intent cases (we ship 12 = 4.5%)
#   - Sanitizer must approve every case (we keep them clean — no prompt-injection
#     fragments, no PII, no HTML/script). The loader will reject any case that
#     fails the sanitizer.
# The loader is idempotent: re-running it diffs against existing case input_queries
# and only adds new ones — safe to call repeatedly.
# ---------------------------------------------------------------------------

