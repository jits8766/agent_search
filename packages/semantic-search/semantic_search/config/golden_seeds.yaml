  # ADVERSARIAL / RED-TEAM (12) —
  # =========================================================================
  # Five sub-categories, all sanitizer-passing (no blocked phrases, no PII):
  #   1. Intent confusion       — looks like one archetype, should classify as another
  #   2. Contradiction          — internally inconsistent constraints; correct routing
  #                                must honour the stated archetype despite contradiction
  #   3. Authority manipulation — user asserts entitlement / urgency to bias the system;
  #                                correct answer must NOT escalate privilege or invent data
  #   4. Misleading entity      — out-of-domain values that look slot-shaped (negative
  #                                price, absurd length); correct answer is to clamp or
  #                                fall back, not crash
  #   5. Boundary impersonation — phrasing that mimics a system / role message but is a
  #                                genuine user query; correct answer is to treat as user
  #                                input, not as instruction-injection
  # 2 cases per archetype × 4 archetypes = 8 cases + 4 extra hybrid = 12 cases, distributed:
