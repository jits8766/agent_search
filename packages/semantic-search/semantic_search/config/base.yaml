# =============================================================================
# Agent Search — Service Configuration
# QI Engine, Hybrid Retrieval, Caching, Search Surface,
# User History, Resume, A/B Bucketing, Mode Selection.
# All parameters live here. No hardcoded defaults in code.
# =============================================================================

# -----------------------------------------------------------------------------
# Model name registry — single source of truth for pretrained model identifiers.
# Define here; reference via YAML anchors (*alias) throughout this file.
# Models are baked into the image at /app/pretrained (CI syncs them from S3 into
# ./pretrained before `docker build` — see deploy workflows). ${LOCAL_PRETRAINED_DIR:-/app/pretrained}
# resolves to that baked path; override LOCAL_PRETRAINED_DIR only for local runs pointing
# at a different model directory. Missing models => startup logs a degraded-model warning.
# -----------------------------------------------------------------------------
_models:
  encoder: &encoder_model "nomic-ai/nomic-embed-text-v1.5"
  sparse_encoder: &sparse_encoder_model "Qdrant/bm42-all-minilm-l6-v2-attentions"
  gliner: &gliner_model "knowledgator/gliner-multitask-large-v0.5"

# Single source of truth for ClickHouse analytics table identifiers. Referenced
# via YAML aliases wherever a whole value is a table name so the name is declared once.
_tables:
  analytics_db: &analytics_db "signals_platform_cln"
  base_table: &base_table "auction_audit_cln"
  base_table_qualified: &base_table_qualified "signals_platform_cln.auction_audit_cln"
  snapshot_table_qualified: &snapshot_table_qualified "signals_platform_cln.domain_snapshots"

# Master ClickHouse lever. When false:
#   - boot forces nl_to_sql.analytics / explore.clickhouse_rails /
#     retrieval.sql.clickhouse_adapter enabled=false
#   - CI skips the ClickHouse deploy job
#   - local scripts/compose-up.sh omits the clickhouse service
# Nested feature flags may stay true in YAML; the lever wins at boot.
clickhouse:
  # Master lever: false = no ClickHouse deploy (CI job 3 skipped) + boot forces
  # analytics / explore rails / sql adapter off. Qdrant deploy (CI job 4) stays on.
  # true = CI deploys auc-semsearch-clickhouse + API keeps nested CH surfaces on
  # (nl_to_sql.analytics / explore.clickhouse_rails / sql adapter). Requires
  # CLICKHOUSE_HOST(+PASSWORD) Katana secrets on auc-semantic-search after CH promote.
  enabled: true

general:
  # Service identity used in logs and feedback records
  service_name: semantic_search
  # Startup console noise: compact = summarize (per-tier identity fits, stage encoders, encoder paths at DEBUG); detailed = prior verbosity
  startup_log_verbosity: compact
  # Runtime logger threshold: DEBUG | INFO | WARNING | ERROR | CRITICAL. Applied once at
  # startup after config load. LOG_LEVEL env var overrides this when set.
  log_level: INFO
  # Maximum query string length accepted at the API boundary
  max_query_length: 512
  # Maximum results returned by /search and /search/refine
  max_results: 50
  search:
    qie_only_mode: false  # when true, /search runs L0 filter extract+ground only (no L1/L2 intent, no retrieval); slim response: identified_filters; false = normal search flow
    # In-process LRU+TTL for qie_only L0 LLM filter extracts (non-empty LLM successes only).
    # Empty extracts are never cached/served — avoids sticky filter_count=0 poison across TTL.
    qie_l0_filter_cache:
      max_entries: 10000
      ttl_seconds: 3600
    # qie_only FIND auction/recommend wire. All keys required.
    # FoS appends find_query_string to FIND recommend as-is.
    find_wire:
      # true: usable keyword terms become FIND query even with hard filters.
      # false + hard filters present: FIND query is empty_query_fallback.
      prefer_keywords_for_query: true
      # FIND query when no keyword terms pass probability / term-count gates.
      empty_query_fallback: "*"
      # Keyword probability gate is qi.l0_llm_entity.keyword_min_probability (sole source).
      # Max terms after sort by probability descending.
      max_keyword_terms: 3
      # Join separator for multi-term FIND query.
      keyword_term_separator: " "
      # When keywords become FIND query, set FIND semantic-search param.
      set_use_semantic_search_when_keywords: true
      use_semantic_search_param: useSemanticSearch
      use_semantic_search_value: "true"
    hybrid_prewarm_enabled: false  # per-request HNSW warm-up (2 extra Qdrant sample retrievals per hybrid query); false = warm at startup only, off the request path
    # When true, spell/rewrite run in parallel with QI classify on pre-rewrite text.
    # Retrieve waits until rewrite settles; encode uses rewrite when transformed.
    overlap_preprocess_with_classify: true
    top_k_cap: 100        # hard ceiling on caller-supplied top_k; values above this are clamped
    diversity_lambda: 0.65 # MMR relevance-vs-novelty knob [0,1] (fed to diversifier as lambda_relevance); HIGHER = MORE relevance / LESS diversity (1.0 = pure relevance/identity, 0.0 = pure novelty). See lexical_jaccard_diversifier.py.
    # Auction-signal tie-break (post-ranking). Relevance-DOMINANT: nudges
    # buyer-actionable domains up ONLY among near-equal-coherence items.
    # Bounded by max_bonus so it never reorders across a real coherence gap.
    # coherence_score + retrieval metrics are computed BEFORE this and unaffected.
    auction_tiebreak:
      enabled: true
      # Added on top of coherence in [0,1] before re-sort. 0.06 => only flips
      # items within ~6 coherence-points (true near-ties). Raise cautiously.
      max_bonus: 0.06
      # Auctions ending within this many hours get nonzero urgency, linearly
      # scaled (sooner = higher); beyond it urgency = 0.
      urgency_horizon_hours: 72.0
      # Sub-signal weights — must sum to 1.0 (validated at load).
      weight_urgency: 0.5
      weight_low_competition: 0.2
      weight_value: 0.3
    search_timeout_seconds: 10.0             # outer wall-clock SLA for non-analytics queries (hybrid/explore/guidance); explore_fallback returned on breach
    analytics_timeout_seconds: 18.0         # per-call cap for analytics pipeline (LLM SQL gen + CH exec); fits within analytics_total_budget_seconds after QI overhead
    analytics_total_budget_seconds: 20.0    # outer wall-clock from request start; QI overhead ~2s (no LLM routing) leaves ~18s effective analytics budget
    explore_fallback_timeout_seconds: 2.5   # speculative trending/ending-soon task runs in parallel; CH connect_timeout=0.5s so this fires only when CH is slow-but-reachable
    explore_fallback_cache_ttl_seconds: 60.0  # TTL for timeout-fallback result cache (max 60s freshness)
    # Timeout / SLA listing policy (get_timeout_fallback).
    # rail_first: keep explore (or Qdrant rail-ladder) cards — do not replace with semantic-only.
    # qdrant_rails_when_ch_empty: when CH rails empty/timeout, fill via filter_only_rails scrolls.
    timeout_fallback:
      rail_first: true
      qdrant_rails_when_ch_empty: true
      qdrant_rails_timeout_seconds: 2.0
      # Prefer search()-registered explore rail task (same request_id) over a second fan-out.
      consume_search_explore_prewarm: true
      # Max wait for search() to register that task after hard/soft chip prep.
      search_explore_prewarm_wait_seconds: 2.0
    speculative_analytics_start: true       # fire analytics() in parallel with orchestrator.search() when L1 signals analytics intent
    speculative_analytics_l1_confidence_threshold: 0.82  # minimum L1 SemanticRouter confidence to trigger speculative analytics start
    analytics_failure_explore_fallback: true  # when analytics fails and hybrid ranks empty, fill ranked_results from explore rails/semantic
    analytics_skip_uncorroborated_detour: true  # analytics route with no aggregate keyword + no L1-analytics confidence + no SQL hint → skip NL-to-SQL detour, serve explore fallback fast (removes explore→analytics misroute tail latency)
    # Hybrid-first ranked_results: CH substrates complement (rails RRF-merge, analytics
    # block, guidance envelope) — never replace hybrid retrieve. Include hybrid so
    # filter-heavy / empty-encode browse also gets CH explore rails (tld/price pushdown)
    # RRF-merged with Qdrant filter_only_rails when ClickHouse is up.
    ranked_results_complement:
      enabled: true
      merge_explore_rails: true
      merge_explore_rails_query_types:
        - analytics
        - explore
        - guidance
        - hybrid
      merge_rrf_k: 60
      # Start/merge explore (CH or Qdrant) rails only when primary is short of enough.
      merge_explore_rails_only_when_primary_short: true
      # Fraction of request top_k that counts as enough primary evidence (1.0 = full top_k).
      merge_explore_rails_primary_enough_fraction: 1.0
      strip_temporal_when_clickhouse_available: true
      ensure_nonempty: true
      force_semantic_when_empty: true
      force_semantic_top_k: 50
      rank_leanings:
        enabled: true
        max_bonus: 0.08
        weight_guidance: 0.5
        weight_analytics: 0.5
        query_types:
          - analytics
          - guidance

    # User-facing notices for analytics degrade / timeout / skip paths (config-driven copy).
    analytics_unavailable_hybrid_notice: "Analytics is unavailable — showing best-match search results instead."
    analytics_unavailable_explore_notice: "Analytics is unavailable — showing trending, ending-soon, and latest domains instead."
    analytics_timeout_hybrid_notice: "Analytics query exceeded the time budget — showing best-match search results instead."
    analytics_timeout_explore_notice: "Analytics query exceeded the time budget — showing trending, ending-soon, and latest domains instead."
    analytics_detour_skip_notice: "Showing trending, ending-soon, and latest domains."
    analytics_connection_unavailable_notice: "Analytics data connection unavailable — showing trending, ending-soon, and latest domains instead."
    analytics_failure_with_explore_notice: "Analytics could not produce an answer — showing trending, ending-soon, and latest domains instead."
    analytics_failure_empty_explore_notice: "Analytics could not produce an answer and explore fallback returned no results (analytics substrate or explore index may be unavailable)."
    # Semantic preference in get_timeout_fallback: when semantic returns >= min_results items
    # with avg fused_score >= min_score, return semantic-only ranked_results (query-intent
    # matched) instead of RRF-fusing with explore rails (generic trending domains).
    # Set explore_fallback_semantic_prefer_min_results to 0 to disable and always RRF-fuse.
    explore_fallback_semantic_prefer_min_results: 5
    explore_fallback_semantic_prefer_min_score: 0.45
    guidance_analytics_crosstype_enabled: true  # when guidance+aggregate signal, run analytics in parallel and return analytics answer on success
    guidance_analytics_crosstype_timeout_seconds: 3.5  # parallel analytics call budget for cross-type enrichment; must fit within remaining request budget after QI
    # FIND listing projection helpers (ISO timestamps + money display formatting).
    find_listing:
      iso_timestamp_fields:
        - ends_at
        - auction_end_time
        - end_time
        - data_update_time
      iso_fallback_source: ends_at
      iso_passthrough_string_fields:
        - data_update_time
      # Split prefix from template so loader env expansion (${VAR}) never eats the dollar.
      money_display_currency_prefix: "$"
      money_display_template: "{value}"
      money_display_value_placeholder: "{value}"
      money_display_number_format: ",.2f"
      money_display_when_null: ""
      domain_name_payload_keys:
        - fqdn
        - domain_name
      money_display_pairs:
        - source: auction_price
          targets: [auction_price_display, auction_price_display_usd]
        - source: current_bid_price
          targets: [current_bid_price_display, current_bid_price_display_usd]
        - source: valuation_price
          targets: [valuation_price_display, valuation_price_display_usd]
        - source: start_bid_amount
          targets: [start_bid_amount_display, start_bid_amount_display_usd]
        - source: buy_it_now_amount
          targets: [buy_it_now_amount_display, buy_it_now_amount_display_usd]
        - source: reserved_price_amount
          targets: [reserved_price_amount_display, reserved_price_amount_display_usd]
    # Per-result payload fields projected into each ranked_results entry (in this order),
    # on top of the fixed envelope (rank, domain_name, coherence_score, matched_by).
    result_fields:
      - fqdn
      - fqdn_from_feed
      - active
      - data_source
      - auction_id
      - auction_type
      - auction_price
      - auction_price_usd
      - auction_price_display
      - auction_price_display_usd
      - current_bid_price
      - current_bid_price_usd
      - current_bid_price_display
      - current_bid_price_display_usd
      - auction_end_time
      - end_time
      - data_update_time
      - last_bid_offer_dtm
      - bids
      - monthly_traffic
      - valuation_price
      - valuation_price_usd
      - valuation_price_display
      - valuation_price_display_usd
      - start_bid_amount
      - start_bid_amount_usd
      - start_bid_amount_display
      - start_bid_amount_display_usd
      - buy_it_now_flag
      - buy_it_now_amount
      - buy_it_now_amount_usd
      - buy_it_now_amount_display
      - buy_it_now_amount_display_usd
      - reserved_price_flag
      - reserved_price_amount
      - reserved_price_amount_usd
      - reserved_price_amount_display
      - reserved_price_amount_display_usd
      - appraised_value
      - auction_adult
      - feature_listing_flag
      - is_website_included
      - include_in_search_flag
      - display_result_in_category_list_flag
      - sub_category_feature_listing_flag
      - add_i_category_listing_flag
      - is_gem
      - unique_search_count
      - owner_member_id
      - vendor_id
      - domain_extension_id
      - auction_status
      - highest_bidder_id
      - bid_accepted_flag
      - on_sale_percent
      - item_description
      - isidn
      - tld
      - sld
      - time_to_end_hours
      - time_to_end_minutes
      - time_to_end_days
      - name_length
      - domain_age_years
      - domain_create_date
      - traffic_proxy_score
      - has_web_traffic_signal
      - estimated_traffic_tier
      - majestic_ext_back_links
      - majestic_ref_domains_fm
      - majestic_citation_flow_score
      - majestic_trust_flow_score
      - majestic_metric_exists
      - semrush_ascore
      - semrush_total
      - semrush_domains_num
      - semrush_urls_num
      - semrush_keyword
      - semrush_search_volume
      - semrush_cpc
      - semrush_refdomains
      - estibot_domain_count
      - estibot_domain_count_dev
      - estibot_ext_count
      - estibot_ext_count_dev
      - is_boosted_aftermarket
    # Aggregate signal keywords: query containing any entry → analytics outer-timeout budget applied.
    analytics_budget_keywords:
      - average
      - avg
      - how many
      - count
      - total
      - rate
      - growth
      - comparison
      - compare
      - percentage
      - percent
      - sum
      - win rate
      - success rate
      - sell through
      - leaderboard
      - top n
      - ranking
      - " vs "
      - versus
      - monthly
      - weekly
      - daily
      - by month
      - by week
      - by day
      - by category
      - by tld
      - most active
      - highest
      - lowest
      - best
      - worst
      - min 
      - max    # Columns always treated as absent; filter entities for these are skipped in retrieval.
    permanently_unavailable_columns: []
  # Per-session rate limit. Bucket
  # key is the `X-Session-Id` request header (anonymous traffic without the
  # header falls back to client IP). Excess requests are rejected with HTTP
  # 429 and a `Retry-After` header. Disabled by default in tests; production
  # sets `enabled: true`.
  rate_limit:
    enabled: true
    # 120 requests / min / session.
    max_requests_per_window: 120
    window_seconds: 60
    # LRU cap on tracked buckets (memory bound).
    session_state_max: 10000
    # URL prefixes the limiter applies to. The plan limits ALL user-input
    # endpoints (Layer 0 sanitiser cap, plan §"Rate limit"). Operator and
    # automation endpoints (/healing/*, /resilience/*, /drift/*/baseline,
    # /drift/*/reset, /calibration/*, /vectorization/*, /qi/centroid-*) are
    # intentionally excluded so admin tooling never gets 429'd. Probes
    # (/healthz, /capabilities) are excluded so liveness checks do not
    # consume the user budget.
    paths:
      - /search
      - /analytics
      - /qi/classify
      - /history/
      - /experiments/
    # Extra requests allowed in the burst window on top of the main cap.
    # Absorbs short bid-cascade spikes (bid→extend→more bids) without 429.
    # 0 = burst disabled.
    burst_requests: 20
    burst_window_seconds: 10
  # Per-tenant analytics-call rate limit. Independent of
  # `rate_limit` above because analytics calls (LLM gen + warehouse
  # execute + verifier) are far more expensive than search calls and
  # warrant their own bucket. Backed by a separate
  # SlidingWindowRateLimiter built in the registry; on breach the
  # orchestrator returns AnalyticsResult(failure_mode='rate_limited')
  # — typed result, no exception. key_strategy 'user_id' prefers the
  # authenticated user when present, falls back to session_id otherwise;
  # 'session_id' always buckets by session_id (used in environments
  # without user authentication).
  analytics_rate_limit:
    enabled: true
    # 30 analytics requests / min / tenant — far tighter than the search
    # bucket because each call may trigger LLM gen + warehouse execute +
    # verifier (~2-5x search cost).
    max_requests_per_window: 30
    window_seconds: 60
    session_state_max: 10000
    # 'user_id' | 'session_id'.
    key_strategy: user_id

# -----------------------------------------------------------------------------
# Query Intelligence Engine — cascade router (regex L0 -> semantic L1 -> LLM L2)
# -----------------------------------------------------------------------------
qi:
  enabled: true
  # Allowed query types (closed enum used for validation across QI + retrieval)
  query_types:
    - hybrid
    - guidance
    - explore
    - analytics
  default_query_type: hybrid

  # L0 — GLiNER entity extractor (zero-shot slot filling, runs before L1/L2).
  # When enabled: true, wired into QIEngine sequential cascade:
  #   L0 extracts filter entities → L1 routing (consumes L0 entities, tier='L1_semantic' if >=0.90)
  #   → L2 LLM only on L1 miss (merges L0 slots + L2, tier='L2_llm').
  # Set enabled: false to revert: L0 not wired, L1/L2 cascade unchanged.
  # Rollback: flip enabled: false — zero other changes needed.
  regex:
    enabled: true
    # Confidence assigned to a positive regex hit
    confidence: 0.95
    # TLD allowlist used by the TLD-filter heuristic
    known_tlds:
      # Source: signals_platform_cln.analytics_auctions_by_tld, last 14 days, total_bids > 0
      - com
      - org
      - net
      - co
      - io
      - xyz
      - group
      - tv
      - us
      - me
      - info
      - cc
      - vip
      - design
      - online
      - store
      - network
      - shop
      - site
      - live
      - biz
      - life
      - global
      - bet
      - fun
      - one
      - mobi
      - media
      - club
      - digital
      - blog
      - agency
      - work
      - buzz
      - studio
      - news
      - cloud
      - solutions
      - guru
      - world
      - email
      - today
      - services
      - rocks
      - tech
      - company
      - ws
      - fit
      # Static entries preserved (not in last-14-day bid window but valid TLDs)
      - ai
      - app
      - dev
      - law
    # Closed inventory of recognized auction types (used by EntityGrounder).
    # Canonical labels plus numeric type IDs stored in the index payload.
    # From analysis_auction.md:
    #   16 = GoDaddy AutoExtend (Expireds)     20 = GoDaddy BuyNow (Closeouts)
    #   38 = Partner AutoExtend (Expireds)     39 = Partner Closeout
    #   25 = Drop Catch (Private Backorder)    37 = Firehose (Pre-registration)
    # Labels expand → numeric IDs via AUCTION_TYPE_LABEL_TO_IDS in contracts.py.
    known_auction_types:
      - expiry
      - closeout
      - premium
      - auction
      - buynow
      - buy_now
      - backorder          # → 25
      - dropcatch          # → 25
      - firehose           # → 37
      - preregistration    # → 37
      - partner            # → 38|39
      - godaddy            # → 16|20
      - "16"
      - "20"
      - "25"
      - "37"
      - "38"
      - "39"
    # Adapt-on-miss substitutions. When the
    # entity grounder drops a TLD because it is not present in live inventory,
    # the surface offers these alternatives as chips ("no .ai inventory right
    # now — try .io / .tech?"). Empty values disable substitution for a given
    # TLD; missing keys mean "no suggestion".
    tld_substitutions:
      ai: [io, tech, app]
      app: [io, dev, ai]
      dev: [io, app, tech]
    # review G5 — opt into LiveInventoryContract by setting > 0. The
    # grounder scans `StructuredIndex.iter_payloads()` for distinct TLDs at
    # most every TTL seconds (snapshot bumps invalidate the cache early). Set
    # to 0 to keep the static-only allowlist path (test-friendly default).
    live_inventory_ttl_seconds: 60
    ch_tld_refresh_enabled: true
    ch_tld_refresh_interval_seconds: 21600
    ch_tld_lookback_days: 14
    ch_tld_query_sql: >-
      SELECT tld FROM {database}.analytics_auctions_by_tld
      WHERE event_day >= today() - {lookback_days}
      GROUP BY tld
      HAVING SUM(total_bids) > 0
    # Query types for which L0 entity extraction results are discarded after L1/L2
    # determines the final intent type. Prevents filter chips from being attached to
    # intent slices that carry advisory or informational semantics rather than
    # structured search constraints.
    suppress_for_query_types:
      - guidance
      - explore
      - analytics
    # Maximum character count for the bare-word TLD match in the filter-signal regex
    # (pattern: `\b(?:in|ending in|extension)\s+\.?[a-z]{2,N}\b`). Value 5 matches TLDs
    # up to .store/.cloud but excludes generic English nouns like "domains" (7) and
    # "auctions" (8). Increase to recover longer-TLD phrases; decrease to reduce FPs.
    tld_context_match_max_chars: 5
    # Country/generic TLD words to remove from the bare-word TLD+domains pattern
    # (`\b(?:com|net|...|in|...)\s+domains?\b`). Used to suppress false positives
    # from ccTLDs that also read as common English words ("in" = India ccTLD but also
    # a preposition — "browse in domains" should not fire a TLD filter signal).
    tld_word_bare_exclusions:
      - in
    # Paired directional slot pairs [min_slot, max_slot]: when L0 already sets one direction,
    # L2 LLM is blocked from adding the opposing direction for the same semantic constraint.
    # Prevents domain_age_max leaking from LLM when L0 regex already resolved domain_age_min.
    paired_direction_slots:
      - [domain_age_min, domain_age_max]
      - [traffic_min, traffic_max]
      - [price_min, price_max]
      - [name_length_min, name_length_max]
      - [bids_min, bids_max]
      - [govalue_min, govalue_max]
      - [semrush_authority_min, semrush_authority_max]
      - [semrush_search_volume_min, semrush_search_volume_max]
      - [semrush_backlinks_min, semrush_backlinks_max]
      - [semrush_ref_domains_min, semrush_ref_domains_max]
      - [semrush_indexed_pages_min, semrush_indexed_pages_max]
      - [semrush_cpc_min, semrush_cpc_max]
      - [majestic_tf_min, majestic_tf_max]
      - [majestic_cf_min, majestic_cf_max]
      - [majestic_backlinks_min, majestic_backlinks_max]
      - [majestic_ref_domains_min, majestic_ref_domains_max]
      - [syllable_count_min, syllable_count_max]
    # Structural aggregate-question gate. Fires at the L0_fallback decision point
    # when the query names a marketplace object AND carries an aggregate operator.
    # A strong operator (count, average, distribution ...) fires on its own; a weak
    # popularity operator (top, most, trend ...) fires only with a companion term
    # (by, per, volume ...) so analytics leaderboards separate from explore browses.
    # When fired, the fallback intent type is set to 'analytics' instead of the
    # default_query_type. Operator/companion terms at most word_boundary_max_length
    # characters match on a word boundary; longer terms and all nouns match as
    # substrings. Additive/optional: when omitted the gate is disabled and
    # L0_fallback always uses default_query_type.
    aggregation_gate:
      enabled: true
      word_boundary_max_length: 5
      marketplace_nouns:
        - "listing"
        - "auction"
        - "bid"
        - "domain"
        - "tld"
        - "categ"
        - "authority"
        - "govalue"
        - "traffic"
        - "price"
        - "registrar"
        - "backlink"
        - "word"
        - "letter"
        - "da"
      strong_operators:
        - "count"
        - "total"
        - "average"
        - "avg"
        - "median"
        - "mean"
        - "distribution"
        - "percentage"
        - "percent"
        - "share of"
        - "ratio"
        - "correlat"
        - "how many"
        - "number of"
        - "volume"
        - "frequency"
        - "breakdown"
        - "broken down"
        - "premium by"
        - "impact on"
        - "do shorter"
        - "do domains"
        - "does traffic"
        - "does higher"
        - "does da"
        - "do longer"
        - "days until"
        - "or more"
        - "or fewer"
        - "or above"
        - "or below"
        - "or less"
        - "pending delete"
        - "high govalue"
        - "where govalue"
        - "low govalue"
        - "single bid"
        - "no bid"
        - "zero bid"
      weak_operators:
        - "top"
        - "most"
        - "highest"
        - "lowest"
        - "ranked"
        - "rank"
        - "trend"
        - "growth"
        - "growing"
        - "vs"
        - "versus"
        - "compared"
        - "correlate"
      weak_operator_companions:
        - "by "
        - "per "
        - "count"
        - "volume"
        - "average"
        - "avg"
        - "current bid"
        - "bid price"
        - "authority"
        - "govalue"
        - "ratio"
        - "rate"
        - "activity"
        - "by month"
        - "by tld"
        - "by category"
        - "by quarter"
        - "over month"
        - "year vs"
        - "bids"
        - "listing"
        - "competitive"
        - "active listing"
    # N-gram log-odds pre-gate. Disabled until a weights file is trained and deployed.
    # Train offline with: python -m semantic_search.qi.training.ngram_trainer
    # Fires before intent_pre_gate when enabled; falls through to intent_pre_gate when absent.
    ngram_pre_gate:
      enabled: true
      model_path: "${LOCAL_PRETRAINED_DIR:-.pretrained}/ngram_pregate/weights.json"
      confidence_threshold: 2.0
      emit_confidence: 0.75
      max_ngram_order: 2
      margin_threshold: 1.5
  # Production Matryoshka profile: encoder.backend=fastembed, encoder.dim=768 (nomic native).
  # FastEmbedEncoder returns the full 768-dim vector; the cascade slices into per-stage dims
  # (router=768 / shortlist=512 / rerank=768) via StageEncoder adapters — one inference, three serving lengths.
  # Dim allocation: qi.semantic.embedding_dim=768 (router), retrieval.vector.embedding_dim=512
  # (shortlist). The analytics NL-to-SQL cache is exact (case-insensitive), no embedding.
  # All consumers receive a StageEncoder; no consumer uses the 768-dim base encoder directly.
  # Test / CI override: backend=hashing, dim=32, cascade.enabled=false, all embedding_dim=32.

  # Shared text encoder.
  # Same instance feeds the L1 semantic router, the in-memory vector index, and
  # both semantic caches (search-side + analytics-side). Selecting `fastembed`
  # here flips the entire stack to the production embedding model with zero
  # call-site changes — every consumer reads the `qi.encoder.Encoder` protocol.
  # `backend` choices:
  #   - `fastembed` (production): model configured via qi.encoder.model_name,
  #     backed by FastEmbed ONNX-Runtime, CPU-first. Matryoshka cascade
  #     implemented by truncate + renormalise. Requires task-type prefix:
  #     query_prefix="search_query: " at serve time; use "search_document: "
  #     for the vectorization / data-rebuild encoder instance.
  #   - `hashing` (test / degraded-mode default): `HashingEncoder`, deterministic,
  #     no network, no model download. Keeps the test suite zero-IO.
  encoder:
    # allow restoring confidence_threshold to 0.90. Test / CI: switch to backend: hashing, dim: 32, cascade.enabled: false.
    backend: fastembed
    model_name: *encoder_model
    # Absolute path to the pre-downloaded model directory. No network download
    # is ever attempted. If this directory is missing at startup the service
    # degrades to HashingEncoder with a warning log.
    local_model_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/nomic-ai/nomic-embed-text-v1.5"
    # Base encoder dim = 768 (native Matryoshka output). FastEmbedEncoder returns
    # the full 768-dim vector; the cascade wrapper slices into per-stage dims
    # (router=768 / shortlist=512 / rerank=768) via StageEncoder adapters — one
    # inference serves all consumers at their configured lengths.
    # nomic-embed-text-v1.5 requires layer_norm before any Matryoshka slice;
    # FastEmbedEncoder sets requires_layer_norm_truncation=True for nomic models
    # and MatryoshkaCascadeEncoder applies _layer_norm_vec automatically.
    dim: 768
    # FastEmbed internal scratch directory (not used for model lookup).
    cache_dir: ""
    # ONNX-Runtime intra-op thread count. 0 = library default (registry passes
    # threads=None so ORT auto-detects core count).
    threads: 0
    # Pre-embed raw-text cap uses max_length × 8 code points; tokenizer truncation follows the FastEmbed ONNX bundle.
    max_length: 1024
    # Internal FastEmbed batch size for `encode_batch` calls.
    batch_size: 512
    # Task-type prefix prepended to every input before encoding.
    # Use "search_query: " at query/routing time.
    # Set to "search_document: " in the vectorization encoder override for data rebuilds.
    query_prefix: "search_query: "
    # Async batching encoder: coalesces concurrent encode_async() calls into
    # a single encode_batch() within window_ms. Reduces ONNX inference overhead
    # under concurrent load. Disable to fall back to per-request asyncio.to_thread.
    batching:
      enabled: true
      window_ms: 8.0
    # Matryoshka embedding-cascade (Plan §3.B): one 768-dim inference, three serving
    # lengths. router=768 (QI L1), shortlist=512 (Qdrant retrieval), rerank=768 (re-rank head).
    # nomic-embed-text-v1.5 natively supports: 64 / 128 / 256 / 512 / 768.
    cascade:
      enabled: true
      supported_dims: [64, 128, 256, 512, 768]
      # false = allow the cascade to drive any base encoder (incl. the
      # HashingEncoder fallback when the local nomic model is absent), so the
      # 768->256/512/768 stage encoders are built and dim checks pass for local
      # runs. With the real FastEmbed model present this flag is a no-op (the
      # native cascade is built regardless). Set back to true for a deployment
      # that must refuse loudly when the model fails to load.
      require_native_cascade: false
      stage_dims:
        # Router runs at 768 (full native dim) so the L1 learned head — trained at
        # 768 — is dimensionally compatible. Matryoshka: the base encode is always a
        # single 768 forward pass, so 768 vs 256 here costs ~0 extra latency (it only
        # skips the truncate-to-256 step). MUST equal qi.semantic.embedding_dim.
        router: 768
        shortlist: 512
        rerank: 768

  # L1 — Semantic Router (embedding centroids per archetype)
  semantic:
    enabled: true
    # Minimum cosine similarity for T1 to produce any result at all.
    # This is the "signal above noise" gate — NOT the "T1 is authoritative" gate.
    # The authoritative gate is qi.routing.accept_confidence.
    # With HashingEncoder (LSH), real-query cosine similarities sit ~0.40–0.70;
    # L1 fast-path gate: SemanticRouter returns result only when top cosine score
    # meets or exceeds this threshold.
    confidence_threshold: 0.90
    # Embedding dimension used by the L1 router. With cascade enabled, this is
    # the router stage dim (768 — full native dim, to match the 768-trained learned
    # head). MUST equal cascade.stage_dims.router.
    embedding_dim: 768
    # Hashing seed used only when `qi.encoder.backend == 'hashing'`. Production
    # (`fastembed`) ignores it — model weights are deterministic by construction.
    encoder_seed: 13
    # externalized cold-start seed dataset
    # Curated YAML loaded by `RouterSeedLoader` and converted into per-archetype centroids.
    # The inline `archetype_prototypes` block below MUST stay empty in production; it is
    # an opt-in test override (set `seeds_path: ''` and populate `archetype_prototypes`
    # to bypass the loader, used only by fixtures that need < min_seeds_per_archetype).
    seeds_path: "qi/router_seeds.yaml"
    # Per-archetype seed-count floor — loader rejects any archetype below this count at startup
    min_seeds_per_archetype: 30
    # Inline override (test-only). Exactly one of {seeds_path, archetype_prototypes}
    # must be populated; both populated or both empty raises ConfigurationError.
    archetype_prototypes: {}
    # Tier-2 centroid archetypes to omit from L1 scoring. Previously analytics
    # was excluded because it was routed via LLM; now that the router has 100+
    # strong analytics seeds (time-window aggregation vocabulary is distinctive),
    # L1 can classify analytics reliably. Clearing the exclusion eliminates the
    # largest remaining source of forced L2 LLM calls.
    centroid_exclusions: []
    # Number of K-means sub-centroids per archetype.
    # The hybrid archetype spans four distinct query clusters
    # (filter-only, semantic/brand, combined filter+semantic, pure structured), and
    # analytics spans velocity/distribution/comparison/conversion patterns. More
    # sub-centroids produce tighter clusters, which raises peak cosine similarity
    # for individual queries and increases the L1 hit rate at the 0.82 gate.
    num_sub_centroids: 4

    # Phase-4 learned-head dispatch (multinomial logistic regression trained
    # offline on positives + Phase-3 hard negatives). When omitted / null,
    # the live router uses the legacy centroid scorer (legacy behaviour).
    # Set to:
    #   learned_head:
    #     kind: logistic
    #     model_path: semantic_search/qi/training_data/semantic_head_v1.npz
    #     min_seed_count: 100
    # to swap the scorer at startup. Reversible by reverting to null.
    learned_head:
      # 'centroid' = disabled (legacy K-means scorer). Any other value enables the
      # learned head. 'auto' = load whatever artefact is at model_path and detect its
      # type (logistic / svm / gradient_boosting / deep) by peeking the .npz 'kind' tag
      # at startup. Dispatch NEVER reads this field for the algorithm — so a retrain
      # that swaps SVM → logistic → deep needs no config change. The head must encode at
      # the same dim as the L1 router (768 = cascade.stage_dims.router) or it is rejected.
      kind: auto
      # Served from the S3-synced pretrained store (baked into the image by
      # `COPY pretrained/`), same as nomic/GLiNER/spaCy — NOT from git. CI runs
      # `aws s3 sync $PRETRAINED_S3_URI ./pretrained` before the build, so the
      # head lands at /app/pretrained/trained_semantic_router/. The env-expanded
      # absolute path makes the loader use it directly (skips the package-relative
      # resolve). Retrain output must be
      # published to s3://<bucket>/pretrained/trained_semantic_router/ to deploy.
      model_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/trained_semantic_router/semantic_head_v1.npz"
      min_seed_count: 100
      # Fail-loud: when kind != 'centroid' and the artefact is missing / invalid /
      # below min_seed_count, raise at startup instead of silently degrading to
      # the centroid scorer. Prevents prod from running the weak L1 path unnoticed.
      strict: true

  # L2 — LLM classifier (used only when L0 + L1 cannot meet the confidence gate)
  llm:
    enabled: true
    task_type: query_intent_classification
    prompt_tag: qi.classify.v19
    # Schema / response-contract version for intent stamps and intent-result
    # cache keys. Bump when the classify JSON contract or grounding shape changes.
    schema_version: "1"
    # Confidence floor accepted from the LLM; below this the engine discards the
    # LLM result and falls through to T1/fallback. Must be > fallback_confidence
    # so the fallback ladder can still rescue a T1 classification.
    min_confidence: 0.42
    # Tier-3 hard wall-clock cap. The budget must cover both cold structural-gate
    # probes (~2s parallel across 3 models on first request after restart) AND
    # the actual LLM classification call (~2-4s for haiku/sonnet). Startup warmup
    # populates the probe cache so steady-state only pays the classify latency;
    # this cap protects the rare cold-start and probe-cache-miss cases.
    # Must be < search_timeout_seconds (10.0) minus retrieval headroom (~2.0s).
    tier_3_timeout_seconds: 3.0
    # Upper edge of the confidence band where the Tier-3 classifier may emit
    # alternative interpretations (pre-dedupe cap below). Formerly tied to the
    # removed disambiguation gate's high band.
    alternative_band_high: 0.5
    # Hard cap on alternatives emitted per Tier-3 call (pre-dedupe).
    max_alternative_interpretations: 2
    # When L1 SemanticRouter confidence >= this threshold, skip L2 LLM classify entirely.
    # L2 runs sequentially AFTER L1 only when L1 fails to reach this confidence; it never
    # runs in parallel with L1. L0 entities are sufficient at high L1 confidence.
    # Set to 1.01 to always run L2. Range [0.0, 1.01].
    l1_skip_l2_confidence_threshold: 0.90
    # Maximum OR-terms the LLM may extract verbatim into a keyword_contains list.
    # Prevents runaway expansion when users list many topic alternatives ('AI, ML, LLM, ...').
    keyword_expansion_max_terms: 5
    # Hard timeout for entire _classify_single() stage. Prevents runaway classifier latency
    # from consuming SLA budget. 0.0 = disabled.
    classify_timeout_seconds: 4.0
    # Max simultaneous in-flight L2 LLM calls across all concurrent requests.
    # Tasks that cannot acquire a slot queue inside asyncio; if L1 wins, the queued task is cancelled before the slot is taken.
    max_concurrent_l2: 4

  # Hard vs soft entity-slot taxonomy (required when l0_llm_entity.enabled).
  # Soft slots: full-search rank/response taxonomy. L0 LLM (L0LLMFilterExtractor —
  # same prompt as qie_only/grounding) emits FIND + soft; regex soft only when
  # LLM unavailable. soft_apply_mode=rank → SoftKeywordApplier post-diversify
  # pre-truncate boost via soft_rank_slot_names (keywords + topic/similar_to).
  # soft_response_key = response soft_signals.
  entity_slots:
    soft_response_key: soft_signals
    soft_group_tag: soft
    soft_apply_mode: rank
    soft_rank_boost_weight: 0.15
    soft_rank_miss_penalty_ratio: 0.25
    soft_rank_partial_boost_ratio: 0.5
    soft_rank_slot_names:
      - keyword_contains
      - keyword_starts_with
      - keyword_ends_with
      - keyword_phrase
      - keyword_match_mode
      - topic_include
      - topic_exclude
      - similar_to
      - word_count_min
      - word_count_max
    soft_slot_names:
      - keyword_contains
      - keyword_starts_with
      - keyword_ends_with
      - keyword_phrase
      - keyword_match_mode
      - topic_include
      - topic_exclude
      - similar_to
      - word_count_min
      - word_count_max
      - lifecycle_state
      - lifecycle_disjunction
    hard_entity_names:
      - tld
      - price_min
      - price_max
      - auction_type
      - name_length_max
      - name_length_min
      - time_remaining_max
      - sld_exact
      - syllable_count_min
      - syllable_count_max
      - has_hyphen
      - has_number
      - is_idn
      - bids_min
      - bids_max
      - domain_age_min
      - domain_age_max
      - days_listed_max
      - days_listed_min
      - price_below_market
      - traffic_min
      - traffic_max
      - has_web_traffic_signal
      - traffic_is_unknown
      - domain_age_is_unknown
      - govalue_min
      - govalue_max
      - majestic_tf_min
      - majestic_tf_max
      - majestic_cf_min
      - majestic_cf_max
      - majestic_backlinks_min
      - majestic_backlinks_max
      - majestic_ref_domains_min
      - majestic_ref_domains_max
      - tlf_exact_match
      - tlf_keyword_regs_min
      - tlf_developed
      - semrush_backlinks_min
      - semrush_backlinks_max
      - semrush_indexed_pages_min
      - semrush_indexed_pages_max
      - semrush_ref_domains_min
      - semrush_ref_domains_max
      - semrush_authority_min
      - semrush_authority_max
      - semrush_search_volume_min
      - semrush_search_volume_max
      - semrush_cpc_min
      - semrush_cpc_max
      # Negation / exclude chips — hard for qie_only chip↔intent parity and Phase 2
      # retrieval (must_not / keyword post-filter / hard-chip gate). Not soft-rank.
      - keyword_contains_exclude
      - tldExcludeList
      - excludeLetters
      - minDigits
      - minLetters
      - charPattern
      - isGemDomain
      - typeExcludeList
      - filterPriceCurrency
      - isExtended
      - isBidAccepted
      - has_reserve_price
      - gd_transfer
      - buy_it_now
      - buy_it_now_min
      - buy_it_now_max
      - endTimeAfter
      - endTimeBefore
      - startTimeAfter
      - startTimeBefore
      - ownerMemberIncludeList
      - ownerMemberExcludeList
      - minUniqueSearches
      - maxUniqueSearches
      - minEstibotDomainCount
      - maxEstibotDomainCount
      - minEstibotDomainCountDev
      - maxEstibotDomainCountDev
      - minEstibotExtCount
      - maxEstibotExtCount
      - minEstibotExtCountDev
      - maxEstibotExtCountDev

  # L0 LLM filter extractor — single-call FIND-63 + soft/local (same prompt/catalog
  # as qie_only grounding). Used for full-search classify_async and qie_only
  # extract; no parallel-group secondary extractor.
  l0_llm_entity:
    enabled: true
    task_type: l0_entity_extraction
    timeout_seconds: 4.0
    max_entities: 80
    confidence: 0.9
    source_tag: L0_llm
    # Prompt + schema versions for L0 extract logs, qie_only response echo,
    # and qie_only L0 filter cache keys. Bump prompt_tag on prompt edits;
    # bump schema_version when the extract JSON / identified_filters shape changes
    # or when extract input text policy changes (e.g. classify_on_transformed_query).
    prompt_tag: qi.entity.l0_filter.v8
    schema_version: "5"
    # Combined rewrite+extract path (token_count > rewrite_threshold). Separate
    # tags isolate L0 filter cache keys from extract-only responses.
    combined_prompt_tag: qi.entity.l0_filter_rewrite.v8
    combined_schema_version: "5"
    # Minimum keyword probability as a percentage (0-100). Keywords with
    # probability < this are dropped from the extracted keyword list (LLM path).
    # Regex path: N/A — regex does not emit keyword probabilities (no silent 50%).
    keyword_min_probability: 70

  # Deterministic regex entity extractor. Runs offline (no call_router); emits hard
  # filter slots (tld, price, auction_type, name length, bids, age, keyword, char)
  # matching the FIND-63 LLM extract patterns (via entity_slot_to_api_param.json).
  # Sequential: LLM first; regex only when LLM unavailable when
  # fallback_only_when_llm_unavailable=true (not when LLM returns empty/no filters).
  l0_regex_entity:
    enabled: true
    max_entities: 80
    confidence: 0.9
    source_tag: L0_regex
    fallback_only_when_llm_unavailable: true

  # Tier-0 in-process intent-result cache. Exact normalized-query → QueryIntent.
  # Auto-scales from warm-up capacity to scaled capacity when hits reach scale_at_hit_count.
  # RAM: warm-up ~1 MB (1 000 entries × ~1 KB); scaled ~100 MB (100 000 entries).
  intent_result_cache:
    enabled: true
    ttl_seconds: 300           # warm-up: 5-min TTL; covers bursty repeat traffic
    max_entries: 1000          # warm-up: ~1 MB RAM
    scale_at_hit_count: 500    # after 500 cumulative hits → scale up
    max_entries_scaled: 100000 # scaled: ~100 MB RAM cap
    ttl_seconds_scaled: 1800   # scaled: 30-min TTL (larger store → longer reuse)

  # Tier-0.5 QI semantic intent cache — fuzzy normalized_query → QueryIntent.
  # Encodes the incoming query and returns a cached QueryIntent iff the most
  # similar stored entry exceeds similarity_threshold. Catches rephrased queries
  # that miss the exact-match cache. embedding_dim must equal qi.semantic.embedding_dim (cascade router stage = 768).
  semantic_intent_cache:
    # Off until Phase 2 structural TLD/negation/price gate exists (MLS-Q8).
    # qie_only never uses this cache; only QIEngine.classify does.
    enabled: false
    similarity_threshold: 0.97      # conservative; wrong-intent misses are worse than LLM cost
    max_entries: 5000               # ~5 MB RAM (5 000 entries × ~1 KB per QueryIntent)
    ttl_seconds: 1800               # 30-min TTL — same as scaled exact cache
    embedding_dim: 768              # router stage dim (must match qi.semantic.embedding_dim = cascade.stage_dims.router)
    # Per-query-type similarity threshold overrides. When the cached intent's primary
    # query_type matches a key here, that threshold is used instead of similarity_threshold.
    # Explore queries use a much higher threshold to prevent diverse exploratory queries
    # (e.g. "hidden gems" vs "sleeper picks") from returning each other's cached results.
    type_specific_similarity_thresholds:
      explore: 0.99

  # Query text normalization for cache keys and QI classify/encode inputs.
  normalize:
    lowercase: true
    collapse_whitespace: true
    whitespace_pattern: '\s+'
    normalize_quotes: true
    quote_translations:
      - from_codepoint: 8216   # left single quotation mark
        to_char: "'"
      - from_codepoint: 8217   # right single quotation mark
        to_char: "'"
      - from_codepoint: 8218   # single low-9 quotation mark
        to_char: "'"
      - from_codepoint: 8219   # single high-reversed-9 quotation mark
        to_char: "'"
      - from_codepoint: 8220   # left double quotation mark
        to_char: '"'
      - from_codepoint: 8221   # right double quotation mark
        to_char: '"'
      - from_codepoint: 8222   # double low-9 quotation mark
        to_char: '"'
      - from_codepoint: 8223   # double high-reversed-9 quotation mark
        to_char: '"'
      - from_codepoint: 8242   # prime
        to_char: "'"
      - from_codepoint: 8243   # double prime
        to_char: '"'
      - from_codepoint: 8245   # reversed prime
        to_char: "'"
      - from_codepoint: 96     # grave accent
        to_char: "'"
    expand_gd_alias: true
    strip_trailing_punctuation: true
    trailing_punctuation_chars: "?!.,;:"

  # Confidence-gated routing — what counts as "decided" without escalating.
  routing:
    # Engine accepts a tier's verdict iff calibrated confidence >= this value.
    accept_confidence: 0.80
    # Below this the engine falls back to default_query_type.
    # Set below LLM min_confidence so a weak T1 explore result still beats
    # a random hybrid default (e.g. "show me trending domains" at T1=0.35).
    fallback_confidence: 0.30
    # UX routing_mode on QueryIntent: confidence >= routing_auto_execute_min -> auto_execute;
    # >= routing_suggest_min -> suggest; else explore.
    routing_auto_execute_min: 0.85
    routing_suggest_min: 0.55
    # How long (ms) T1 waits for T0 entity output before encoding without entity-stripping.
    t0_hint_wait_ms: 50
    # Margin-aware escalation gate. Even when T1 calibrated confidence clears
    # accept_confidence, escalate to T2 (LLM) when the top-2 archetype margin
    # (top1 - top2) is below this threshold. Catches confusable archetypes
    # (e.g. hybrid vs explore) where cosine difference is too small to trust.
    # 0.0 = legacy behaviour (pure absolute-confidence gate). Tunable; ramp
    # to 0.10+ once Phase 4 learned head ships.
    margin_min: 0.10
    # Hard-filter override: when L0_entity extracted >= hard_chip_override_min
    # hard-chip entities and L1 returned an intent in hard_chip_override_intents
    # at confidence below accept_confidence, force the query_type to hybrid and
    # return immediately with L0's entities — skip L2 LLM escalation entirely.
    # Rationale: queries with 2+ explicit structured constraints (tld + price,
    # tld + price + auction_type, etc.) are unambiguously search queries; the
    # semantic residual is too short for L1 to distinguish guidance from hybrid,
    # and L2 adds ~1-2 s of latency without correcting the misclassification.
    # Set to 0 to disable (default-off; enable once golden-seed coverage
    # confirms the gate does not suppress genuine guidance queries).
    l0_fallback_force_hybrid_slots:
      - tld
      - price_max
      - price_min
      - auction_type
      - name_length_max
      - name_length_min
      - keyword_contains
      - keyword_starts_with
      - keyword_ends_with


    # Gate not yet implemented in engine; set to 0 (disabled) per config spec.
    hard_chip_override_min: 0
    hard_chip_override_intents:
      - guidance
      - explore

  # Tier-0 spell-correct + 'did you mean' surface (SymSpell frequency-dictionary-backed).
  # OPTIONAL sub-block: omit it to disable the corrector entirely (zero
  # overhead, identical behaviour to the pre-Rec-#12 build). When present,
  # the corrector runs AFTER QI normalize and BEFORE the cache lookup so
  # an auto-applied correction reaches the cache key (a typo'd query and
  # its corrected sibling share a single cache entry). The dictionary is
  # the bundled English frequency dictionary shipped with symspellpy
  # (82K terms); point frequency_dict_path at a custom file to override.
  # Head-trainer config — consumed by head_trainer._cli_main() as config-level
  # defaults. CLI flags (--max-epochs, --max-time, etc.) override per-run.
  # All search-range bounds and tree hypers live here; head_trainer.py has no
  # hardcoded training constants of its own.
  training:
    max_epochs: 10000
    patience: 20
    holdout_fraction: 0.1
    random_search_trials: 20
    max_time_seconds: 2700       # 45 minutes wall-clock budget (all classifiers run in parallel)
    classifier: ensemble          # logistic | gradient_boosting | svm | ensemble | deep
    lr_min: 0.05
    lr_max: 2.0
    l2_min: 0.0001
    l2_max: 0.05
    gb_n_estimators: [50, 100, 150, 200]   # smaller for faster per-trial GB/RF time
    gb_max_depths: [3, 4, 5, 6, 0]   # 0 = unlimited (maps to None at runtime)
    gb_learning_rate: 0.1
    log_interval_trials: 5             # log progress every N trials per classifier
    ensemble_classifiers: [logistic, svm, gradient_boosting]
    ensemble_weight_logistic: 1.0
    ensemble_weight_svm: 1.0
    ensemble_weight_gb: 1.0
    svm_c_min: 0.01
    svm_c_max: 100.0
    svm_kernels: [rbf, poly, linear]
    svm_gamma_opts: [scale, auto]

  deep_training:
    hidden_dims: [512, 256]
    dropout: 0.3
    lr: 1.0e-3
    weight_decay: 1.0e-4
    label_smoothing: 0.05
    batch_size: 64
    epochs: 100
    patience: 10
    lr_patience: 5
    lr_factor: 0.5
    min_lr: 1.0e-6
    max_grad_norm: 1.0
    seed: 42
    holdout_fraction: 0.1

  spell_correct:
    enabled: true
    # Path to the SymSpell frequency dictionary. Use "symspellpy:<filename>" to
    # resolve a file bundled with the installed symspellpy package, or supply
    # an absolute path to a custom dictionary in the same tab-separated format
    # (term<TAB>count, one entry per line).
    frequency_dict_path: "symspellpy:frequency_dictionary_en_82_765.txt"
    max_edit_distance: 2
    # SymSpell prefix length index parameter. Must be >= max_edit_distance + 1
    # for full accuracy. Larger values trade index memory for lookup speed.
    prefix_length: 7
    min_token_length: 3
    max_tokens_to_correct: 6
    # Lookup verbosity: TOP returns the single best candidate; CLOSEST returns
    # all candidates at the minimum edit distance; ALL returns every candidate
    # within max_edit_distance.
    verbosity: "CLOSEST"
    # Suggest-only. The generic English frequency dictionary rewrites domain/industry
    # vocabulary absent from it onto the nearest English word (fintech->biotech,
    # saas->says, edtech->tech, crypto->crypt, ecommerce->commerce, brandable->tradable),
    # mutating the intent-carrying keyword before classification and retrieval see it.
    # With auto_apply=false the original query flows through QI unchanged and the
    # corrected text surfaces only as a did_you_mean suggestion; the LLM tier
    # normalizes genuine typos itself.
    auto_apply: false
    # Metric abbreviations that must never be spell-corrected.
    protected_tokens:
      - cpc
      - ctr
      - rpm
      - rpc
      - roi
      - roas
      - govalue
    # Regex patterns (one capture group each) for structural phrase contexts where
    # matched tokens must not be spell-corrected. Applied case-insensitively.
    # Each pattern's group 1 captures the token sequence to protect.
    protected_phrase_patterns:
      - 'end(?:s|ing)?\s+(?:in|with)\s+([a-z0-9]+(?:\s+(?:and|or)\s+[a-z0-9]+)*)'
      - 'start(?:s|ing)?\s+with\s+([a-z0-9]+(?:\s+(?:and|or)\s+[a-z0-9]+)*)'
      - 'contain(?:s|ing)?\s+([a-z0-9]+(?:\s+(?:and|or)\s+[a-z0-9]+)*)'
      - 'exclud(?:e|ing)\s+([a-z0-9]+(?:\s+(?:and|or)\s+[a-z0-9]+)*)'
      - '(?:similar\s+to|comparable\s+to|alternatives?\s+to|like)\s+([a-z0-9][a-z0-9.-]*(?:(?:\s*,\s*(?:(?:or|and)\s+)?|\s+(?:or|and)\s+)[a-z0-9][a-z0-9.-]*)*)'
      - '(heating\s+up|picking\s+up\s+(?:steam|pace|speed)|cooling\s+down)'
      - '(rising\s+(?:activity|interest|bids|traffic|demand)|sudden\s+interest)'
      - '(safest\s+way|cheapest\s+way|easiest\s+way|fastest\s+way|smartest\s+way|best\s+way)'

  # Tier-2 (L1 semantic router) centroid retraining channel (Plan §"Tier-2
  # router retraining"). When enabled, Subsystems.centroid_retrainer is
  # constructed and exposed via /qi/centroid-retrainer. Ships disabled —
  # the retrainer is read-only with respect to the live router but the
  # promotion gate (a future CentroidRetrainPromoter) is not yet wired.
  centroid_retrainer:
    enabled: false
    # Per-archetype trusted-positive floor (plan default 500). Below this
    # floor, the archetype is dropped from the candidate.
    min_samples_per_archetype: 500
    # Minimum shadow agreement rate for verdict='promote'. Below this floor
    # the verdict is 'shadow_only'.
    min_shadow_agreement: 0.85
    # Time window the source positives were drawn from. Stored on the
    # candidate for auditing only.
    window_seconds: 604800.0  # 7 days
    max_signals_per_read: 10000
  # Background driver that polls SignalStore and runs centroid retrain cycles.
  # Requires centroid_retrainer.enabled=true. Ships disabled — set enabled=true
  # and tune interval_seconds to activate live centroid learning.
  centroid_retrainer_driver:
    # PROD: set enabled=true to activate live centroid learning from positive
    # signals (result_click, calibration_label). Kept false in base/dev because
    # it mutates live L1 centroids; enable only where positive signals actually
    # flow and centroid swaps are wanted. Implementation verified (62 tests).
    enabled: false
    # Cadence between retrain cycles in seconds (>= 10.0). Default 1 hour.
    interval_seconds: 3600.0
    # Max shadow-probe queries extracted from recent signals per cycle.
    shadow_query_limit: 200
    # Consecutive cycle errors before exponential back-off applies.
    max_consecutive_failures: 3
    # Signal types whose payloads carry query_text + query_type and are treated
    # as per-archetype positives for centroid recomputation.
    positive_signal_types:
      - result_click
      - calibration_label

  # ---------------------------------------------------------------------------
  # Offline router retraining pipeline (ClickHouse → traffic ring buffer → seeds → .npz).
  # At startup, if enabled, checks whether new_signals_threshold positive signals have
  # accumulated in ClickHouse since the last retrain run. If yes, a background task
  # harvests from ClickHouse, appends to the traffic_signals.jsonl ring buffer (FIFO
  # eviction at traffic_signals_max_rows), merges qualifying archetypes into
  # router_seeds.yaml, and runs train_all_models.py to produce a new .npz artifact.
  # Ships disabled — set enabled=true to activate.
  # ---------------------------------------------------------------------------
  router_retraining:
    enabled: false
    # ClickHouse connection is NOT duplicated here — the harvest pipeline reads
    # retrieval.clickhouse at runtime (single source of truth; no hardcoded host/port/user).
    # How many days of ClickHouse history to pull per harvest run.
    clickhouse_lookback_days: 30
    # Signal types whose payload carries query_text + query_type (archetype positives).
    positive_signal_types:
      - result_click
      - calibration_label
    # Cap on signals fetched per archetype per harvest run.
    max_signals_per_archetype: 500
    # Minimum new texts per archetype before they are merged into router_seeds.yaml.
    min_new_signals_per_archetype: 20
    # Total new ClickHouse signals since last retrain before the pipeline auto-fires.
    new_signals_threshold: 500
    # JSONL ring buffer for harvested traffic positives (one JSON object per line).
    # FIFO eviction kicks in once the file exceeds traffic_signals_max_rows lines.
    traffic_signals_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/semantic_router/traffic_signals.jsonl"
    traffic_signals_max_rows: 1000000
    # Timestamp marker file — records the last time retraining completed.
    last_retrain_marker_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/semantic_router/.last_retrain"
    # router_seeds.yaml path (empty string = resolved from qi.semantic.seeds_path at startup).
    seeds_path: ""
    # Output .npz path for the trained learned head artifact.
    output_npz_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/trained_semantic_router/semantic_head_v1.npz"
    # Ngram gate co-retrain (same seeds, fired after train_all_models.py; empty = skip).
    ngram_weights_output_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/ngram_pregate/weights.json"
    ngram_top_k: 200
    ngram_min_log_odds: 0.3
    # Hard-negative mining: mine confusable seeds and oversample them during training.
    # hard_negatives_path: EPHEMERAL mined-JSONL scratch — re-mined fresh from the
    # current seeds each run and deleted after training (not a kept reference).
    # Lives with the router head it serves, NOT in the ngram scorer dir (which holds
    # only weights.json).
    # hard_neg_oversample: how many extra copies of each hard example are added to X_tr (0 = disabled).
    # hard_neg_threshold: cosine score above which a seed counts as confusable with another archetype.
    hard_negatives_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/trained_semantic_router/hard_negatives.jsonl"
    hard_neg_oversample: 2
    hard_neg_threshold: 0.65

  # ---------------------------------------------------------------------------
  # flan-t5 seq2seq query rewriter — condenses verbose queries to a concise
  # search query. Mode is chosen purely by whitespace-token count:
  #   token_count >  rewrite_threshold  -> rewrite (seq2seq generation)
  #   token_count <= rewrite_threshold  -> passthrough (unchanged)
  # Model loaded once at startup (resident in memory) via registry; soft-fails to
  # passthrough on any load/inference error. Offline: local_files_only=True.
  # ---------------------------------------------------------------------------
  query_transformer:
    enabled: true
    # Mode toggle. When false, the rewriter logs and passes the query through unchanged.
    rewrite_enabled: true
    # When true and rewrite transforms, vector ANN encode/residual uses rewrite text.
    # Passthrough keeps original encode. Orthogonal to classify_on_transformed_query.
    encode_from_rewrite: true
    # When true: spell+transform complete first, then QI classify / L0 extract /
    # multi-intent split on effective text (transformed query if accepted; else
    # spell-corrected or normalized passthrough). Disables parallel overlap with QI.
    # When false: QI runs on pre-rewrite normalized (legacy overlap path allowed).
    classify_on_transformed_query: true
    # When true: token_count > rewrite_threshold uses ONE LLM call that returns
    # rewrite + filters/keywords grounded on the rewritten query. Skips standalone
    # QueryTransformer.transform LLM on that path. Passthrough (≤ threshold) still
    # uses extract-only L0. When false: legacy separate transform + L0 calls.
    combine_rewrite_with_l0_extract: true
    # When combined rewrite is rejected by echo/signal guards: if true, run a
    # follow-up extract-only call on normalized; if false, discard combined filters
    # and leave extract to the engine/regex path.
    on_rewrite_reject_reextract: true
    # LLM tier switch. true = LLM primary + local seq2seq fallback. false = skip the
    # LLM entirely and use the local flan-t5 tier only (basic rewrite, no API cost/latency).
    llm_tier_enabled: true
    # --- token-count gate (both tiers) ---
    # Strictly-more-than this -> rewrite. 8 keeps short/normal queries untouched
    # and rewrites only verbose 9+ token queries.
    rewrite_threshold: 8
    # Echo guard (both tiers). If a tier copies a leading run of the query (keeping
    # filler) instead of condensing, the output is a contiguous span of the original
    # starting within this many leading tokens -> rejected, next tier / passthrough.
    # 1 tolerates a dropped leading word (e.g. "hey ...") still counting as echo.
    rewrite_echo_max_start_offset: 1
    # --- tier 1: LLM (primary) ---
    # Task type -> the LLMProvider fallback chain selects the model (see
    # model_selection_strategy.task_type_preferences.query_rewrite + task_cost_caps).
    # No model name is set here: whichever configured model is cheapest-and-capable serves.
    task_type: query_rewrite
    # Stable identifier used in LLM call logs.
    prompt_tag: query_rewrite_v1
    # Hard wall-clock cap on the LLM tier. On timeout the local tier serves.
    # API round-trip exceeds sub-second, so a tight cap forces the local tier on
    # every request; 2.5s lets the LLM tier land within the query response budget.
    timeout_seconds: 2.5
    # System role content for the LLM rewrite. Folded scalar -> newlines become spaces.
    llm_system_prompt_template: >-
      You condense a verbose domain-search query into the core search keywords.
      Drop filler and polite words. Keep product type, domain extension and price.
      Respond with a single JSON object of the form {"rewritten_query": "<keywords>"}
      and nothing else.
    # User role content. The literal {query} placeholder is substituted at call time.
    llm_user_prompt_template: >-
      Query: {query}
    # --- tier 2: local seq2seq fallback ---
    # Local flan-t5 dir (AutoModelForSeq2SeqLM + tokenizer). Resolved from the
    # LOCAL_PRETRAINED_DIR env var (.env); falls back to the baked image path.
    # Serves only when tier 1 times out, errors, or no LLM router is wired.
    model_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/google/flan-t5-base"
    # Generation prompt for the local tier. The literal {query} placeholder is
    # substituted at rewrite time. Few-shot examples steer the model to drop
    # filler/polite words and emit ONLY core keywords. Folded scalar.
    rewrite_prompt_template: >-
      Extract only the important search keywords. Drop filler and polite words.
      Keep product type, domain extension and price.
      Query: i want to find cheap dot io domains for my new startup
      Keywords: cheap io domains startup
      Query: please could you show me the best expiring ai domains under 200
      Keywords: best expiring ai domains under 200
      Query: hey can you get me some premium short brandable names for sale
      Keywords: premium short brandable names sale
      Query: i would really like a cheap dot com domain for my blog
      Keywords: cheap com domain blog
      Query: what are the top available domains for a fintech company
      Keywords: top available domains fintech company
      Query: {query} Keywords:
    # Generation cap (max_new_tokens) for the local rewritten query.
    rewrite_max_new_tokens: 10
    # Tokenizer input truncation cap for the local tier. Must fit the few-shot
    # prompt + query so the examples are never truncated away.
    max_tokens: 200
    # Guarded replace: a rewrite (either tier) is rejected when it drops a hard
    # signal present in the original query, so a lossy rewrite never replaces the
    # QI input and destroys filter extraction / multi-intent. For each pattern,
    # the accepted rewrite must match it at least as many times as the original.
    # On failure the next tier is tried, then passthrough (original preserved).
    # Empty list disables the guard.
    #   - digits: price / count signals (e.g. "under $50" -> "50")
    #   - dot-TLD literals: "\.net" "\.io" "\.com"
    #   - multi-intent connectives: comma, semicolon, and, or
    signal_preservation_patterns:
      - '\d+'
      - '\.[a-z]{2,}'
      # Filter-bearing phrases a keyword rewrite must not drop (belt-and-suspenders;
      # QI classifies on pre-rewrite text, but reject lossy rewrites for encode/cache).
      - '\b(?:below\s+market|underpriced|undervalued|govalue|appraisal)\b'
      - '\b(?:this\s+week|new\s+this|short)\b'
      - '\btraffic\b'
      # Additive suite cues (append-only; do not weaken rows above).
      - '\b(?:real\s+visitors?|existing\s+traffic|ending\s+tonight|hidden\s+gems?|sleeper)\b'
      - '\b(?:between\s+\$?\d|similar\s+to|sounds?\s+like|no\s+\w+\s+vibe)\b'
      - '\b(?:four|three|five)\s*[- ]?letter\b'
      - '\b(?:one|two|1|2)[- ]?words?\b'

  # ---------------------------------------------------------------------------
  # Domain-term polysemy disambiguator — rewrites bare TLD stems to dot-notation
  # before L0 (GLiNER) and L1 (SemanticRouter) so entity extraction and routing
  # see explicit TLD forms.  L2 (LLM) always receives the original text.
  # Optional/additive: omit or set enabled=false to leave the pipeline unchanged.
  # ---------------------------------------------------------------------------
  term_disambiguator:
    enabled: true
    # Tokens on each side of the ambiguous term to examine for context signals.
    context_window: 3
    # Per-term rules.  topic_context_tokens take priority over tld_context_tokens
    # when both appear in the context window.
    rules:
      - term: ai
        tld_form: ".ai"
        # TLD context: words that indicate the user wants the .ai TLD.
        tld_context_tokens:
          - extension
          - tld
          - names
          - domains
          - cheap
          - premium
          - expiring
          - auction
          - available
          - buy
        # Topic context: words that indicate AI as a subject/industry.
        topic_context_tokens:
          - artificial
          - intelligence
          - machine
          - learning
          - robot
          - automation
          - model
          - llm
          - chatbot
          - gpt
          - startup
          - company
          - powered
          - driven
        # "ai" alone without any context → keep as topic (most users searching "ai"
        # in an auction context mean artificial intelligence, not the Anguilla TLD).
        default_to_tld: false
      - term: io
        tld_form: ".io"
        tld_context_tokens:
          - extension
          - tld
          - names
          - domains
          - cheap
          - premium
          - expiring
          - auction
          - available
          - buy
          - startup
          - saas
          - app
          - dev
          - developer
          - tech
        topic_context_tokens:
          - input
          - output
          - serial
          - protocol
          - bus
          - port
        # "io" alone in domain search almost always means the TLD.
        default_to_tld: true
      - term: co
        tld_form: ".co"
        tld_context_tokens:
          - extension
          - tld
          - names
          - domains
          - cheap
          - premium
          - expiring
          - auction
          - available
          - buy
          - short
        topic_context_tokens:
          - company
          - corporation
          - colorado
          - inc
          - ltd
          - llc
        # "co" alone is ambiguous — keep as topic (could mean company abbreviation).
        default_to_tld: false

  # ---------------------------------------------------------------------------
  # Guidance sub-classifier — assigns QueryIntent.guidance_subtype for guidance
  # queries. Patterns are tested in test_order sequence; first match wins.
  # All patterns are case-insensitive. Queries matching no pattern get None.
  # ---------------------------------------------------------------------------
  guidance_subtype_classifier:
    test_order:
      - valuation
      - strategy
      - market_info
    patterns:
      valuation:
        - '\b(?:worth|apprai(?:se|sed|ses|sal|sing)|govalue)\b'
        - '\b(?:valuat(?:e|ed|ing|ion)|estimated?\s+(?:value|worth|price))\b'
        - '\b(?:what\s+(?:is|would|could)\s+(?:a\s+)?(?:\S+\s+)?(?:domain\s+)?(?:be\s+)?worth)\b'
        - '\b(?:how\s+much\s+(?:is|would|should|could|can)\s+(?:a\s+)?(?:\S+\s+)*(?:domain\s+)?(?:sell\s+for|fetch|be\s+worth))\b'
        - '\bcomparable\s+(?:sales?|transactions?|domain\s+sales?)\b'
        - '\b(?:price\s+(?:estimate|forecast|history|range)\s+for|domain\s+(?:price|valuation)\s+(?:calculator|tool|estimate))\b'
      strategy:
        - '\b(?:should\s+I|is\s+it\s+(?:worth|good|better|best))\b'
        - '\b(?:would\s+you\s+recommend|is\s+(?:buying|acquiring|selling|investing)\s+in)\b'
        - '\b(?:when\s+(?:is\s+it|to\s+buy|to\s+sell)\s+(?:a\s+)?domains?)\b'
        - '\b(?:how\s+(?:do|should|can|would|could)\s+I)\b'
        - '\b(?:advice|advise|recommend(?:ation|ing)?|counsel)\b'
        - '\b(?:best\s+(?:strategy|approach|time|way|practice)\s+(?:for|to))\b'
        - '\b(?:portfolio\s+(?:strategy|management|diversif\w*))\b'
      market_info:
        - '\b(?:average\s+(?:price|sale|auction|value)|market\s+(?:trend|price|rate|data|condition))\b'
        - '\b(?:sell[\s-]through\s+rate|how\s+(?:much|many|often)\s+(?:do|are|is|was|were|did))\b'
        - '\b(?:popular\s+tlds?|trending\s+(?:extensions?|tlds?))\b'
        - '\b(?:which\s+(?:tld|extension|domain\s+extension)\s+(?:is|are|sells?|performs?))\b'
        - '\b(?:historical\s+(?:data|trend|performance|sales)|year\s+over\s+year|yoy|month\s+over\s+month)\b'

  # ---------------------------------------------------------------------------
  # Residual-kind classifier — labels the post-stripping semantic residual as
  # one of {empty, navigational, semantic, valuation} on every single-intent
  # QueryIntent. Drives retrieval.residual_dispatch (Step 3) and
  # retrieval.fusion.weights (Step 4). When disabled, QueryIntent.residual_kind
  # stays None and all downstream consumers fall back to legacy behavior.
  # ---------------------------------------------------------------------------
  residual:
    enabled: true
    # Query-side navigational stop list (lowercased). After T0 entity stripping,
    # tokens in this set are removed; if zero content tokens remain the residual
    # is labelled 'navigational'. Domain-specific high-DF tokens (`domain`,
    # `domains`, `name`, `names`) are explicit because every document in the
    # corpus is a domain and these tokens carry near-zero discriminative signal.
    navigational_tokens:
      - find
      - search
      - show
      - get
      - list
      - look
      - want
      - need
      - buy
      - purchase
      - domain
      - domains
      - name
      - names
      # price comparison operators — stripped by entity extraction; lone survivors
      - under
      - over
      - above
      - below
      - less
      - more
      - than
      # platform-specific high-DF terms — appear in nearly every query, zero SLD signal
      - auction
      - auctions
      - listing
      - listings
      # Aggregate / compare meta — never listing ANN concepts (all archetypes)
      - compare
      - comparing
      - compared
      - comparison
      - versus
      - vs
      - trend
      - trends
      - average
      - avg
      - median
      - stats
      - statistics
      - analysis
      - analytics
      - performance
      - volume
      - distribution
      # Calendar framing leftovers after temporal chips are extracted
      - last
      - past
      - week
      - weeks
      - month
      - months
      - days
      - hours
      - year
      - years
      # universal function words — entity extraction cannot strip these
      # (they are never extracted as filter values)
      - a
      - an
      - the
      - of
      - in
      - on
      - for
      - to
      - at
      - is
      - are
      - i
      - me
      - my
      # conjunctions, coordinating prepositions, and other function words
      # that carry zero domain-name signal and must not bias vector search
      - and
      - or
      - with
      - from
      - by
      - that
      - which
      - as
      - but
      - if
      - when
      - where
      - not
      - no
    # Minimum non-navigational content tokens that must remain after stripping
    # for the residual to be labelled 'semantic'. Below this floor, the residual
    # is labelled 'navigational'. 1 = "any single content word like 'saas' is
    # enough"; raise to 2+ to require richer queries before vector fires.
    min_content_tokens_for_semantic: 1
    # Patterns that reclassify a 'semantic' residual as 'valuation' when matched.
    # Checked after the semantic/navigational/empty split. Only fires for non-empty
    # semantic residuals. Signals the hybrid executor that comparable-sales retrieval
    # is more relevant than standard domain listings. Empty list disables the override.
    valuation_signal_patterns:
      - '\b(?:worth|apprai(?:se|sed|ses|sal|sing)|govalue)\b'
      - '\b(?:valuat(?:e|ed|ing|ion)|estimated?\s+(?:value|worth))\b'
      - '\b(?:what\s+(?:is|would|could)\s+(?:a\s+)?(?:\S+\s+)?(?:domain\s+)?(?:be\s+)?worth)\b'
      - '\b(?:how\s+much\s+(?:is|would|should|could|can)\s+(?:a\s+)?(?:\S+\s+)?(?:domain\s+)?(?:sell\s+for|fetch|be\s+worth))\b'
      - '\bcomparable\s+(?:sales?|transactions?|domain\s+sales?)\b'

  # ---------------------------------------------------------------------------
  # Ensemble pipeline controls. Voters are assembled at registry from live
  # components; this block owns cancel / extract-before-classify / routing bands.
  # ---------------------------------------------------------------------------
  ensemble:
    # Await L0 extract before L1/L2 so entity voter + consensus cancel see filters.
    extract_before_classify: true
    consensus_cancel_l2: true
    consensus_cancel_threshold: 0.80
    routing:
      auto_execute_agreement_min: 0.70
      auto_execute_confidence_min: 0.75
      suggest_agreement_min: 0.50
      suggest_confidence_min: 0.55

  # ---------------------------------------------------------------------------
  # Entity-signal voter for the ensemble resolver.
  # voter_id must match the corresponding entry in qi.ensemble.voters.
  # ---------------------------------------------------------------------------
  entity_voter:
    voter_id: entity
    confidence_emit: 0.90
    signal_only_scale: 0.60
    hard_filter_force_slots:
      - tld
      - price_max
      - price_min
      - auction_type
      - name_length_max
      - name_length_min
      - keyword_contains
      - keyword_starts_with
      - keyword_ends_with
      - has_reserve_price
      - gd_transfer
      - isBidAccepted
      - isExtended
      - traffic_is_unknown
      - domain_age_is_unknown
      - price_below_market
      - buy_it_now
      - buy_it_now_min
      - buy_it_now_max
      - days_listed_max
      - bids_min
      - bids_max
      - time_remaining_max
    veto_archetype: null
    value_discovery_signals:
      - undervalued
      - bargain
      - below market
      - cheap
      - deal
      - discount
      - investment
      - flip
      - resell
      - roi
      - portfolio


# -----------------------------------------------------------------------------
# Hybrid Retrieval — vector + structured + SQL fallback fused via RRF
# -----------------------------------------------------------------------------
retrieval:
  vector:
    enabled: true
    # Top-K candidates pulled from the vector backend per query
    top_k: 50
    # Similarity floor below which a candidate is dropped
    min_similarity: 0.20
    # Embedding dimension for Qdrant vector index and in-process similarity comparisons.
    # MUST equal qi.encoder.cascade.stage_dims.shortlist (512).
    # The cascade's shortlist stage encoder produces 512-dim vectors; the retriever
    # stores and compares at this length.
    embedding_dim: 512
    # 'qdrant' = QdrantVectorIndex (requires the `retrieval.qdrant` block below +
    # qdrant-client installed). Soft-fails to 'memory' if construction fails.
    # Test / CI: switch to 'memory' + dim: 32.
    backend: qdrant
    # Topic / category negation — "not in tech and not in finance". Builds a centroid
    # per topic from the seed phrases (shared encoder) and subtracts it from the query
    # vector before ANN. alpha controls how hard excluded topics are pushed away.
    topic_negation:
      enabled: true
      alpha: 0.5
      category_seeds:
        tech: ["software", "developer tools", "cloud platform", "saas", "api"]
        finance: ["fintech", "banking", "payments", "lending", "investing"]
        healthcare: ["medical", "health", "clinical", "patient care", "telehealth"]
        crypto: ["cryptocurrency", "blockchain", "web3", "defi", "token"]
  structured:
    enabled: true
    # Top-K candidates pulled from the structured (payload-filter) backend
    top_k: 50
    # 'qdrant' = QdrantStructuredIndex (filterable HNSW payload scan).
    # Test / CI: switch to 'memory'.
    backend: qdrant
    # When true, applies word_count_min / word_count_max entity slots by segmenting
    # each candidate SLD via the injected DomainNameSegmenter (frequency-dictionary
    # compound splitter). No-op when the segmenter is not wired into the retriever.
    word_count_filter_enabled: true
    # Default combine mode for multi-term keyword slots (keyword_contains /
    # keyword_starts_with / keyword_ends_with) when the intent carries no explicit
    # 'keyword_match_mode'. 'any' = OR (term list satisfied by one match); 'all' = AND.
    keyword_match_mode: any
    # Maps a boolean "select unknown" slot to the payload field whose None/absence it
    # selects. Lets queries like "domains with unknown traffic" return items whose
    # enrichment value is missing instead of excluding them.
    unknown_selectable_fields:
      traffic_is_unknown: monthly_traffic
      domain_age_is_unknown: domain_age_years
    # Maps a lifecycle state label to the auction_type IDs that represent it.
    # GoDaddy AutoExtend=16, Partner AutoExtend=38, Partner Closeout=39.
    # 'expiry' covers auctions where the domain is approaching expiry (16, 38).
    # 'expired' covers all post-expiry states including closeout (16, 38, 39).
    # Empty list means no auction_type restriction (state enforced by ends_at baseline).
    lifecycle_auction_type_map:
      expiry: ["16", "38"]
      expired: ["16", "38", "39"]
      recently_expired: ["16", "38", "39"]
      dropping: ["39"]
      active: []
      pending_delete: ["39"]
      redemption_grace: ["39"]
      lapsed_renewal: ["16", "38", "39"]
      transfer_lock: []
      auto_renew_disabled: ["16", "38", "39"]
      backorder_eligible: ["39"]
      registrar_hold: ["39"]
    # Payload fields considered as evidence of any web traffic presence.
    # When has_web_traffic_signal=true is filtered, the item must have at least
    # one of these fields non-null and > 0. All fields must be present in
    # the Qdrant payload for the check to be meaningful.
    traffic_signal_fields:
      - monthly_traffic
      - traffic_proxy_score
      - estimated_traffic_tier
  # Filter-conflict detection — when on, contradictory filter slots short-circuit
  # to a 'filter_conflict' response with an explainer instead of an empty result.
  conflict:
    enabled: true
    messages:
      range_inverted: "{field}: minimum {min} exceeds maximum {max}; no domain can satisfy both."
      mutually_exclusive: "{field}: constraints are mutually exclusive; no domain can satisfy both."
      qualitative_quantitative: "'{qualitative_slot}' signals premium or high-value domain but price_max={price_max} is below the expected minimum of {price_max_cap}; results may be empty."
    # Qualitative-quantitative conflict rules — each rule emits a conflict when a
    # qualitative slot is present AND price_max falls below price_max_cap.
    # The qualitative_slot must appear in the extracted filters for the rule to fire.
    qualitative_conflict_rules:
      - qualitative_slot: govalue_min
        price_max_cap: 100
      - qualitative_slot: isGemDomain
        price_max_cap: 50
  # Deterministic brandability scorer — a ranking signal for "rank by brandability"/
  # "memorable name" queries. Fires only when a query carries a brandability signal,
  # so other queries' ordering is unchanged. Weights/penalties are tunable here.
  brandability:
    enabled: true
    weight_length: 1.0
    weight_vowel_balance: 1.0
    weight_pronounceability: 1.0
    ideal_vowel_ratio: 0.4
    min_length: 3
    max_length: 15
    max_consonant_run: 3
    digit_penalty: 0.3
    hyphen_penalty: 0.3
    boost_weight: 0.25
    trigger_terms:
      - brandable
      - brandability
      - memorable
      - catchy
    # Regex alternative to trigger_terms for richer brandability-intent detection.
    # Matches phrases like "trust evoking", "luxury sounding", "cute short", etc.
    # Applied with IGNORECASE after trigger_terms check fails. Set to null to disable.
    trigger_regex: >-
      \b(?:trust[\s-]?evoking|luxury[\s-]?sound\w*|catchy[\s-]?sound\w*|
      strong[\s-]?brand\w*|one[\s-]?word[\s-]?brand\w*|
      cute[\s-]?(?:short|name)|easy[\s-]?to[\s-]?remember|
      premium[\s-]?sound\w*|professional[\s-]?sound\w*|
      pleasing[\s-]?to[\s-]?ear|rolls[\s-]?off|phonetic\w*)\b
    # residual_kind values that sort purely by brandability score, bypassing
    # the fused_score multiplier. Ensures monotonic brandability ordering
    # for queries where brandability is the sole ranking criterion.
    pure_sort_residual_kinds:
      - brandability

  # Real-time engagement boost — applies post-RRF multiplicative lift using
  # live Qdrant payload signals populated by EventIngestDriver.
  # Formula: fused_score *= (1 + max_boost * weighted_engagement)
  # All four signals normalised to [0,1] against their respective caps.
  engagement_boost:
    enabled: true
    max_boost: 0.30
    # Normalisation caps — scores above cap are clamped to 1.0
    bid_velocity_cap: 20.0        # 20 bids/hr = max live velocity
    watch_density_cap: 15.0       # 15 net watchers today = max passive audience
    bidder_watch_cap: 10.0        # 10 bidder-intent (type-9) watchers = max commitment
    unique_bidder_cap: 5.0        # 5 distinct bidders in 4h = fully competitive
    # Signal weights — normalised internally (need not sum to 1.0)
    bid_velocity_weight: 0.35
    watch_density_weight: 0.15
    bidder_watch_weight: 0.30
    unique_bidder_weight: 0.20

  sql:
    enabled: true
    # Top-K candidates from the SQL price-band fallback
    top_k: 50
    # Allowed columns for the SQL filter (ANY value outside this set is rejected)
    allowed_filter_columns:
      - tld
      - auction_type
      - price_min
      - price_max
      - name_length_max
      - govalue_min
      - govalue_max
    # P1.10 — ClickHouse `events_raw` real-time price fan-out adapter.
    # Plan §3.A: "the one exception: when a query needs a real-time price
    # check, we fan out to SQL and merge". Production primary: enabled=true
    # uses ClickHousePriceBandStore on `signals_platform_cln.auction_audit_cln` (ranked
    # by `bid_count`). Set enabled=false for local dev / CI without a live
    # ClickHouse instance — the registry falls back to InMemoryPriceBandStore
    # (flat list scan, CI/local only). When enabled, the registry constructs
    # a `ClickHousePriceBandStore` against the
    # configured `table` using the analytics CH client (when
    # `nl_to_sql.analytics.enabled=true`) or a dedicated client built from
    # `nl_to_sql.analytics.clickhouse` config. `score_expr` is the per-row
    # ranking expression injected verbatim into the SELECT — operators
    # tune this against the production schema (e.g. a freshness decay
    # over `auction_end_at`). Comments/semicolons are rejected at boot.
    clickhouse_adapter:
      enabled: true
      table: *base_table_qualified
      item_id_column: domain_name
      price_column: current_price
      base_where: "ends_at > now64(3)"
      score_expr: "bid_count"
      timeout_seconds: 3.0
      max_rows: 200
      extra_columns:
        - "tld"
        - "current_price AS price"
        - "CAST(auction_type_id AS VARCHAR) AS auction_type"
        - "toUnixTimestamp64Milli(ends_at) / 1000.0 AS ends_at"
      filter_column_expressions:
        auction_type: "CAST(auction_type_id AS VARCHAR)"
  fusion:
    # RRF k constant — score(item) = sum(1 / (k + rank))
    rrf_k: 60
    # Top-N items returned after fusion (>= general.max_results). 150 hands the
    # downstream rescorer/eRanker a deeper pool to re-score (5s latency SLO).
    top_n: 150
    # Per-residual-kind weighted RRF. When enabled, each source's RRF
    # contribution is multiplied by the per-source weight from the matching
    # profile (selected by QueryIntent.residual_kind). When disabled, all
    # contributions are weight 1.0 — identical to symmetric RRF.
    # Source names ('vector', 'sparse', 'structured') match CandidateSet.source
    # values produced by the registered retrievers; unknown source names log a
    # warning and default to 1.0 (no surprise side-effect).
    weights:
      enabled: true
      profiles:
        # No semantic content remains. Under Qdrant hybrid, empty encode uses
        # filter_only_rails (source='vector') — that IS the browse ranker
        # (ending_soon / bid_count / govalue). Do NOT zero vector: that left
        # only SQL (score_expr=bid_count) after sql_rescue on NoOp structured,
        # flooding cheap-.com browse with numeric junk. sql is recall/enrichment.
        empty:
          vector: 1.0
          sparse: 0.2
          structured: 1.0
          sql: 0.25
        # Navigational residual: same hybrid filter-only path; keep vector
        # dominant, sql as light secondary.
        navigational:
          vector: 1.0
          sparse: 0.4
          structured: 1.0
          sql: 0.25
        # Real content remains; vector should win on brandability/theme
        # affinity, structured still contributes filter-aware ranking.
        # sql provides filter-accurate recall but no semantic signal — 0.8.
        semantic:
          vector: 1.0
          sparse: 0.6
          structured: 0.8
          sql: 0.8
        # Used when residual_kind is None (multi-intent fan-out, cache-hit,
        # or feature flag off). Symmetric — identical to legacy RRF.
        default:
          vector: 1.0
          sparse: 1.0
          structured: 1.0
          sql: 1.0
  # ---------------------------------------------------------------------------
  # Layer 4 — external eRanker (personalization + ranking live in that service).
  # Ships noop until HTTP client is wired; latency_budget_ms gates the future call.
  # ---------------------------------------------------------------------------
  eranker:
    enabled: true
    backend: noop
    latency_budget_ms: 200.0
    shadow_enabled: false
    shadow_serve_fused: true
    skip_when_backend_unhealthy: true
  # ---------------------------------------------------------------------------
  # Post-eRanker MMR diversifier.
  # Re-shuffles the head `top_n` items returned post-eRanker, selects `output_n` of
  # them via greedy MMR (Carbonell & Goldstein 1998), then re-stitches the
  # selection onto (a) the un-selected head remainder and (b) the un-touched
  # tail beyond `top_n`. The orchestrator wraps the call in
  # `asyncio.wait_for(..., timeout=latency_budget_ms / 1000.0)` and on
  # timeout / DiversityError / Exception falls back to the post-eRanker order.
  # Cache-hit paths (exact + semantic) deliberately do NOT re-diversify —
  # cached envelopes are already user-agnostic and re-diversifying would
  # break determinism across cache hits.
  # Defaults ship DISABLED + backend=noop so the diversifier is a typed
  # identity until an operator opts in to the stdlib-only Jaccard-MMR
  # diversifier (backend: lexical_jaccard_mmr).
  # ---------------------------------------------------------------------------
  diversity:
    # Master switch. False ⇒ orchestrator skips diversification entirely
    # (uses the NoOpDiversifier internally so the call surface stays uniform).
    enabled: true
    # One of: lexical_jaccard_mmr | noop. The `noop` backend is the
    # typed-disabled path; `lexical_jaccard_mmr` is the stdlib-only default.
    # Future embedding-backed backends register here.
    backend: lexical_jaccard_mmr
    # Head slice length the diversifier considers as MMR candidates. Items
    # beyond top_n keep their post-eRanker order. Should be >=
    # output_n; typically top_n == output_n (the diversifier picks the
    # entire visible slice from the head).
    top_n: 50
    # Number of items the diversifier actually selects. Must be <= top_n.
    # Typically equal to general.max_results so the diversified slice IS
    # the final visible slice.
    output_n: 10
    # Hard wall on the diversifier call. Exceeding this triggers fallback
    # to the post-eRanker order. 15 ms is the lexical default;
    # raise to ~50-80 ms when swapping in an embedding-backed backend.
    latency_budget_ms: 15.0
    # Lexical-backend params — REQUIRED only when `backend: lexical_jaccard_mmr`.
    # Tokenization mirrors `BM25QueryEncoderConfig` so the diversifier scores on
    # the same token universe as BM25. payload_fields reference real corpus keys
    # (domain_name/sld/tld) so the document representation carries actual tokens.
    lexical:
      # MMR relevance-vs-novelty knob in [0, 1]. 1.0 = pure relevance
      # (degenerates to input order on the head); 0.0 = pure novelty after
      # step 1. Production defaults sit in [0.5, 0.8].
      lambda_relevance: 0.7
      payload_fields:
        - domain_name
        - sld
        - tld
      min_term_length: 2
      max_terms: 64
      stopwords:
        - the
        - a
        - an
        - and
        - or
        - of
        - for
        - to
        - in
        - "on"
        - is
        - this
        - that
  # ---------------------------------------------------------------------------
  # Qdrant unified listing index — required when retrieval backends are 'qdrant'.
  # API key read from $QDRANT_API_KEY env var at boot (never stored in YAML).
  # Override host/port per environment via config merge or env injection.
  # ---------------------------------------------------------------------------
  qdrant:
    host: ${QDRANT_HOST:-localhost}   # set QDRANT_HOST=qdrant in docker-compose; defaults to localhost
    # Port / TLS / transport are env-driven so the same config serves both a
    # local plain-HTTP Qdrant (6333, http, gRPC — the defaults) and a
    # TLS-fronted managed endpoint (443, https, REST) in Katana/ECS. A
    # TLS-terminating L7 ALB exposes only the HTTPS REST listener, so the
    # deployed env must set QDRANT_PREFER_GRPC=false (gRPC on 6334 is not
    # routable through that listener).
    port: ${QDRANT_PORT:-6333}
    grpc_port: 6334
    prefer_grpc: ${QDRANT_PREFER_GRPC:-true}    # gRPC saves ~10-15 ms per round-trip vs REST at 1M+ docs
    https: ${QDRANT_HTTPS:-false}
    # qdrant-client refuses to talk to a server whose major differs or minor
    # differs by >1. false skips that client-side gate so the server image can
    # drift from the pinned client without a startup warning or hard failure.
    check_compatibility: false
    api_key_env_var: ""  # no auth for local/docker deployment; set to QDRANT_API_KEY when auth is required
    collection_name: auctions_listings
    # Qdrant is managed externally — by Katana when deployed (QDRANT_HOST secret)
    # and by a standalone container locally (scripts/deploy_qdrant.sh). The app
    # only validates reachability at startup; it never starts Qdrant.
    # Payload field returned as Candidate.item_id. Must be present on every point.
    payload_id_field: domain_name
    # Payload field used as structured-side relevance score (empty = rank-position fallback).
    payload_score_field: govalue_score
    # Filter-only (empty encode) multi-scroll RRF — explore-like ranking under the
    # same hard qfilter (price/TLD/type never widened). Each leg scrolls with a
    # distinct order_by; legs RRF-merge. Requires payload indexes on order_by fields.
    filter_only_rails:
      enabled: true
      rrf_k: 60
      legs:
        - rail_id: ending_soon
          order_by_field: ends_at
          order_by_direction: asc
          limit_multiplier: 1
        - rail_id: trending
          order_by_field: bid_count
          order_by_direction: desc
          limit_multiplier: 1
        - rail_id: value
          order_by_field: govalue_score
          order_by_direction: desc
          limit_multiplier: 1
    connect_timeout_seconds: 2.0
    read_timeout_seconds: 3.5
    # HNSW ef_search: candidates explored per query in the HNSW graph.
    # 128 trades ~2x ANN latency for deeper recall so the downstream rescorer
    # and eRanker see a wider, higher-recall candidate pool (5s latency SLO).
    # 256 is the next step if offline eval shows further recall headroom.
    hnsw_ef_search: 128
    # HNSW ef for the non-hybrid QdrantVectorIndex path (analytics fallback, explore
    # fallback). Lower than hnsw_ef_search to reduce ANN latency on lower-priority
    # paths; does not affect the hybrid RRF path which uses hnsw_ef_search.
    hnsw_ef_search_analytics: 64
    # Baseline filters applied to EVERY query (cannot be dropped by ZeroResultGuard).
    # active_only_baseline: ends_at >= now() — expired auctions never appear in results.
    # price_gt_zero_baseline: price > 0 when no explicit price filter — excludes unpriced
    #   items (auction_type=38, currentprice=0) from fallback/vector results.
    active_only_baseline: true
    # `price` is the CURRENT bid (0 = no bids yet). Gating on price>0 drops biddable
    # no-bid auctions (most expiring inventory), so this stays false.
    price_gt_zero_baseline: false
    # Biddable baseline: starting_bid>0 keeps no-bid auctions (current price=0) while
    # excluding genuinely unpriced/parked items (starting_bid=0). Preferred priced gate.
    starting_bid_gt_zero_baseline: true
    hybrid:
      # Single round-trip hybrid: dense vector + payload filter (+ optional BM25 sparse).
      enabled: true
      # Server-side fusion: 'rrf' = Reciprocal Rank Fusion (k≈60).
      fusion_strategy: rrf
      # BM25 sparse prefetch (requires Qdrant ≥1.10 + sparse vector at ingest).
      # Enable after vectorization pipeline has indexed sparse vectors.
      bm25_enabled: true
      bm25_vector_name: sparse
      dense_vector_name: dense
      # Per-prefetch candidate cap. 400 deepens the dense+sparse server-side RRF
      # pool feeding the downstream rescorer/eRanker (5s latency SLO); payload
      # fetch is IO-bound, index scan is CPU.
      # Must be >= max(vector.top_k, structured.top_k) = 50.
      prefetch_limit: 400
      # Python-side keyword post-filter oversample multipliers.
      # keyword_contains / keyword_contains_exclude / keyword_phrase use the
      # contains factor; keyword_starts_with / keyword_ends_with use the prefix
      # factor (more selective, needs a wider Qdrant pool).
      kw_post_oversample_factor: 10
      # Prefix/suffix post-filters are selective; wider pool + scaled prefetch
      # (see QdrantHybridRetriever.retrieve) reduces under-delivery on rare SLDs.
      kw_prefix_oversample_factor: 20
      # Second-stage dense rescore (Design B). After the server-side dense(512)+sparse
      # RRF fusion, Qdrant reranks the fused pool by a higher-fidelity 768-dim dense
      # vector stored on the same point under `vector_name`. dim MUST equal
      # qi.encoder.cascade.stage_dims.rerank (768). input_n is the fused-pool size
      # handed into the rerank stage. Requires a reindex that writes the rerank vector.
      rerank:
        enabled: true
        vector_name: dense_rerank
        dim: 768
        input_n: 400
      # Character n-gram sparse channel (recall-side fuzzy / misspell expansion).
      # A dedicated sparse vector ('ngram') hashed from boundary-marked character
      # n-grams of the domain (doc side) and the query (query side) into a shared
      # bucket space. Added as a third RRF prefetch leg so near-miss / misspelled
      # queries (e.g. "high rentals" -> "hi-rentals" / "rent.high") retrieve
      # lexically close domains the dense + BM42 token-sparse legs miss. vocab_size
      # and n-gram bounds MUST match on doc and query sides (one CharNgramSparseEncoder
      # config drives both). Requires a reindex that writes the 'ngram' sparse vector.
      ngram:
        enabled: true
        vector_name: ngram
        vocab_size: 262144
        min_n: 3
        max_n: 4
      # BM42 attention-weighted sparse encoder (upgrade over hash-BM25).
      # When local_model_path is present and the directory exists, the registry
      # uses BM42 for BOTH query and doc sparse encoding. Falls back to
      # hash-BM25 (bm25_query_encoder below) silently if the directory is
      # missing or the model fails to load — service is never interrupted.
      sparse_encoder:
        model_name: *sparse_encoder_model
        local_model_path: "${LOCAL_PRETRAINED_DIR:-/app/pretrained}/Qdrant/all_miniLM_L6_v2_with_attentions"
        threads: 0     # 0 = ONNX-Runtime library default (auto-detects CPU count)
        # When false, BM42 load failure fails boot (no silent hash-BM25 degrade).
        hash_bm25_fallback: false
        # Query-side navigational stop list. When enabled, tokens in `tokens`
        # (case-insensitive) are removed from the query string BEFORE it is
        # passed to BM42's query_embed. Doc-side encoding is NOT modified —
        # corpus integrity preserved. When disabled, the encoder receives the
        # raw stripped query unchanged.
        query_stop_list:
          enabled: true
          tokens:
            - find
            - search
            - show
            - get
            - list
            - look
            - want
            - need
            - buy
            - purchase
            - domain
            - domains
            - name
            - names
      # Hash-BM25 fallback — used when sparse_encoder is unavailable.
      # vocab_size and hashing scheme MUST mirror vectorization.bm25_doc_encoder.
      bm25_query_encoder:
        vocab_size: 262144
        min_term_length: 2
        max_terms: 64
        stopwords:
          - the
          - a
          - an
          - and
          - or
          - of
          - for
          - to
          - in
          - "on"
          - is
          - this
          - that
        # Synonym expansion for the BM25 query leg.
        # The synonym_map here MUST be identical to vectorization.synonyms.synonym_map.
        # Registry enforces: both enabled with non-empty maps OR both disabled.
        # YAML anchor defined here; vectorization.synonyms.synonym_map references *synonym-map.
        synonyms:
          enabled: true
          expansion_weight: 0.5
          max_synonyms_per_token: 5
          max_tokens_to_expand: 16
          # Domain-tuned forward map — 500+ synonym pairs covering domain expiry marketplace.
          # Inverse edges are auto-added at load time; only forward edges listed here.
          synonym_map: &synonym-map
            # --- Technology / Software ---
            ai: [artificial, intelligence, ml]
            ml: [machine, learning, ai]
            tech: [technology, digital, software]
            software: [app, platform, tool]
            digital: [online, web, virtual]
            cloud: [hosting, server, infrastructure]
            mobile: [phone, app, ios]
            data: [analytics, database, info]
            api: [integration, endpoint, interface]
            cyber: [security, infosec, protection]
            dev: [developer, coding, programming]
            saas: [subscription, platform, software]
            iot: [devices, connected, sensor]
            web: [website, internet, online]
            app: [application, software, mobile]
            code: [programming, dev, software]
            devops: [automation, deployment, ops]
            blockchain: [crypto, distributed, ledger]
            defi: [decentralized, protocol, yield]
            nft: [token, collectible, digital]
            crypto: [blockchain, web3, coin]
            token: [coin, currency, nft]
            wallet: [vault, treasury, account]
            mining: [staking, yield, crypto]
            protocol: [network, blockchain, standard]
            node: [server, network, validator]
            net: [network, internet, web]
            server: [hosting, cloud, infrastructure]
            ssl: [certificate, secure, https]
            vpn: [privacy, secure, tunnel]
            email: [mail, messaging, inbox]
            cms: [content, platform, wordpress]
            seo: [search, marketing, ranking]
            analytics: [data, metrics, tracking]
            metrics: [analytics, stats, kpi]
            dashboard: [analytics, monitor, panel]
            automation: [workflow, bot, script]
            bot: [automation, ai, script]
            sdk: [library, framework, toolkit]
            framework: [platform, library, stack]
            plugin: [extension, addon, module]
            stream: [media, video, broadcast]
            vr: [virtual, immersive, metaverse]
            ar: [augmented, immersive, mixed]
            esport: [gaming, competitive, league]
            # --- Finance / Fintech ---
            finance: [money, banking, investment]
            fintech: [payment, banking, digital]
            bank: [banking, lending, financial]
            invest: [investment, fund, portfolio]
            trade: [trading, exchange, market]
            pay: [payment, billing, transaction]
            loan: [credit, lending, mortgage]
            fund: [capital, equity, investment]
            vc: [venture, capital, startup]
            equity: [shares, ownership, stock]
            capital: [funding, investment, finance]
            portfolio: [assets, holdings, investments]
            exchange: [trade, market, swap]
            forex: [currency, fx, exchange]
            stock: [shares, equity, market]
            bond: [debt, fixed, yield]
            mortgage: [loan, property, financing]
            credit: [loan, score, debit]
            insurance: [coverage, protection, policy]
            pension: [retirement, savings, annuity]
            tax: [accounting, fiscal, levy]
            audit: [accounting, compliance, review]
            accounting: [finance, bookkeeping, cpa]
            payroll: [salary, hr, compensation]
            invoice: [billing, payment, receipt]
            billing: [invoice, payment, subscription]
            hedge: [fund, risk, arbitrage]
            debit: [payment, card, transaction]
            # --- Business / Commerce ---
            biz: [business, company, venture]
