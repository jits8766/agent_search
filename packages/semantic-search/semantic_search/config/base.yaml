        # Query-driven dynamic synonym store. Grows permanently at query time —
        # tokens missing the static map above are queued for LLM expansion once
        # they accumulate min_freq_to_expand misses. Results are persisted to
        # SQLite and loaded back on every restart so coverage is cumulative.
        # Defaults to the container output/ dir (same sink as feedback); no
        # external data dir or DATA_DIR env required. Override DATA_DIR only
        # to relocate the store for local runs.
        dynamic_synonyms:
          enabled: false
          db_path: "${DATA_DIR:-output}/synonyms.db"
          miss_queue_max: 500
          min_freq_to_expand: 3
          expansion_concurrency: 4
          expansion_weight: 0.4
          max_synonyms_per_token: 3
          max_db_entries: 100000
          # Confidence gate: LLM-generated synonyms below this floor are dropped
          # before persistence so low-quality pairs never enter the permanent
          # store. Each candidate carries an LLM-reported confidence in [0, 1].
          # Set to 0.0 to disable the gate.
          min_confidence: 0.7
          shutdown_grace_timeout_seconds: 5.0

  # ---------------------------------------------------------------------------
  # Residual-aware modality dispatch — when QueryIntent.residual_kind labels
  # the residual as filter-dominant AND the structured retriever has ≥1 hard
  # chip to act on, drop the vector backend from the retrieval fan-out. The
  # dispatch is bypassed (vector always fires) when retrieval.qdrant.hybrid
  # is on, because vector + sparse share a single backend there and dropping
  # vector would lose the sparse leg too — Step 4 weighted-RRF handles the
  # same problem on the fusion side in that mode.
  # ---------------------------------------------------------------------------
  residual_dispatch:
    enabled: true
    skip_vector_when:
      # Residual kinds that trigger the skip. Must be a subset of RESIDUAL_KINDS.
      residual_kinds:
        - empty
        - navigational
      # Only skip when the structured-filter projection has ≥1 hard chip.
      # A bare navigational query with no filter would otherwise fall through
      # to an empty result set; we keep vector active in that case.
      require_hard_chip_coverage: true
      # Residual kinds that drop the vector backend even when Qdrant
      # unified-hybrid is enabled. Must be a subset of `residual_kinds`.
      # MUST stay empty (`[]`) when hybrid pairs with QdrantNoOpStructuredRetriever:
      # the hybrid vector leg is the ONLY path that applies payload filters.
      # Putting `empty` here previously dropped that leg for pure-filter queries
      # ("find .com type 16 under $50") → ZeroResultGuard stripped every filter.
      # QdrantHybridRetriever scrolls (filter-only) when encode text is empty, so
      # keeping the vector backend for residual=empty is correct and cheap.
      # 'navigational' stays out so sparse can still match under weighted RRF.
      hybrid_mode_residual_kinds: []

  # ---------------------------------------------------------------------------
  # Online retrieval-quality metrics surfaced in /search response under
  # `retrieval_metrics` (NDCG@K, Coherence@K, Recall@K, Precision@K, HitRate@K).
  # These are LABEL-FREE metrics: each returned item's normalised score (its
  # raw fused score divided by the top item's score) is treated as a relevance
  # proxy. Anything >= relevance_threshold is counted as "relevant" for the
  # threshold-based metrics. Lower threshold = looser definition.
  # Offline label-based metrics live under offline_eval / agent_eval and use
  # real golden seeds, not this proxy.
  # ---------------------------------------------------------------------------
  metrics:
    relevance_threshold: 0.7
    # How fused scores map to coherence_score / relevance proxy in [0,1].
    # 'max'    → s / max(s)            (legacy: floor floats high; flat rankings
    #                                   leave most items above the threshold).
    # 'minmax' → (s - min)/(max - min) (sharpens the proxy: tail drops toward 0,
    #                                   shrinking the threshold-relevant set; lifts
    #                                   Recall@K on flat routes). Ranking unchanged.
    score_normalization: minmax

  # Each retrieval backend fetches top_k * over_fetch_multiplier candidates
  # before RRF fusion. The fusion pool is capped at the same multiplied value so
  # RRF sees a wider set before the final top_k slice in the endpoint. 1.0 disables
  # the multiplier (exact top_k fetch). 4.0 (200 per backend at top_k=50) widens
  # the pool feeding the rescorer/eRanker under the 5s latency SLO.
  over_fetch_multiplier: 4.0

  # Post-fusion hard-chip categorical gate (tld, auction_type). When true, a fused
  # item whose payload does NOT carry the constrained field is dropped (precision-first:
  # an unverifiable item cannot satisfy an explicit hard constraint such as tld=com).
  # Set false for recall-first behaviour (keep items missing the field).
  enforce_categorical_gate_on_missing_payload: true
  # After the zero-result guard widens a numeric constraint (e.g. price_max),
  # re-apply the original hard gate on the widened results so items satisfying
  # the widened bound but violating the original are removed only when items
  # satisfying the original bound also exist. Set false to accept widened results
  # without re-gating (shows results outside the original range when none inside exist).
  guard_widen_reapply_hard_gate: true

  # Identified FIND hard slots with no Qdrant/structured payload path.
  # Surfaced in filters.not_applied with reason backend_unsupported (honest, not silent).
  # All fields required when this block is present — no code-side defaults.
  hard_filter_application:
    backend_unsupported_slots:
      - charPattern
      - filterPriceCurrency
      - isBidAccepted
      - isExtended
      - ownerMemberIncludeList
      - ownerMemberExcludeList
      - minUniqueSearches
      - maxUniqueSearches
      - minEstibotDomainCount
      - maxEstibotDomainCount
      - minEstibotDomainCountDev
      - maxEstibotDomainCountDev
      - minEstibotExtCount
      - maxEstibotExtCount
      - minEstibotExtCountDev
      - maxEstibotExtCountDev

  # Fuzzy lexical reranker — boosts SLD typo / near-matches in the over-fetched fused
  # pool so they survive the final top_k cut (e.g. query "high rentals" surfaces
  # "hi-rentals" / "rent.high"). Pure stdlib Damerau-Levenshtein over candidate
  # payload['sld']; no re-index, no model. Additive: zero-coverage queries keep the
  # fused order unchanged.
  fuzzy_rerank:
    enabled: true
    max_edit_distance: 2      # inclusive per-token edit-distance cap (high<->hi is 2)
    min_token_length: 2       # drop 1-char query tokens before scoring
    max_terms: 16             # cap on query tokens scored per request
    max_candidates: 200       # cap on pool items rescored (latency bound; matches over-fetch pool)
    min_similarity: 0.6       # per-token-pair similarity floor in [0,1] to count as a match
    boost_weight: 0.5         # multiplier on fuzzy coverage added to fused_score
    stopwords:
      - the
      - a
      - an
      - and
      - or
      - of
      - for
      - to
      - in
      - "on"
      - is
      - this
      - that

# -----------------------------------------------------------------------------
# Cache — 3 tiers (exact hash + semantic similarity + structured intermediate)
# -----------------------------------------------------------------------------
cache:
  enabled: true
  exact:
    enabled: true
    # TTL in seconds for exact-hash search-result entries (max 60s freshness)
    ttl_seconds: 60
    # Maximum number of entries before LRU eviction
    max_entries: 5000
  structured:
    enabled: true
    ttl_seconds: 60
    max_entries: 5000
  # Plan Tier-3 — structural intent fingerprint → pre-eRanker results (post-QI).
  intent_plan:
    enabled: true
    ttl_seconds: 60
    max_entries: 3000
  # Optional Dragonfly/Redis shared tier for CachedSearchPayload blobs (fleet ≥4).
  remote:
    enabled: false
    redis_url_env_var: AGENT_SEARCH_CACHE_REDIS_URL
    key_prefix: "semantic_search:ipc:"
    socket_timeout_seconds: 0.5

# -----------------------------------------------------------------------------
# Search Surface — power-user form mirroring FIND API params
# -----------------------------------------------------------------------------
surface:
  enabled: true
  # Allowed override fields the surface accepts post-search
  allowed_override_fields:
    - tld
    - auction_type
    - price_min
    - price_max
    - name_length_max
    - quality_min
  # Maximum saved searches per session
  max_saved_searches: 50
  # Saved-search JSON mirrors `/search` payloads; Layer-0 walks every string
  # value (same `LayerZeroSanitizer` as ingress) with bounded depth / node count.
  saved_search_layer0_max_depth: 32
  saved_search_layer0_max_string_nodes: 500
  # Default UI mode when the caller does not set explicit_mode on UserContext
  default_recommended_mode: conversational
  # Shown in ModeRecommendation.reason when default_recommended_mode applies
  mode_recommendation_reason: surface_default

# -----------------------------------------------------------------------------
# User Search History — drives Resume Last Search and save-trigger heuristics
# -----------------------------------------------------------------------------
history:
  enabled: true
  # Retention window in days (matches plan's 90-day target)
  retention_days: 90
  # Per-user maximum entries (oldest pruned when full)
  max_entries_per_user: 200
  # Max query string length stored (defense-in-depth against unbounded payloads)
  max_query_length: 512
  # Resume window in days for the resume-last-search banner
  resume_window_days: 30
  # Maximum candidates returned by /search/resume
  max_resume_candidates: 5
  # Compactor — aggregates 90-day raw history into a per-user feature vector
  # for optional signals_platform_cln. Default off so the search/resume
  # path serves traffic from the raw store regardless; flip enabled=true once the
  # consuming surface is live.
  compactor:
    enabled: false
    interval_seconds: 86400.0
    max_consecutive_failures: 5
    top_tld_count: 10
    top_theme_count: 20
    min_theme_occurrences: 2
    max_users_per_cycle: 10000

# -----------------------------------------------------------------------------
# Explore + landing rails (trending, ending soon, fallback)
# -----------------------------------------------------------------------------
# Three rails feed two surfaces:
#   1. GET /landing-rail/{user_id}     — public landing page
#   2. SearchOrchestrator zero-result  — fallback when retrieval returns []
# Both surfaces share the same composer; `LandingRailResponse.source` records
# the call path so dashboards keep them separate.
explore:
  enabled: true
  trending:
    enabled: true
    max_items: 35
    title: "Trending now"
    # Items added inside this window (seconds) are the trending pool. Bound by the
    # in-memory source's add timestamps; production swaps in the bid-velocity MV
    # source once the bid stream lands.
    window_seconds: 1800
  ending_soon:
    enabled: true
    max_items: 35
    title: "Ending soon"
    # Items ending within `horizon_seconds` of now (seconds). 86400 = next 24h.
    horizon_seconds: 86400
    # Upper bound for dynamic horizon overrides from QI time_remaining_max (seconds). 604800 = 7 days.
    max_horizon_seconds: 604800
  fallback:
    enabled: true
    max_items: 35
    title: "Popular auctions"
  zero_result_guard:
    enabled: true
    # Minimum result count required before the guard considers relaxation.
    # When primary retrieval returns >= this many results the guard does NOT fire.
    # When it returns fewer (including zero) the guard walks the ladder below.
    min_results_before_relax: 1
    # Order in which filter slots are dropped when retrieval returns fewer than
    # min_results_before_relax results. First in the list is dropped first.
    # Slots not in the active filter set are skipped over.
    # Design intent:
    #   Tier 1 (drop first): soft quality/length/character signals — rarely the
    #     user's primary intent; dropping them is low-risk.
    #   Tier 2: enrichment signals (age, traffic, SEO metrics) — useful
    #     refinements but not the core ask.
    #   Tier 3 (drop last): core constraints the user explicitly stated —
    #     price ceiling/floor, TLD, auction type, keyword pattern. Dropping
    #     these changes the result set most fundamentally.
    # Slots listed here are NEVER dropped during the relax_filters step (Step 1).
    # They survive until semantic_only (Step 2) drops all filters. Use for slots
    # that define the core temporal or categorical intent of the query — dropping
    # them before other filters would return results that violate the user's ask.
    # When true, external eRanker runs on explore-fallback results so semantic/investor
    # queries receive coherence-ranked output instead of unranked rail order.
    apply_eranker_on_explore_fallback: false
    rail_timeout_seconds: 5.0  # aligned with clickhouse.execution_timeout_seconds; absorbs cold-start scans of the 87M-row auction_audit_cln
    # Core categorical/numeric constraints survive Step 1 (relax_filters).
    # Dropping tld/price before softer chips returns results that violate the ask
    # (e.g. ".net/.io under $50" → price-only .com flood).
    relax_filters_protected_slots:
      - time_remaining_max
      - price_max
      - price_min
      - tld
      - auction_type
    relax_filters_drop_priority:
      # -- Tier 1: soft quality / length / character signals -----------------
      - quality_min
      - name_length_max
      - name_length_min
      - has_hyphen
      - has_number
      - is_idn
      # -- Tier 2: enrichment / SEO signals ----------------------------------
      - domain_age_min
      - domain_age_max
      - traffic_min
      - traffic_max
      - govalue_min
      - govalue_max
      - bids_min
      - bids_max
      - majestic_tf_min
      - majestic_tf_max
      - majestic_cf_min
      - majestic_cf_max
      - majestic_backlinks_min
      - majestic_backlinks_max
      - majestic_ref_domains_min
      - majestic_ref_domains_max
      - tlf_exact_match
      - tlf_keyword_regs_min
      - tlf_developed
      - semrush_backlinks_min
      - semrush_backlinks_max
      - semrush_indexed_pages_min
      - semrush_indexed_pages_max
      - semrush_ref_domains_min
      - semrush_ref_domains_max
      - semrush_authority_min
      - semrush_authority_max
      - semrush_search_volume_min
      - semrush_search_volume_max
      - semrush_cpc_min
      - semrush_cpc_max
      # -- Tier 3: core user constraints — type, TLD, price, keywords, time --
      # (Protected slots above are skipped in Step 1; listed last for semantic_only.)
      - auction_type
      - tld
      - price_min
      - price_max
      - keyword_contains
      - keyword_starts_with
      - keyword_ends_with
      - time_remaining_max
    # Top-k cap for the vector retriever in the semantic-only step.
    semantic_only_top_k: 20
    # Per-rail cap for the explore-fallback step (smaller than the public rail
    # cap so the fallback page stays readable on mobile).
    explore_fallback_max_per_rail: 35
    # RRF k constant for fusing explore rails (trending/ending_soon/last_hour/latest) + semantic results.
    # Standard default is 60; lower = stronger top-rank amplification, higher = smoother blending.
    rrf_k: 60
    # Number of vector search results included in the SLA-breach / zero-result explore fallback.
    semantic_fallback_top_k: 20
    # Widen-before-drop: scale numeric range bounds before dropping them. This
    # rescues queries like "domains under $100" by retrying at $200, $500, $1000
    # before letting the price filter fall away entirely.
    widen_filters_enabled: true
    widen_filters_multipliers: [2.0, 5.0, 10.0]
    widen_filters_slots:
      - price_max
      - price_min
      - name_length_max
      - time_remaining_max
      - bids_max
      - bids_min
      - domain_age_max
      - domain_age_min
      - traffic_max
      - traffic_min
      - govalue_max
      - govalue_min
  clickhouse_rails:
    enabled: true
    clickhouse_db: *analytics_db
    trending_sql: >-
      SELECT s.domain_name AS item_id,
             toUInt32(countMerge(v.bid_count_state)) AS trending_score,
             s.current_price AS price, s.tld,
             CAST(s.auction_type_id AS VARCHAR) AS auction_type,
             toUnixTimestamp64Milli(s.ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.mv_bid_velocity_by_auction_hour v
      INNER JOIN {clickhouse_db}.auction_audit_cln s ON s.auction_id = v.auction_id
      WHERE v.event_hour >= now() - INTERVAL 4 HOUR
        AND s.ends_at > now64(3)
      GROUP BY s.domain_name, s.current_price, s.tld, s.auction_type_id, s.ends_at
      HAVING trending_score > 0
      ORDER BY trending_score DESC, s.current_price DESC
    ending_soon_sql: >-
      SELECT domain_name AS item_id, current_price AS price, tld,
             CAST(auction_type_id AS VARCHAR) AS auction_type,
             bid_count, toUnixTimestamp64Milli(ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.auction_audit_cln
      WHERE ends_at > now64(3) AND ends_at < now64(3) + INTERVAL 7 DAY
        AND current_price > 0
      ORDER BY ends_at ASC
    last_hour_sql: >-
      SELECT domain_name AS item_id, current_price AS price, tld,
             CAST(auction_type_id AS VARCHAR) AS auction_type,
             bid_count, toUnixTimestamp64Milli(ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.auction_audit_cln
      WHERE ends_at > now64(3) AND ends_at < now64(3) + INTERVAL 1 HOUR
        AND current_price > 0
      ORDER BY ends_at ASC
    latest_sql: >-
      SELECT domain_name AS item_id, current_price AS price, tld,
             CAST(auction_type_id AS VARCHAR) AS auction_type,
             bid_count, toUnixTimestamp64Milli(ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.auction_audit_cln
      WHERE ends_at > now64(3) AND ends_at < now64(3) + INTERVAL 7 DAY
        AND current_price > 0
      ORDER BY ends_at DESC
    high_volume_sql: >-
      SELECT s.domain_name AS item_id,
             s.bid_count + toUInt32(ifNull(w.watch_density_today, 0)) AS volume_score,
             s.current_price AS price, s.tld,
             CAST(s.auction_type_id AS VARCHAR) AS auction_type,
             toUnixTimestamp64Milli(s.ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.auction_audit_cln s
      LEFT JOIN (
        SELECT b.auction_id,
               toUInt32(countMerge(wd.active_watch_state)) AS watch_density_today
        FROM {clickhouse_db}.mv_watch_density_by_item_day wd
        INNER JOIN (
          SELECT DISTINCT member_item_id, auction_id
          FROM {clickhouse_db}.bid_events
          WHERE auction_id > 0
            AND event_utc_ts >= now() - INTERVAL 4 HOUR
        ) b ON wd.member_item_id = b.member_item_id
        WHERE wd.event_day = today()
        GROUP BY b.auction_id
      ) w ON s.auction_id = w.auction_id
      WHERE s.ends_at > now64(3) AND (s.bid_count >= 5 OR w.watch_density_today >= 3)
      ORDER BY volume_score DESC, s.current_price DESC
    fresh_sql: >-
      SELECT domain_name AS item_id, current_price AS price, tld,
             CAST(auction_type_id AS VARCHAR) AS auction_type,
             bid_count, toUnixTimestamp64Milli(ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.auction_audit_cln
      WHERE ends_at > now64(3) AND bid_count = 0
      ORDER BY ends_at DESC
    last_week_sql: >-
      SELECT domain_name AS item_id, current_price AS price, tld,
             CAST(auction_type_id AS VARCHAR) AS auction_type,
             bid_count, toUnixTimestamp64Milli(ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.auction_audit_cln
      WHERE ends_at > now64(3) + INTERVAL 7 DAY
      ORDER BY ends_at ASC

    watch_density_sql: >-
      SELECT s.domain_name AS item_id,
             toUInt32(countMerge(w.active_watch_state)) AS watch_score,
             s.current_price AS price, s.tld,
             CAST(s.auction_type_id AS VARCHAR) AS auction_type,
             toUnixTimestamp64Milli(s.ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.mv_watch_density_by_item_day w
      INNER JOIN (
        SELECT DISTINCT member_item_id, auction_id
        FROM {clickhouse_db}.bid_events
        WHERE auction_id > 0
      ) b ON w.member_item_id = b.member_item_id
      INNER JOIN {clickhouse_db}.auction_audit_cln s ON s.auction_id = b.auction_id
      WHERE w.event_day = today()
        AND s.ends_at > now64(3)
      GROUP BY s.domain_name, s.current_price, s.tld, s.auction_type_id, s.ends_at
      HAVING watch_score >= 1
      ORDER BY watch_score DESC, s.current_price DESC
    high_traffic_sql: >-
      SELECT s.domain_name AS item_id,
             toFloat64(
               toUInt32(countMerge(v.bid_count_state)) * {high_traffic_bid_weight}
               + toUInt32(ifNull(any(w.watch_cnt), 0)) * {high_traffic_watch_weight}
             ) AS traffic_score,
             s.current_price AS price, s.tld,
             CAST(s.auction_type_id AS VARCHAR) AS auction_type,
             toUnixTimestamp64Milli(s.ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.mv_bid_velocity_by_auction_hour v
      INNER JOIN {clickhouse_db}.auction_audit_cln s ON s.auction_id = v.auction_id
      LEFT JOIN (
        SELECT b.auction_id,
               toUInt32(countMerge(wd.active_watch_state)) AS watch_cnt
        FROM {clickhouse_db}.mv_watch_density_by_item_day wd
        INNER JOIN (
          SELECT DISTINCT member_item_id, auction_id
          FROM {clickhouse_db}.bid_events
          WHERE auction_id > 0
        ) b ON wd.member_item_id = b.member_item_id
        WHERE wd.event_day = today()
        GROUP BY b.auction_id
      ) w ON s.auction_id = w.auction_id
      WHERE v.event_hour >= now() - INTERVAL 4 HOUR
        AND s.ends_at > now64(3)
      GROUP BY s.domain_name, s.current_price, s.tld, s.auction_type_id, s.ends_at
      HAVING traffic_score > 0
      ORDER BY traffic_score DESC, s.current_price DESC

    # competitive_sql — auctions with 2+ distinct human bidders in the last 4h.
    # Uses mv_unique_bidder_count_by_item joined to auction_id via bid_events bridge.
    # Signals active bidding contests — high-intent, price-competitive domains.
    competitive_sql: >-
      SELECT s.domain_name AS item_id,
             toUInt32(uniqMerge(u.unique_bidder_state)) AS competitive_score,
             s.current_price AS price, s.tld,
             CAST(s.auction_type_id AS VARCHAR) AS auction_type,
             toUnixTimestamp64Milli(s.ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.mv_unique_bidder_count_by_item u
      INNER JOIN (
        SELECT DISTINCT member_item_id, auction_id
        FROM {clickhouse_db}.bid_events
        WHERE auction_id > 0
      ) b ON u.member_item_id = b.member_item_id
      INNER JOIN {clickhouse_db}.auction_audit_cln s ON s.auction_id = b.auction_id
      WHERE u.event_hour >= now() - INTERVAL 4 HOUR
        AND s.ends_at > now64(3)
      GROUP BY s.domain_name, s.current_price, s.tld, s.auction_type_id, s.ends_at
      HAVING competitive_score >= 2
      ORDER BY competitive_score DESC, s.current_price DESC

    # opportunity_sql — auctions watched today (≥3 watchers) but with zero bids
    # in the last 4h.  Surfaces domains with audience but no active competition —
    # potentially under-bid relative to their interest level.
    opportunity_sql: >-
      SELECT s.domain_name AS item_id,
             toUInt32(countMerge(w.active_watch_state)) AS watch_score,
             s.current_price AS price, s.tld,
             CAST(s.auction_type_id AS VARCHAR) AS auction_type,
             toUnixTimestamp64Milli(s.ends_at) / 1000.0 AS ends_at
      FROM {clickhouse_db}.mv_watch_density_by_item_day w
      INNER JOIN (
        SELECT DISTINCT member_item_id, auction_id
        FROM {clickhouse_db}.bid_events
        WHERE auction_id > 0
      ) b ON w.member_item_id = b.member_item_id
      INNER JOIN {clickhouse_db}.auction_audit_cln s ON s.auction_id = b.auction_id
      LEFT JOIN (
        SELECT member_item_id,
               countMerge(bid_count_state) AS recent_bids
        FROM {clickhouse_db}.mv_bid_velocity_by_item_hour
        WHERE event_hour >= now() - INTERVAL 4 HOUR
        GROUP BY member_item_id
      ) v ON w.member_item_id = v.member_item_id
      WHERE w.event_day = today()
        AND s.ends_at > now64(3)
        AND ifNull(v.recent_bids, 0) = 0
      GROUP BY s.domain_name, s.current_price, s.tld, s.auction_type_id, s.ends_at
      HAVING watch_score >= 3
      ORDER BY watch_score DESC, s.current_price DESC

    max_rows_each: 50
    high_volume_score_norm: 100.0
    fresh_time_horizon_seconds: 604800.0
    # Decay window for bid recency scoring in the latest rail.
    # A bid placed 0 s ago scores 1.0; one placed horizon s ago scores 0.0.
    # Requires last_bid_offer_dt column in latest_sql result.
    bid_recency_horizon_seconds: 3600.0
    watch_density_score_norm: 50.0
    high_traffic_score_norm: 100.0
    high_traffic_bid_weight: 2.0
    high_traffic_watch_weight: 1.0
    # Push identified hard filters into explore rail SQL (outer WHERE on SELECT aliases).
    # Soft slots must not appear here. column names must match rail SQL aliases.
    hard_filter_pushdown:
      enabled: true
      slots:
        tld:
          column: tld
          op: in
        auction_type:
          column: auction_type
          op: in
        price_min:
          column: price
          op: gte
        price_max:
          column: price
          op: lte
  # When true: a hybrid-classified query whose raw text matches temporal/recency
  # language (newest, just listed, ending soon, brand new, etc.) is reclassified to
  # explore. Explore is in _QUERY_TYPES_USING_STRUCTURED so extracted filters still
  # apply to ranked_results — the user gets filtered browse results with explore rails.
  hybrid_temporal_reroute_enabled: true

guidance:
  enabled: true
  clickhouse_db: *analytics_db
  market_snapshot_sql: >-
    SELECT
      tld,
      count(*)                      AS total_auctions,
      countIf(bid_count > 0)        AS auctions_with_bids,
      round(max(current_price), 2)  AS max_price,
      sum(bid_count)                AS total_bids
    FROM {clickhouse_db}.auction_audit_cln
    WHERE ends_at > now64(3)
    GROUP BY tld
    ORDER BY total_auctions DESC
    LIMIT 20
  max_payload_chars: 4096
  # When true: if the classifier returns 'guidance' but the query carries hard
  # keyword-filter entities (keyword_contains/starts_with/ends_with), re-route
  # to 'hybrid' so retrieval returns domain recommendations instead of a market
  # snapshot. Queries like "I want to build a coffee shop, what domains should I
  # buy?" match this pattern — they ask for specific domains, not market data.
  keyword_entity_reroute: true
  # When true: suppresses keyword_entity_reroute for queries that contain advisory
  # language (how/should I/is it/explain/compare/versus). Advisory queries like
  # "should I buy domains containing tech?" stay as guidance. Has no effect when
  # keyword_entity_reroute=false.
  keyword_reroute_advisory_veto: true
  # When true: a guidance-classified query carrying ANY hard structured filter
  # (price/traffic/length/tld/auction_type/age/authority/word_count/lifecycle) also
  # re-routes to hybrid. Stabilises routing for chip-bearing NL queries like
  # "cheapest premium AI domains with significant traffic" that the centroid router
  # might otherwise land in guidance.
  structured_filter_reroute: true
  # When true: suppresses structured_filter_reroute for queries that contain advisory
  # language (how/should I/is it/explain/compare/versus). Advisory queries may carry
  # incidental TLD or price entities but the user intent is market context, not a
  # domain list. Has no effect when structured_filter_reroute=false.
  structured_filter_reroute_advisory_veto: true
  # Timeout in seconds for awaiting the pre-fired build_snapshot task inside
  # _with_guidance_envelope. The snapshot task fires concurrently with hybrid
  # retrieval; this caps how long the envelope step waits if snapshot lags.
  # Ranked listings for guidance use hybrid-first retrieve + ranked_results_complement
  # (rails merge / nonempty ladder) — not a separate guidance→explore replace path.
  snapshot_timeout_seconds: 2.0
  # User-facing notice when the market snapshot cannot be built (ClickHouse down,
  # analytics disabled, or snapshot SQL empty) while ranked_results still return.
  snapshot_unavailable_notice: "Market snapshot is unavailable — showing best-match domain recommendations for your query instead."
  # When true: a hybrid-classified query whose raw text matches advisory language
  # (worth buying, market value, recommend, what makes, should I, explain, etc.) is
  # reclassified to guidance. Guidance is in _QUERY_TYPES_USING_STRUCTURED so
  # extracted filters still apply to ranked_results — the user gets filtered domain
  # results alongside the market snapshot, not a bare domain shopping list.
  hybrid_advisory_reroute_enabled: true

# -----------------------------------------------------------------------------
# Multi-Intent Splitter
# Deterministic L0 splitter that fires before classification. Splits compound
# queries on AND/OR/comma/semicolon, fans classify() across sub-queries, drops
# zero-result sub-intents via structured pre-screen, applies a 5-cap weighted
# ranking (0.5 confidence + 0.3 expected_results + 0.2 specificity), and emits
# sub-intent badges via RankedItem.sub_intent_ids.
# -----------------------------------------------------------------------------
multi_intent:
  enabled: true
  # Hard cap on sub-intents kept when raw count is below collapse_threshold.
  # Plan §"Multi-Intent": "Hard cap of 5 sub-intents — the chip strip stops
  # scanning cleanly above that."
  max_sub_intents: 5
  # When the raw splitter emits this many or more candidates, switch from
  # "keep top max_sub_intents" to "keep top top_k_after_collapse + emit
  # overflow chip for the rest". Plan §"Multi-Intent": "When the splitter
  # returns 6+ candidates, we keep the top 3".
  collapse_threshold: 6
  # Sub-intents kept when collapse fires (raw count >= collapse_threshold).
  # Plan default 3.
  top_k_after_collapse: 3
  # Max sub-intent slices whose retrieval fan-out runs concurrently (step-3
  # gather). Each slice is a full vector+structured+sql fan-out; a 3-comparator
  # query would otherwise fire ~9 backend calls at once, saturating the shared
  # Qdrant HNSW + ClickHouse pool and inflating wall-clock past the search SLA.
  # Slices beyond the cap queue. Raise only if backend pool headroom allows.
  max_concurrent_slices: 2
  # Singleton entity slots: only the first sub-intent's value is kept.
  # When multi-intent splitting produces a correct entity from a full sub-query and
  # a noisy entity from a bare fragment (e.g. similar_to=['openai'] vs 'open'),
  # first-wins prevents fragment noise. Add any slot that should never repeat.
  # Singleton slots: first sub-intent's value wins. Excludes list-typed slots
  # (tld, similar_to, auction_type) which are now handled by list_merge_slots below.
  singleton_merge_slots:
    - price_min
    - price_max
    - lifecycle_state
    - keyword_phrase
  # List-valued slots: union-merged across all sub-intent slices (append + dedup).
  # "similar to google or apple" → both sub-intents contribute similar_to values
  # that are merged into one list. Same for multi-TLD and multi-auction-type queries.
  list_merge_slots:
    - similar_to
    - tld
    - auction_type
    - keyword_ends_with
    - keyword_starts_with
    - keyword_contains_exclude
    - topic_include
    - topic_exclude
  # Value-level deconfliction for keyword_contains. Each rule is
  # [keyword_value, guard_slot_a, guard_slot_b]: removes keyword_value from
  # keyword_contains when guard_slot_a or guard_slot_b is present in the slice set.
  # Prevents SEO metric brand names from polluting the keyword filter.
  keyword_contains_value_deconflict:
    - [majestic, majestic_tf_min, majestic_tf_max]
    - [semrush, semrush_authority_min, semrush_cpc_min]
    - [ahrefs, semrush_authority_min, ""]
    - [moz, semrush_authority_min, ""]
    # Valuation brand must not bleed into keyword when typed govalue / underpriced chips exist.
    - [govalue, govalue_min, govalue_max]
    - [govalue, price_below_market, ""]
    # Auction-type labels must not bleed into keyword filters.
    - [backorder, auction_type, typeExcludeList]
    - [expiry, auction_type, typeExcludeList]
    - [closeout, auction_type, typeExcludeList]
    - [premium, auction_type, typeExcludeList]
    - [partner, auction_type, typeExcludeList]
    - [godaddy, auction_type, typeExcludeList]
    - [firehose, auction_type, typeExcludeList]
    - [dropcatch, auction_type, typeExcludeList]
  # Post-merge entity deconfliction rules applied after multi-intent slice merging.
  # Each rule is [flag_slot, presence_a, presence_b]: removes flag_slot from any slice
  # where flag_slot is present AND at least one presence slot is also present.
  # Empty string for presence_b disables the second presence check.
  post_merge_deconflict_rules:
    - [traffic_is_unknown, traffic_min, traffic_max]
    - [word_count_min, domain_age_min, domain_age_max]
    - [word_count_max, domain_age_min, domain_age_max]
    - [minLetters, semrush_authority_min, majestic_tf_min]
    - [minLetters, semrush_authority_max, majestic_tf_max]
    - [minDigits, semrush_authority_min, majestic_tf_min]
    - [minDigits, semrush_authority_max, majestic_tf_max]
    - [name_length_min, semrush_authority_min, majestic_tf_min]
    - [name_length_min, semrush_authority_max, majestic_tf_max]
    - [auction_type, lifecycle_state, ""]
  # Patterns that suppress splitting entirely when matched. Prevents treating
  # combined negation constraints ("no hyphens or numbers") and numeric ranges
  # ("between $100 and $2000") as separate sub-intents.
  no_split_patterns:
    # Coordinated dotted TLDs (".net and .io", ".com, .net or .org") are one
    # categorical constraint — do not fan into per-TLD sub-intents (price/bounds
    # would otherwise stick to only the last fragment).
    - '\.[a-z]{2,8}(?:\s*(?:,|and|or)\s*\.[a-z]{2,8})+'
    - '\bno\s+\w+\s+(?:or|and)\s+\w+'
    - '\bbetween\s+\$?[\d][\d,]*\s+and\s+\$?[\d]'
    # Coordinated numeric list bound to a measure unit ("under 3 or 5 chars", "5 to 7 letters")
    # is a single length/count constraint, not two intents — the extractor's list form collapses
    # it to one bound. Requires digits + a measure unit, so ".com or .io" / word lists are untouched.
    - '\b(?:under|below|over|above|max|min|at\s+most|at\s+least|up\s+to|less\s+than|more\s+than)?\s*\d[\d,]*(?:\s*(?:or|,|/|to|through|[-–])\s*\d[\d,]*)+\s*(?:letters?|characters?|chars?|keywords?|words?|lengths?|digits?)'
    - '\b(?:similar\s+to|comparable\s+to|like|alternatives?\s+to)\s+\w[\w.-]*(?:\s*,\s*(?:(?:or|and)\s+)?\w[\w.-]*|\s+(?:or|and)\s+\w[\w.-]*)+'
    - '\bcontain(?:s|ing)?\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    - '\bend(?:s|ing)?\s+(?:in|with)\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    - '\bstart(?:s|ing)?\s+with\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    - '\bexclud(?:e|ing)\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    - '\b(?:expir(?:ing|ed)\s+\w+|dropping|closing\s+soon|ending\s+soon|recently\s+expired|buy[\s-]?now)\s+or\s+(?:expir(?:ing|ed)\s+\w+|dropping|closing\s+soon|ending\s+soon|recently\s+expired|buy[\s-]?now)\b'
    - '\bnot\s+(?:containing|having|with|in)\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    - '\binclud(?:e|es|ed|ing)\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    - '\bhav(?:e|es|ing)\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    - '\bmatch(?:es|ed|ing)?\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    - '\bfeatur(?:e|es|ed|ing)\s+\w+(?:\s+(?:and|or)\s+\w+)+'
    # Analytics comparison queries should not be split — "X vs Y performance/price/comparison" is a
    # single analytics question, not two independent search intents. Prevents L0_multi_intent routing.
    - '\.[a-z]{2,6}\s+vs\.?\s+\.[a-z]{2,6}'
    - '\bcompare\b.{0,80}\b(?:performance|price|prices|revenue|sales|sell|tld|extension|comparison)\b'
    - '\b(?:backlink|traffic|authority|da|seo)\w*\s+vs\.?\s+\w'
    - '\b(?:auction\s+vs|buynow\s+vs|vs\s+buynow|closeout\s+vs)\b'
    # Valuation comparison ("underpriced vs govalue … under 2k") is one filter intent —
    # splitting on vs turns "govalue" into keyword_contains and drops minValuationPrice.
    - '\bvs\.?\s+(?:govalue|go\s*value|appraisal|appraised)\b'
    - '\b(?:govalue|go\s*value|appraisal)\s+vs\.?\b'
    - '\b(?:underpriced|undervalued|below\s+market)\b.{0,60}\bvs\.?\b'
    # Bare TLD disjunction without dots ("com or io") is one categorical constraint
    # (dotted form already covered above). Prevents fan-out that orphans price/age chips.
    - '\b(?:com|net|org|io|ai|co|xyz|info|app|dev)\s+or\s+(?:com|net|org|io|ai|co|xyz|info|app|dev)\b'
    # Guidance comparison queries: "X or Y better/alternative", "for role-A or role-B",
    # ".ext1 or .ext2" — single decision question, not two independent search intents.
    - '\bor\s+(?:\w+\s+){1,5}(?:better|best|worse|alternative|choice|option|preferred)\b'
    - '\bfor\s+(?:\w+\s+){0,2}or\s+\w'
    - '\.[a-z]{2,6}\s+or\s+\.[a-z]{2,6}'
    # Additive suite: keep price-range / similarity / tonight urgency as one intent.
    - '\bbetween\s+\$?[\d][\d,]*(?:\s*k)?\s+and\s+\$?[\d]'
    - '\bfrom\s+\$?[\d][\d,]*(?:\s*k)?\s+to\s+\$?[\d]'
    - '\b(?:ending|closing|expiring)\s+tonight\b'
    - '\b(?:domains?|names?)?\s*(?:like|similar\s+to|sounds?\s+like)\s+\w[\w.-]*(?:\s+(?:or|and)\s+\w[\w.-]*)+'
    # Interrogative advisory questions ("is it smarter to X or Y", "should I bid or wait",
    # "would you buy now or hold") — "or" connects two strategy choices within one question,
    # not two separate search intents. Preserve whole query as single advisory intent.
    - '\b(?:is\s+it|should\s+(?:i|we)|would\s+(?:i|you))\b'
    # Sequential/conditional trailing phrases after "or" in decision questions
    # ("or wait for it to drop", "or let it expire") — continuation of one advisory question.
    - '\bor\s+(?:wait|hold|let)\s+(?:it|them|the)\s+\w'
    # Business category list before an advisory phrase — "coffee shop or restaurant domain advice"
    # is one guidance question, not two independent search intents.
    - '\bor\s+\w+(?:\s+\w+){0,3}\s+domain\s+(?:advice|help|strategy|guidance|recommendations?)\b'
  # Hard upper bound on raw sub-queries the splitter is allowed to emit before
  # ranking; protects against pathological "a, b, c, d, e, f, ..." inputs.
  max_split_candidates: 8
  # Sub-queries shorter than this are dropped as splitter noise.
  min_sub_query_chars: 3
  # 5-cap weighted ranking — must sum to 1.0.
  weight_confidence: 0.5
  weight_expected_results: 0.3
  weight_specificity: 0.2
  # Counts above this all map to 1.0 in the normalized expected-results signal;
  # prevents a single giant slice from dominating the 5-cap pass.
  expected_results_norm_cap: 1000
  # Items appearing in 2+ sub-intent lists get a fused-score
  # multiplier (1.25 = 25% bonus). Capped at [1.0, 5.0] for safety.
  cross_intent_bonus: 1.25
  # Drop sub-intents with expected_results == 0 before the
  # retrieval fan-out. Set to false to retain them (useful for debugging).
  drop_zero_expected: true
  # When drop_zero_expected is true, only drop slices that have at least one hard
  # filter entity and a pre-screen count of zero. Pure-semantic slices (no hard
  # filters) are retained because the structured pre-screen cannot estimate vector
  # recall — dropping them would silently remove valid semantic intents.
  drop_zero_expected_requires_hard_filters: true
  # Hybrid Qdrant wires a NoOp structured leg — pre-screen counts are always 0 and
  # are not inventory. When true, skip zero-expected drops in that mode.
  drop_zero_expected_skip_unreliable_prescreen: true
  # Slice query_types that never drop on zero structured pre-screen (ANN inventory).
  drop_zero_expected_exempt_query_types:
    - hybrid
  # When every slice is dropped, gather+fuse the parent intent instead of empty pool.
  all_slices_dropped_fallback_to_single: true
  # Cross-slice merge strategy. "rrf" (default) accumulates
  # 1/(merge_rrf_k + rank_in_slice) across slice rankings so items appearing
  # in multiple slices naturally rise; rank-driven and tolerant of
  # fused_score scale drift across slices. "max_score" preserves the legacy
  # behaviour of taking the max per-slice fused_score and applying
  # cross_intent_bonus once per multi-slice item.
  merge_strategy: "rrf"
  # RRF k constant used when merge_strategy="rrf"; 60 matches the standard
  # literature value. Higher k flattens the rank-position curve, lower k
  # sharpens it.
  merge_rrf_k: 60
  # fail_soft: drop failed sub-intents (legacy). fail_closed: any classify error aborts the compound query.
  sub_intent_failure_policy: fail_soft
  # Signal-based noise filtering for false splits (no lexical/regex rules).
  # When enabled: (1) pre-fanout, the L1 semantic router scores each split
  # candidate and fragments below prune_noise_max_confidence are dropped before
  # the LLM runs (collapses a spurious split back to a single-intent classify —
  # one LLM call); (2) post-fanout, merged slices that are entity-less AND below
  # the same floor are pruned. Both paths always keep the strongest fragment.
  prune_noise_slices: true
  prune_noise_max_confidence: 0.5
  # Populate QueryIntent.sub_intent_filters with each sub-query's entity snapshot
  # captured before singleton deconfliction. Enables callers to inspect per-sub-intent
  # price/filter constraints that were merged into a single value downstream.
  preserve_sub_intent_filters: true
  # Strategy for resolving conflicting scalar slots (e.g. price_max) across sub-intents.
  # "max_permissive": *_max slots take max(), *_min slots take min() so the merged
  # constraint covers all sub-intents (e.g. price_max=20 covers ".net under $10" and
  # ".io under $20"). "first_seen" restores legacy first-wins behavior.
  numeric_singleton_merge_strategy: "max_permissive"
  # Copy these slots from any slice onto every peer-bearing slice so shared bounds
  # (price) survive false multi-TLD splits. Empty peer list → broadcast to all slices.
  cross_slice_broadcast_slots:
    - price_min
    - price_max
  cross_slice_broadcast_peer_slots:
    - tld
    - auction_type
  # Per-slice retrieve: copy these hard slots from siblings when the slice lacks them.
  cross_slice_retrieve_propagate_slots:
    - price_min
    - price_max
    - bids_min
    - bids_max
    - time_remaining_max
    - days_listed_max
  # Blend parent listing-concept / residual into each slice encode so fragment
  # sub-queries keep topical ANN signal after the splitter.
  slice_encode_blend_parent_concept: true
  # When delimiter split yields one fragment but L0 returned multiple topical
  # keywords (e.g. "coffee pizza under 100"), expand into one leg per keyword
  # plus shared constraints for multi-leg SERP. Reuses pre_l0 filters (no N LLM).
  split_on_l0_keywords: true
  # Minimum distinct L0 keyword terms required before keyword-leg expansion fires.
  split_on_l0_keywords_min_terms: 2

# -----------------------------------------------------------------------------

nl_to_sql:
  enabled: true
  # Athena table the pipeline targets. Owning team curates this table via
  # separate ETL SQLs in Athena; this pipeline only reads.
  table: *base_table
  # Athena database the table lives in. Independent from `table` so the same
  # table name can be reused across dev/stage/prod databases via env overrides.
  database: signals_platform_cln
  # SQL dialect understood by sqlglot — must be one of {trino, presto, clickhouse}.
  # Must match the live executor. This pipeline runs against ClickHouse, so
  # generation uses ClickHouse functions (toStartOfMonth, quantile(0.5)(col), now()).
  # APPROX_PERCENTILE / DATE_TRUNC are Trino-only and fail on ClickHouse.
  sql_dialect: clickhouse
  # Athena client settings — used by the seed pipeline (vectorization.seed).
  # All values fall back to env vars so this block can remain at defaults in
  # local dev.
  athena:
    # S3 URI prefix for Athena query results. Resolved from env var at load time.
    s3_output_location: "${S3_ATHENA_DIR:-}"
    # AWS region. Resolved from env var at load time; falls back to us-west-2.
    region: "${AWS_DEFAULT_REGION:-us-west-2}"
    # IAM role ARN to assume via STS before creating Athena/S3 clients.
    # Set ATHENA_ROLE_ARN env var; leave empty to use ambient credentials.
    role_arn: "${ATHENA_ROLE_ARN:-}"
    poll_sleep_seconds: 0.5
    connect_timeout: 60
    read_timeout: 120
    max_retries: 3
    s3_list_max_keys: 1000
  # Schema discovery — long-context column linking with sample-value context
  schema_discovery:
    enabled: true
    # Weights for the per-column relevance score; must sum to 1.0
    weights:
      keyword: 0.35
      semantic: 0.45
      fk: 0.20
    # Maximum columns retained after pruning (keeps prompt budget bounded)
    max_columns: 25
    # Minimum relevance score a column must clear to enter the pruned schema
    min_score: 0.05
    # Minimum number of columns to include regardless of min_score. When the
    # score filter would produce fewer columns than this value, the top-N
    # highest-scoring columns are promoted to prevent schema_unavailable failures
    # on queries whose terms match no keyword in the catalog (e.g. 'backorder').
    min_columns_fallback: 5
    # Number of sample values surfaced per column in the discovery context
    sample_values_per_column: 8
    # Minimum row-fraction (0..1) a sample value must hit to display its
    # distribution percentage in the context (filters noise tail values)
    min_distribution_fraction: 0.01
    # Filesystem path to the schema catalog JSON. Prefer ETL output under
    # ``output/semantic_search/nl_to_sql/schema_catalog.json`` when present; the
    # bundled default under ``semantic_search/nl_to_sql/`` resolves from repo root
    # when the process cwd is not the workspace (same rule as calibration seeds).
    catalog_path: "semantic_search/nl_to_sql/schema_catalog.defaults.json"
    # TTL in seconds for the in-process schema scoring cache (keyed by question
    # + table + catalog version). Set to 0 to disable. Max 60s freshness.
    cache_ttl_seconds: 60
    # Columns always included in the pruned schema regardless of relevance score.
    # Prevents analytics-critical low-token-overlap columns from being filtered out.
    pinned_columns:
      - domain_authority
      - monthly_traffic
      - registrar_name
      - category_name
      - current_price
      - bid_count
  # LLM-driven SQL generation
  generation:
    # Task type passed to the LLM router (selects the SQL-gen model chain).
    # Distinct from `query_intent_classification` so cost/quality are tunable.
    task_type: nl_to_sql_generation
    prompt_tag: nl_to_sql.generate.v2
    # Confidence floor on the LLM-reported confidence (rejection below).
    min_confidence: 0.40
    # Retry budget after validation failure.
    # Set to 1: feeds the rejected-column error back so the LLM self-corrects;
    # one retry adds ~1.5s but catches most wrong-column-name hallucinations within SLA.
    max_retries: 1
    # Per-attempt wall-clock cap for LLM SQL generation. 0.0 = disabled.
    # Caps each attempt so a single slow API call cannot consume the full analytics budget.
    generation_timeout_seconds: 10.0
    # Maximum few-shot question/SQL pairs included in the prompt
    max_few_shot_examples: 5
    # Optional model override — empty uses the task-type fallback chain.
    # Left empty by design: the fast model for SQL generation is chosen at
    # runtime by the llm_core ranker from the models the API key can access
    # (see llm_models.strategy.task_type_preferences.nl_to_sql_generation),
    # so no specific model id is pinned in config.
    model_override: ""
    # TTL in seconds for the in-process generation-result cache (keyed by
    # question + sql_hint + catalog_version + database). Caches the full
    # GenAndValidate output; concurrent identical requests and short-window
    # re-asks skip LLM generation entirely. Set to 0 to disable. Default 60s.
    gen_cache_ttl_seconds: 60
  # AST-based security validation (sqlglot)
  security:
    # Tables the SQL is allowed to reference. ANY other table → reject.
    allowed_tables:
      - *base_table
      - signals_platform_cln.mv_auctions_by_tld_day
      - signals_platform_cln.mv_auctions_by_type_day
      - signals_platform_cln.mv_auctions_by_tld_hour
      - signals_platform_cln.mv_auctions_by_category_day
      - signals_platform_cln.mv_auctions_growth_week
      - signals_platform_cln.mv_user_engagement_day
      - signals_platform_cln.mv_auctions_by_type_hour
      - signals_platform_cln.mv_auctions_by_type_tld_hour
      - signals_platform_cln.mv_auctions_by_type_tld_day
      - signals_platform_cln.mv_sell_through_by_tld_day
      - signals_platform_cln.mv_auctions_by_registrar_day
      - signals_platform_cln.mv_auctions_by_category_name_day
      - signals_platform_cln.mv_auctions_by_tld_week
      - signals_platform_cln.mv_auctions_by_type_week
      - signals_platform_cln.mv_new_listings_by_tld_day
      - signals_platform_cln.mv_new_listings_by_category_name_day
      - signals_platform_cln.mv_auctions_by_tld_category_name_day
      - signals_platform_cln.mv_auctions_by_expiry_registrar_day
      - signals_platform_cln.domain_transactions
    # Columns the SQL is forbidden to reference (PII guard)
    pii_columns:
      - shopper_email
      - shopper_phone
      - billing_address
    # Require either a WHERE clause OR a LIMIT (defense against full scans)
    require_where_or_limit: true
    # LIMIT clamp ceiling — generated LIMIT > this value is auto-clamped down
    max_limit: 1000
    # Per-table time-window injection. Empty list = feature off
    # (additive — pre-existing configs without this key remain valid).
    # Each entry: { table_name, column, max_days, default_days }. When a
    # query references the table without a predicate on `column`, the
    # security validator injects `WHERE col >= now() - INTERVAL <default_days> DAY`
    # and records a `time_window_injected` mutation. An existing predicate
    # exceeding `max_days` is rejected (failure_mode='security',
    # reason='time_window_exceeds_max'). default_days must be <= max_days.
    bulk_time_windows: []
    # When true, every column reference in generated SQL is validated against
    # the schema catalog. Queries referencing columns absent from the catalog
    # are rejected (failure_mode='security', reason='column not in catalog').
    # Requires schema_catalog to be wired into AstSecurityValidator; no-op otherwise.
    validate_columns_against_catalog: true
  # Parallel logic-validation gate (syntax + join + perf + cardinality)
  validation:
    enabled: true
    # Estimated-row ceiling — queries projected above this are rejected
    max_estimated_rows: 1_000_000
    # Whether to require EXPLAIN-based index/cardinality probe (Athena cost)
    enable_explain_probe: true
    # Athena bytes-scanned cap. When set AND
    # `enable_explain_probe=true`, the registry constructs an
    # `AthenaExplainProbe` that runs `EXPLAIN (TYPE IO, FORMAT JSON)` on
    # candidate SQL and rejects queries whose summed
    # `inputTableColumnInfos[].outputSizeInBytes` exceeds this value.
    # `null` (default) keeps byte-scan enforcement off — the probe runs
    # only for row-cardinality cap. Probe failures (timeout, transport,
    # parse) soft-fail so probe outages cannot block all SQL traffic.
    # Suggested production value when enabling: ~10 GiB ≈ 10737418240.
    max_bytes_scanned: null
  # Execution gate (Athena query)
  execution:
    # Hard row-count ceiling enforced server-side via LIMIT clamp
    max_rows: 1000
    # Wall-clock timeout (seconds) for the Athena status poll phase inside ``fetch_sql_async``;
    # must be >= ``nl_to_sql.athena.query_max_wait_seconds`` so the inner poll can finish (agent_eval parity).
    timeout_seconds: 1860.0
  # Post-execution verifier (L3 small-LLM sufficiency check).
  # When disabled, Verifier.verify returns sufficient=True with no provider call,
  # so an analytics cache-miss issues one LLM round-trip (SQL generation) rather
  # than two, keeping the pipeline within the 8s SLA. Set true to require verification.
  verifier:
    enabled: true
    task_type: nl_to_sql_verifier
    prompt_tag: nl_to_sql.verify.v1
    # Maximum top rows shown to the verifier (keeps prompt small + cheap)
    sample_rows: 3
    # Confidence floor for verifier verdict (below → treat as `unknown`)
    min_confidence: 0.40
    # Optional model override
    model_override: ""
    # conditional verifier-skip on the analytics fast path
    # (target KPI ≥ 0.85 once warm). When skip_enabled is
    # true AND a cached SQL template has cleared `skip_warmth_threshold`
    # consecutive verifier passes AND its schema_version matches the live
    # snapshot, the analytics fast path may auto-pass the verifier (no
    # provider call). Cold cache, schema-version mismatch, or skip_enabled=
    # false MUST run the verifier — never silently skip on uncertainty.
    skip_enabled: true
    skip_warmth_threshold: 2
    # Cost classes that ALWAYS run the verifier regardless of cache
    # warmth or schema-version match. Defaulting to the two
    # high-cost bands so a stale-but-warm cache cannot ship an
    # unverified expensive answer. Allowed entries: cheap | medium |
    # expensive | oversized. Empty list = skip-on-warmth applies to
    # every class (legacy behaviour).
    mandatory_for_classes:
      - expensive
      - oversized
  # Cost-class bands for the analytics-side cost classifier.
  # A query maps to the smallest band whose ceilings it does not
  # exceed; oversized is the implicit fall-through. The router uses
  # the verdict to (a) hard-reject 'oversized', (b) mandate the
  # verifier on 'expensive' / 'oversized' (see verifier.mandatory_for_classes
  # above), (c) prefer DuckDB+Iceberg routing on the upper bands.
  # Bands MUST be strictly increasing: cheap_max_* < medium_max_* < expensive_max_*.
  # Optional block — omit to disable cost classification entirely
  # (SqlValidationResult.cost_class stays None).
  cost_class:
    # 100 MiB — single-partition reads on the hot snap.
    cheap_max_bytes: 104857600
    # 1 GiB — typical day-grain query.
    medium_max_bytes: 1073741824
    # 10 GiB — multi-day aggregate; verifier mandatory above this.
    expensive_max_bytes: 10737418240
    cheap_max_rows: 10000
    medium_max_rows: 100000
    expensive_max_rows: 1000000
    # Class returned when both EXPLAIN signals are absent (probe still
    # warming up). Conservative default keeps cold queries on the
    # cheap path; flip to 'expensive' if you prefer mandatory-verifier
    # on uncertainty.
    unknown_default: medium
  # Per-fragment Layer-0 sanitizer for retrieved content re-entering LLM
  # prompts (P0.4 / Plan §"Layer 0"). Three NL-SQL producer sites stitch
  # upstream-stage content into LLM prompts:
  #   - schema_description / schema_sample_value (catalog → generation prompt)
  #   - verifier_sample_row                       (SQL execution rows → verifier prompt)
  #   - previous_error                            (verifier free-text notes →
  #                                                next-attempt generation prompt)
  # Each fragment is mask-or-passed before assembly. Policy is mask, NOT
  # block — a single poisoned cell must not sink the whole analytics
  # request. The per-fragment cap is intentionally larger than
  # `safety.ingress_sanitizer.max_chars` (the conversational 500-char user-input
  # cap) because schema dumps and sample rows routinely exceed 500 chars
  # in production.
  retrieved_content_sanitizer:
    enabled: true
    # Hard cap per fragment. Anything above is HARD-truncated with a
    # `[TRUNCATED]` suffix BEFORE the underlying sanitizer's blocklist
    # + PII checks run. Sized for the worst-case rendered schema row
    # (column name + type + description + sample distribution) plus
    # one verifier sample row at the configured `sample_rows=3` limit.
    max_chars_per_fragment: 4000
    # Token written in place of any fragment that fails any check.
    mask_replacement: "[REDACTED-RETRIEVED-CONTENT]"
    # When true, mask events are emitted for observability hooks (no persistent signal store).
    emit_audit_signal: false
  # ---------------------------------------------------------------------------
  # real-time analytics path (additive — disabled by default)
  # When `enabled: true` the AnalyticsRouter is built alongside the existing
  # NLToSQLPipeline. Cache miss / unverified-hit / fast-path failure all fall
  # back to the existing Athena pipeline so this rolls out behind a single flag.
  # ---------------------------------------------------------------------------
  analytics:
    enabled: true
    freshness_target_seconds: 5.0
    clickhouse_on_miss_enabled: true
    # Qualified ClickHouse tables the data-build seed writer targets. Declared
    # via the _tables anchors so the names are single-sourced.
    seed_target_table: *base_table_qualified
    seed_snapshot_table: *snapshot_table_qualified
    # Boot-time prewarm of the NL-SQL exact cache. Runs each question through the
    # analytics router once at startup so the verified SQL is cached and repeat
    # questions hit the fast path. Bounded by max_boot_seconds; never blocks boot.
    prewarm:
      enabled: true
      max_boot_seconds: 90.0
      concurrency: 4
      questions:
        - "count of auction listings closing within next 7 days"
        - "number of new auction listings created in prior 30-day period"
        - "mean current bid across all live auction records"
        - "listing volume split between bid-type and fixed-price auction formats"
        - "extensions ranked by number of active listing records"
        - "mean bid price for listings in io extension"
        - "com extension listing volume and average bid over last month"
        - "extension comparison by fraction of listings with at least one bid placed"
        - "ai vertical listing count and mean current bid"
        - "vertical with highest number of current listing records"
        - "all verticals ranked by total listing count and average bid"
        - "mean moz authority score across all active listing records"
        - "monthly visitor count relationship to listing bid price"
        - "inbound link count relationship to current listing bid"
        - "mean number of bids placed per active listing"
        - "count of listings scheduled to close with zero bids received"
        - "fraction of active listings that have received at least one bid"
        - "pending-delete status domain count scheduled to drop within 7 days"
        - "domain drop volume grouped by registrar name"
        - "count of domains currently in recoverable grace-period status"
        - "mean difference between predicted govalue score and current listing bid"
        - "average govalue score by vertical category"
        - "listings with high predicted value but low current bid"
        - "fixed-price and closeout auction type listing count"
        - "mean price for fixed-price auction type listings"
        - "weekly new listing creation volume over last 90 days"
        - "highest current bid listings this calendar month"
        - "verticals ranked by aggregate bid count"
        - "current bid price distribution across all live listings"
        - "share of active listings with current bid below five hundred"
        - "listing creation volume month over prior month change"
        - "calendar month pattern in new listing volume this year"
        - "mean character count of domain names in active listings"
        - "relationship between domain name length and bid count received"
    clickhouse:
      host: ${CLICKHOUSE_HOST:-localhost}
      # Port and TLS are env-driven so the same config serves both a local
      # plain-HTTP ClickHouse (8123, secure=false — the defaults) and a
      # TLS-fronted managed endpoint (443, secure=true) in Katana/ECS.
      port: ${CLICKHOUSE_PORT:-8123}
      database: *analytics_db
      # Credentials are env-driven. Defaults match a vanilla local ClickHouse
      # (user "default", no password). The password is read separately from
      # CLICKHOUSE_PASSWORD in registry.py (empty => no auth header).
      user: ${CLICKHOUSE_USER:-default}
      secure: ${CLICKHOUSE_SECURE:-false}
      connect_timeout_seconds: 2.0
      read_timeout_seconds: 6.5
      max_retries: 1
      query_max_execution_time_seconds: 6.0
      execution_timeout_seconds: 5.0
      # ClickHouse is managed externally — by Katana when deployed (CLICKHOUSE_HOST
      # secret) and by a standalone container locally (scripts/deploy_clickhouse.sh).
      # The app only validates reachability at startup; it never starts ClickHouse.
      readiness_probe:
        # When true, boot issues sql over HTTP before marking the client available.
        enabled: true
        sql: "SELECT 1"
        timeout_seconds: 2.0
        # Lifespan connection-warm uses the same sql with this longer wall budget.
        warm_timeout_seconds: 15.0
      mv_freshness_probe:
        enabled: true
        interval_successful_queries: 50
        lag_sql: "SELECT dateDiff('second', max(updated_at), now()) AS lag_seconds FROM signals_platform_cln.auction_audit_cln"
        max_lag_seconds: 86400.0
        query_timeout_seconds: 2.0
    mv_router:
      enabled: true
      materialized_views:
        - name: signals_platform_cln.mv_auctions_by_tld_day
