    # Exact NL-to-SQL cache (case-insensitive). Keyed by the exact canonical
    # form of the question (lowercase + punctuation-stripped + whitespace-collapsed)
    # — no embedding similarity, so numerically distinct questions
    # ("under $100" vs "under $200") never share a cached SQL.
    exact_cache:
      enabled: true
      ttl_seconds: 60
      max_entries: 1024
      # Verifier-pass count below which a hit returns verified=False (no
      # short-circuit). Guards cold templates that haven't earned trust.
      min_verified_count: 1
      # Exact canonical-question mirror for multi-replica deployments (optional).
      remote:
        enabled: false
        redis_url_env_var: AGENT_SEARCH_NL_SQL_REDIS_URL
        key_prefix: "semantic_search:nlsql:"
        socket_timeout_seconds: 0.5
    # Multi-period dashboard handler — fires parallel ClickHouse queries for
    # last_1h / last_24h / last_7d / last_30d when a dimensional aggregate
    # question is detected. Derives dimension→MV mapping from mv_router catalog;
    # hint_key_aliases maps QI slot names to actual ClickHouse grain column names.
    multi_period:
      enabled: true
      query_timeout_seconds: 3.0
      max_rows_per_period: 100
      hint_key_aliases:
        auction_type: auction_type_id
        # "by category" (integer type) resolves to auction_type grain MVs.
        category: auction_type_id
        # "by category name" (string label: ai, fintech, etc.) resolves to category_name MVs.
        category_name: category_name
        # "by registrar" resolves to registrar_name grain MV.
        registrar: registrar_name
        # "by auction type name" resolves to auction_type_name grain MVs.
        auction_type_name: auction_type_name
        # "by expiry status" resolves to expiry_status grain MV.
        expiry_status: expiry_status
        # "by hold days" / "listing age" resolves to hold_days grain MVs.
        hold_days: hold_days
        # "by buyer segment" / "beginner/professional/advanced/investor" resolves to buyer_segment MVs.
        buyer_segment: buyer_segment
    # Extended analytics capabilities — each sub-block has its own enabled toggle
    # so individual capabilities roll out independently. Omit the entire block
    # (or set capabilities: null) to disable all extended signals_platform_cln.
    capabilities:
      time_windows:
        enabled: true
        supported_grains: [hour, day, week, month]
        default_grain: day
        default_lookback_periods: 30
      anomaly_detection:
        enabled: true
        z_score_threshold: 3.0
        min_window_periods: 7
        max_results: 200
      growth_tracking:
        enabled: true
        default_lookback_periods: 7
        snapshot_table: *base_table
      forecasting:
        enabled: true
        # 730 = 2 years of history fed to simpleLinearRegression; covers full
        # auction-cycle seasonality for price/demand forecasting.
        max_history_periods: 730
        max_forecast_periods: 14
        supported_grains: [day, week]
      ranking_scoring:
        enabled: true
        default_score_weights: {}
        max_candidates: 500
      historical_snapshots:
        enabled: true
        snapshot_table: signals_platform_cln.domain_snapshots
        # 730 = 2-year snapshot retention; supports "last 2 years" analytics
        # queries without replaying raw auction event history.
        retention_days: 730
        snapshot_grains: [day, week]
        sale_signal_terms: [sold, completed, ended, closed, went for, fetched, final price, sale price]
        default_window_days: 7
        query_template: "SELECT snapshot_date, COUNT(DISTINCT domain_name) AS domain_count, AVG(current_price) AS avg_price, MIN(current_price) AS min_price, MAX(current_price) AS max_price, SUM(current_price) AS sum_price, median(current_price) AS median_price FROM {snapshot_table} WHERE snapshot_date >= today() - {window_days}{filter_clauses} GROUP BY snapshot_date ORDER BY snapshot_date DESC"
        window_patterns:
          # --- 1 week (7 days) ---
          - {term: "last week", days: 7}
          - {term: "past week", days: 7}
          - {term: "this week", days: 7}
          - {term: "one week", days: 7}
          - {term: "7 days", days: 7}
          - {term: "last 7 days", days: 7}
          - {term: "past 7 days", days: 7}
          # --- 2 weeks (14 days) ---
          - {term: "last two weeks", days: 14}
          - {term: "past two weeks", days: 14}
          - {term: "last 2 weeks", days: 14}
          - {term: "two weeks", days: 14}
          - {term: "fortnight", days: 14}
          - {term: "last fortnight", days: 14}
          - {term: "14 days", days: 14}
          - {term: "last 14 days", days: 14}
          - {term: "past 14 days", days: 14}
          # --- 1 month (30 days) ---
          - {term: "last month", days: 30}
          - {term: "past month", days: 30}
          - {term: "this month", days: 30}
          - {term: "one month", days: 30}
          - {term: "a month", days: 30}
          - {term: "30 days", days: 30}
          - {term: "last 30 days", days: 30}
          - {term: "past 30 days", days: 30}
          # --- 1 quarter (90 days) ---
          - {term: "this quarter", days: 90}
          - {term: "last quarter", days: 90}
          - {term: "past quarter", days: 90}
          - {term: "last three months", days: 90}
