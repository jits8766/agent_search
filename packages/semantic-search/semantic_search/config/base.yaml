          keywords: ["keyword trends", "trending keywords", "popular keywords", "domain keywords", "keyword frequency"]
          params: {grain: week, lookback_periods: 52, min_frequency: 5, limit: 100}
        - method: multidim_tld_category
          keywords: ["tld category breakdown", "tld by category", "category by tld", "multi-dimensional breakdown", "rollup tld category"]
          params: {grain: day, limit: 2000}
        # New routes for enriched columns: expiry lifecycle, auction type performance, hold time.
        - method: expiry_lifecycle_analytics
          keywords: ["expiry lifecycle", "expiry status breakdown", "expiring_soon count", "active vs expired", "closeout expiry", "expiry buckets", "expiry stage", "pending delete breakdown", "grace period breakdown", "registrar drop rate", "competitive drops", "pending delete with bids"]
          params: {grain: day, lookback_periods: 30}
        - method: auction_competitiveness
          keywords: ["auction type performance", "buynow vs closeout", "closeout performance", "buynow performance", "type comparison", "auction type stats", "by auction type"]
          params: {grain: day, limit: 50}
        - method: domain_liquidity
          keywords: ["hold time", "listing age", "hold days", "days listed", "time to sell", "how long listed", "listing duration"]
          params: {grain: week, lookback_periods: 12, limit: 50}
        - method: bid_velocity_per_auction
          keywords: ["bid velocity", "bid acceleration", "hottest bids", "fastest bidding", "bid momentum", "auction heat", "trending auctions by bids"]
          params: {limit: 100}
        - method: watch_density_analytics
          keywords: ["watch density", "most watched", "watchlist analytics", "domain watchers", "watch count", "watching trends"]
          params: {lookback_days: 7, limit: 200}
        - method: hold_time_distribution
          keywords: ["hold time", "days to sell", "time to sell", "how long to sell", "listing duration", "selling speed"]
          params: {lookback_days: 90, limit: 100}
        - method: watch_bid_conversion
          keywords: ["watch bid conversion", "watch to bid", "watcher conversion", "watch intent", "watchers who bid"]
          params: {lookback_days: 7, limit: 200}
        - method: counter_offer_analytics
          keywords: ["counter offer", "counter-offer analytics", "negotiation rate", "offer negotiation", "counteroffer trends"]
          params: {grain: day, lookback_periods: 30}
        - method: price_realization_rate
          keywords: ["price realization", "sale vs list price", "discount rate", "asking price ratio", "price achievement", "price negotiation discount"]
          params: {grain: month, lookback_periods: 3, limit: 50}
        - method: buyer_retention_cohorts
          keywords: ["buyer retention", "repeat buyers", "returning buyers", "buyer loyalty", "cohort retention", "buyer cohort"]
          params: {cohort_periods: 6, lookback_months: 12}
        - method: auction_timing_patterns
          keywords: ["auction timing", "best time to bid", "when auctions close", "time of day bids", "day of week auctions", "peak bidding hours"]
          params: {lookback_days: 90}
        - method: name_structure_analytics
          keywords: ["domain name length", "short domains", "long domains", "name structure", "domain format", "character class", "hyphen domains", "numeric domains"]
          params: {lookback_days: 90, min_count: 5, limit: 100}
        - method: cross_tld_price_spread
          keywords: ["cross tld price", "tld price spread", "com vs net price", "tld arbitrage", "same name different tld", "tld price comparison"]
          params: {lookback_days: 90, min_sales: 3, limit: 100}
        - method: search_attribution
          keywords: ["search attribution", "search to sale", "which queries sell", "query revenue", "search conversion", "search roi"]
          params: {lookback_days: 30, limit: 100}
        - method: registrar_hhi
          keywords: ["registrar concentration", "registrar market share", "registrar hhi", "market concentration", "registrar dominance"]
          params: {lookback_days: 90}
        - method: comparable_sale_price
          keywords: ["comparable price", "fair value", "similar domains sold", "price estimate", "what should this domain sell for", "domain valuation"]
          params: {lookback_days: 365, min_sales: 5, limit: 200}
      # QI sql_hint → typed FilterSpec for engine dispatch. Values are DomainAnalyticsConfig
      # attribute names (not physical columns). All fields required when present.
      filter_bridge:
        enabled: true
        min_suffix: "_min"
        max_suffix: "_max"
        slot_to_column_attr:
          tld: tld_column
          auction_type: category_column
          price: price_column
          traffic: traffic_column
          bid_count: bid_count_column
          govalue: score_column

# -----------------------------------------------------------------------------
# Resilience & Graceful Degradation
# -----------------------------------------------------------------------------
resilience:
  enabled: true
  # LLM circuit breaker
  circuit_breaker:
    enabled: true
    # Failure rate above which the breaker trips OPEN
    failure_rate_threshold: 0.10
    # Minimum LLM calls observed before the breaker can trip
    min_calls_before_trip: 20
    # Rolling window over which failures are counted
    rolling_window_seconds: 300
    # Cooldown after OPEN before half-open probe resumes
    open_cooldown_seconds: 60
    # Fraction of traffic routed through the LLM during HALF_OPEN probe
    half_open_probe_ratio: 0.10
    # Consecutive successes in HALF_OPEN required to CLOSE
    half_open_required_successes: 5
  # Backend health (vector / structured / sql)
  backend_health:
    enabled: true
    # Failure rate above which a backend is marked unhealthy
    failure_rate_threshold: 0.35
    rolling_window_seconds: 120
    # Minimum observations within the window before a backend can degrade
    min_observations: 25
    # Cooldown before health-tracker probes the backend again
    recovery_probe_seconds: 60
    # Force these backends unhealthy (empty = none). Example: [clickhouse] for local rails CH-off checks.
    force_unhealthy_backends: []
  # Degradation mapping
  # Each key is an unhealthy retrieval backend; the value lists fallbacks the
  # planner tries in order. Adding a new backend is YAML-only: no code change.
  degradation:
    enabled: true
    fallback_chains:
      vector:
        - structured
        - cache_only
      structured:
        - sql
        - cache_only
      sql:
        - structured
        - cache_only
    # When every retrieval backend is unhealthy, return empty results (cache-only mode)
    allow_empty_when_all_unhealthy: true
  # Retry hierarchy
  retry:
    enabled: true
    # Per-LLM-call retries (transport / schema-violation retries)
    llm_max_retries: 1
    llm_retry_backoff_ms: 200
    # Per-backend-call retries
    backend_max_retries: 1

# -----------------------------------------------------------------------------
# Proxy-signal measurement (no funnel required)
# Captures every search as a SearchObservation in a fixed-size in-memory ring
# buffer; the evaluator computes the proxy-signal table on demand from
# observations + sibling subsystem snapshots. Signals that the platform cannot
# yet compute (offline metrics, surface affordances not yet shipped) are
# emitted with status='not_instrumented' rather than fabricated.
# -----------------------------------------------------------------------------
measurement:
  enabled: true
  # Ring buffer capacity — sized for ~1 hour of traffic at 1 QPS (tune by env)
  window_size: 3600
  # Minimum sample size before the evaluator publishes any rate-based signal
  min_sample_size: 50
  # Window for the explore-to-search conversion signal (per session)
  explore_followup_window_seconds: 600.0
  thresholds:
    # every value below maps 1:1 to a row in the proxy-signal table
    zero_result_rate_max: 0.03                       # < 3%
    filter_override_rate_max: 0.25                   # < 25%
    query_to_click_rate_min: 0.15                    # > 15%
    cache_hit_rate_min: 0.40                         # > 40% steady state
    # Tiers from /cache/stats (and orchestrator.cache_stats) rolled into cache_hit_rate.
    # qie_l0 is exposed separately and omitted here (different traffic class).
    cache_hit_rate_tiers:
      - exact
      - intent_plan
      - intent_result
    high_confidence_rate_min: 0.40                   # > 40% high-confidence
    p50_latency_ms_max: 300.0                        # P50 < 300ms
    p99_latency_ms_max: 2500.0                       # P99 < 2.5s
    feedback_signals_per_day_min: 100                # > 100 signals/day after ramp
    circuit_breaker_activations_per_week_max: 1      # < 1/week steady state
    regex_short_circuit_rate_min: 0.30               # > 30% via L0 short-circuit
    sanitizer_rejection_rate_max: 0.0                # baseline near 0; any sustained nonzero alerts
    multi_intent_duplicate_rate_max: 0.10            # < 10% duplicate results
    # Confidence band that defines a "high-confidence query" for the
    # cost-per-high-confidence-query and amplification-ratio signals
    high_confidence_band_min: 0.85
    # Confidence floor for cost_per_correct_intent_query_usd.
    # Labels below this are excluded even if marked correct.
    correct_intent_confidence_min: 0.92
    # Alert when cost/high-conf-query exceeds this multiple of last week's baseline
    cost_per_high_confidence_query_alert_multiplier: 2.0
    # launch-blocking KPI ≥ 0.50.
    # Numerator: cached input tokens reported by the provider (Anthropic
    # `cache_read_input_tokens`, OpenAI `prompt_tokens_details.cached_tokens`).
    # Denominator: total input tokens across all `LLMCallRouter.call_structured`
    # calls (Tier-3 + NL-SQL gen + verifier + disambiguation).
    prompt_cache_hit_rate_min: 0.50
    # Verifier-skip rate KPI floor (analytics fast-path). Numerator:
    # verifier auto-skips on warm cached SQL. Denominator: skip + invocation
    # count across all analytics-router fast-path eligibility decisions.
    verifier_skip_rate_min: 0.85
  # Per-request ranking stage counters (retrieve / fuse / hard-gate / soft /
  # eRanker / diversify / zero-result). Logs + optional pipeline_trace.stages.
  # Zero prod latency cost beyond one structured log line when log_event=true.
  ranking_stage_attribution:
    enabled: true
    include_in_response: true
    log_event: true
  qie_only_launch:
    # Phase 1 QI-owned launch gates surfaced by GET /measurement/qie_only.
    min_sample_size: 50
    fail_rate_max: 0.05
    p95_latency_ms_max: 3000.0
    find_skipped_rate_max: 0.15
    hard_params_empty_rate_max: 0.40
    latency_window: 2000
  # ---------------------------------------------------------------------------
  # Intent-bucket-sliced ProxySignalEvaluator + assisted-conversion.
  # Both blocks are OPTIONAL and default-disabled. When absent, the evaluator
  # behaves exactly as it did pre-Rec-#11: one global ProxySignalReport, no
  # per-bucket rows, search_assisted_conversion_rate emitted as
  # `not_instrumented`. Enabling either block is purely additive — no existing
  # signal compute path changes.
  # ---------------------------------------------------------------------------
  # slicing — turn on to expose `ProxySignalEvaluator.evaluate_sliced()`. When
  # enabled, every observation-level rate signal (zero_result_rate,
  # high_confidence_rate, regex_short_circuit_rate, multi_intent_duplicate_rate,
  # query_to_click_rate, p50/p99 latency, search_assisted_conversion_rate when
  # also enabled) emits one row per intent bucket named `<metric>__<bucket>`.
  # Operators get "did p99 regress globally OR only for analytics queries?"
  # instead of a single global number that hides per-bucket regressions.
  # slice_by:               'query_type' is the only currently-supported slice
  #                         key (see contracts.MEASUREMENT_SLICE_KEYS). Future
  #                         additions (e.g. 'decision_tier') will extend the
  #                         frozenset; no breaking change for existing configs.
  # min_per_bucket_sample:  Per-bucket sample floor. Should be <= the global
  #                         `min_sample_size` because per-bucket analysis is
  #                         the whole point — a bucket below this floor is
  #                         emitted as `insufficient_data` rather than a noisy
  #                         rate from a handful of observations.
  # slicing:
  #   enabled: true
  #   slice_by: query_type
  #   min_per_bucket_sample: 20

  # ---------------------------------------------------------------------------
  # assisted_conversion — turn on to instrument the
  # `search_assisted_conversion_rate` proxy signal. A search "converts" when
  # the same `session_id` issues at least one feedback signal whose
  # `signal_type` is in `positive_signal_types` within
  # `attribution_window_seconds` AFTER the search. Numerator: searches with
  # ≥1 follow-up positive signal. Denominator: searches with non-empty
  # session_id (anonymous searches are excluded from the denominator).
  # When `slicing` is also enabled, evaluate_sliced() emits one
  # `search_assisted_conversion_rate__<bucket>` row per intent bucket so
  # operators can see "did filter queries stop converting?" not just "global
  # conversion dipped".
  # attribution_window_seconds: Per-session post-search window (> 0).
  # positive_signal_types:      Subset of contracts.ASSISTED_CONVERSION_POSITIVE_SIGNALS.
  #                             Default vocabulary is conservative — only
  #                             unambiguous high-intent engagement signals
  #                             count. Operators may narrow further (e.g.
  #                             ['result_click'] only) but cannot widen
  #                             beyond the contract.
  # threshold_min:              Minimum acceptable conversion rate in [0,1].
  #                             Values below trigger status='breach' on the
  #                             global signal AND every per-bucket row.
  # assisted_conversion:
  #   enabled: true
  #   attribution_window_seconds: 1800.0   # 30 min — default lookback for assisted conversion
  #   positive_signal_types:
  #   - result_click
  #   - chip_promoted
  #   - resume_clicked
  #   threshold_min: 0.05                  # > 5% baseline — tune by traffic mix

  # ---------------------------------------------------------------------------
  # Cache miss-storm alarm (P1.8)
  # Plan §"Failure Modes": "Cache miss storm — Hit rate < 30% for 5 min —
  # alarm fires". Rolling-window detector emits a `cache_miss_storm`
  # FeedbackSignal on the breach edge so dashboards + the failure-pattern
  # detector can react. Excludes the structured intermediate cache (back-of-
  # pipeline tier with different traffic semantics) — `tiers` lists only the
  # user-facing tiers the alarm tracks.
  # ---------------------------------------------------------------------------
  cache_miss_storm:
    enabled: true
    window_seconds: 300.0      # 5 min rolling window per plan
    hit_rate_min: 0.30         # 30% floor per plan
    min_sample_size: 50        # must see at least 50 cache reads in the window
    tiers:
    - exact
    - intent_plan
    - intent_result

# -----------------------------------------------------------------------------
# LLM Configuration — consumed by llm_core.LLMProvider
# -----------------------------------------------------------------------------
llm_models:
  temperature: 0.0
  max_tokens: 1024
  # Must be >= 16; some OpenAI SKUs reject smaller probes (see agent_eval/shared/base.yaml).
  max_tokens_validation: 16
  # Soft warning emitted when a single LLM call exceeds this token total
  token_warn_threshold: 6000
  # Models that must NOT receive the `temperature` parameter (provider returns 400 when it's sent).
  # Runtime detection supplements this list — any model returning a temperature-related 400 is
  # added to the in-process set automatically, so future calls skip the parameter without retrying.
  # Add any OpenAI model here the same way (e.g. o1, o3 reasoning models also reject temperature).
  temperature_unsupported_models:
    - claude-opus-4-7
    - claude-opus-4-8
  # Enable Anthropic prompt caching for the static system prompt.
  # Wraps the system prompt in a cache_control content block (5-min TTL).
  # Has no effect on OpenAI clients (their caching is automatic at infrastructure level).
  prompt_caching:
    enabled: true

llm_api_keys:
  anthropic:
  - key_env_var: ANTHROPIC_API_KEY
  openai:
  - key_env_var: OPENAI_API_KEY
  google:
  - key_env_var: GOOGLE_API_KEY

# listing + bid event ingestion (in-memory stub today, Kinesis later).
# `invalidate_caches_on_event: true` couples this to the cache-invalidation
# cascade: every consumed event bumps the snapshot version and any registered
# hook is fired (cache tiers + percentile resolver).
ingest:
  enabled: true
  invalidate_caches_on_event: true
  max_events_in_memory: 5000

# Live inventory-grounded value resolution.
# Replaces hardcoded "cheap" / "expiring" thresholds with percentiles computed
# off the structured-index price + remaining-time columns.
inventory:
  enabled: true
  cheap_percentile: 0.25            # "cheap" = p25 of live prices
  expiring_percentile: 0.20         # "expiring" = p20 of remaining time
  refresh_interval_seconds: 60
  min_sample_size: 30
  cheap_price_max_prior: 100.0      # Fallback when index is empty / cold
  expiring_seconds_max_prior: 86400 # Fallback (24h) when index is empty / cold
  market_percentile: 0.5            # per-TLD "market average" baseline = median price

# Temperature-scaling calibrator per cascade tier.
# Calibrators are fit on the golden seed dataset at registry boot; calibrated
# confidence is what the disambiguation gate and the L0 short-circuit gate read.
calibration:
  enabled: true
  fit_on_load: true                 # Fit T per tier from golden_seeds.yaml at boot
  boot_seeds_path: semantic_search/config/golden_seeds.yaml
  # Persist fitted T to disk and load it on subsequent boots (zero LLM). Cold
  # boot fits live then writes the cache; warm boots load it when the fingerprint
  # (seed bytes + L0 prompt tag + fit params + cache_version) matches. Bump
  # cache_version to force a re-fit. persist_path must be on a writable, durable
  # volume (same requirement as the dynamic-synonym store).
  persist_enabled: true
  persist_path: "${DATA_DIR:-output}/calibration_fits.json"
  cache_version: 1
  min_samples_per_tier: 20          # Tiers below this threshold use identity (T=1.0)
  min_temperature: 0.1              # Scalar minimizer search lower bound
  max_temperature: 10.0             # Scalar minimizer search upper bound
  tolerance: 0.0001
  max_iterations: 60
  tier_keys:                        # Stable identifiers stored alongside fit T
    - L0_entity
    - L1_semantic
    - L2_llm
    - fallback
  hot_swap_min_samples: 100         # Floor for accepting register_fit(source='traffic_hot_swap') from batch/offline callers
  # Correctness probe (plan §1) — second leg of calibrated confidence.
  # Predicts P(correct | distribution_shape) from normalized entropy of the
  # classifier score distribution and combines (geometric mean) with the
  # temperature-scaled raw probability. Disabled by default: enabling
  # requires score-distribution producers per tier (today only L1 semantic
  # router emits one). When disabled, identity probes pass through and
  # combined calibration collapses to pure temperature scaling.
  probe:
    enabled: true
    alpha: 4.0                # Logistic slope; >0; higher = more entropy-responsive
    weight_raw: 0.6           # Weight on T-scaled leg in geometric mean (1.0 = probe off)
    min_samples_per_tier: 20  # Tiers below this floor use identity probe
    min_beta: -10.0           # Intercept search lower bound
    max_beta: 10.0            # Intercept search upper bound
    tolerance: 0.0001
    max_iterations: 60

# Feedback signal sink (JSONL + in-memory ring buffer for measurement consumers).
feedback:
  enabled: true
  signal_log_path: output/feedback_signals.jsonl
  max_in_memory_signals: 5000
  allowed_signal_types:
    - filter_override
    - zero_result
    - drift_detected
    - cache_miss_storm
    - llm_refused
    - retrieved_content_sanitized
    - result_click
    - llm_timeout
    - chip_promoted
    - resume_clicked
    - breaker_transition
    - calibration_label
    - eranker_applied
    - uat_feedback
    - analytics_failure
    - centroid_retrain_verdict
    - centroid_retrain_promoted
  uat_max_comment_chars: 2000
  uat_min_rating: 1
  uat_max_rating: 5
  # Name of the env var holding the shared secret required on POST /feedback.
  # Gate enforced only when this env var is set to a non-empty value at runtime
  # (open in local/dev where the secret is unprovisioned). Callers must send the
  # value in the X-Feedback-Key header; mismatches/absence get 401.
  uat_api_key_env_var: FEEDBACK_UAT_API_KEY

# Trace vs durable search identity.
# request_id = ephemeral per-HTTP-hop trace id. search_id = durable search interaction id.
identity:
  request_id_prefix: req
  search_id_prefix: search
  request_id_header: X-Request-Id
  search_id_header: X-Search-Id
  accept_client_request_id: true
  accept_client_search_id: true
  id_hex_length: 12
  max_id_chars: 128
  # Client-supplied id charset (fullmatch). Server-minted ids always match this pattern.
  id_value_pattern: '^[A-Za-z0-9_.:-]+$'
  # Feedback when Form search_id omitted: soft_generate (mint + log) | required (HTTP 422).
  feedback_search_id_mode: soft_generate

# Offline retrieval-eval + LLM-as-judge (library-only; wired on Subsystems).
offline_eval:
  retrieval_eval:
    enabled: false
    top_k: 10
    max_concurrent_queries: 4
    request_id_prefix: retrieval_eval
    min_mean_ndcg: 0.40
    min_mean_recall: 0.35
    min_mean_mrr: 0.25
    max_error_rate: 0.10
  llm_judge:
    enabled: false
    task_type: query_intent_classification
    prompt_tag: relevance_judge
    system_prompt: "You grade auction listing relevance."
    user_prompt_template: "query={query}\nitem_id={item_id}\nitem_text={item_text}\nReturn JSON with gain, confidence, reasoning."
    min_confidence: 0.5
    max_items_per_query: 20
    max_concurrent_judgments: 4

# OneOf-discriminator structural gate. Models in
# the LLM fallback chain are pruned by a live one-token probe before any real
# call; failures are NOT cached so a transient probe error does not silently
# blacklist a model. When every model in the chain is pruned the router raises
# ``llm_no_oneof_capable_models`` (accuracy at the contract
# boundary is the gate; cost is optimised within it, never against it).
llm_structural_gate:
  enabled: true
  probe_ttl_seconds: 3600           # 1h cache for a successful capability probe
  probe_timeout_seconds: 12.0      # cold-start Anthropic API latency is 3-5s; 12s gives headroom
  # 32 tokens: enough for {"payload": {"kind": "option_a", "value": "ok"}} (~14 tokens) with headroom.
  probe_max_tokens: 64   # haiku prepends ~10 preamble tokens; 64 ensures JSON is not truncated
  # Must match _StructuralProbeEnvelope exactly: top-level "payload" key, discriminator
  # field "kind" set to one of the two Literal values ("option_a" | "option_b").
  probe_system_prompt: "Return ONLY this exact JSON, no prose, no markdown: {\"payload\": {\"kind\": \"option_a\", \"value\": \"ok\"}}"
  probe_user_prompt: "ping"
  treat_unknown_as_capable: true    # Allow first call optimistically; gate runs on next chain-build

llm_base_url: ""

llm_client_settings:
  validation_timeout: 30.0
  client_timeout: 60.0
  max_retries: 3
  min_api_key_length: 8
  # Must be >= 16; some OpenAI SKUs reject smaller probes (see agent_eval/shared/base.yaml).
  validation_max_tokens: 16

model_selection_strategy:
  enabled: true
  # Cross-family score+cost ties: first listed provider preferred (tiebreak only).
  provider_tiebreak_priority:
    - anthropic
    - openai
    - google
    - xai
    - deepseek
    - qwen
    - zhipu
    - unknown
  # Startup timed generation: seed ranker runtime_stats with measured p50 so
  # same-cost pairs prefer fastest inference (then latest SKU via recency).
  # Cold-start warm for classify/extract only: probe set =
  #   (union of task_model_allowlists) ∩ discovered models
  # Not the full discovery catalog. max_models / prefer_cost_tier_max apply
  # only when task_model_allowlists is empty (legacy family probe).
  startup_inference_probe:
    enabled: true
    max_models: 16
    prefer_cost_tier_max: 2
    timeout_seconds: 20.0
    # 128: enough for gpt-5-mini reasoning+short reply; length-only failures still count as warm.
    max_tokens: 128
    prompt: "Reply with the single word OK."
    # Optional extras beyond task allowlists (usually empty — allowlists drive the set).
    always_include_models: []
  weights:
    capability: 0.4
    cost: 0.4
    latency: 0.2
  weights_by_task_type:
    query_intent_classification:
      # Short structured-JSON task (≤512-char queries, discriminated union schema).
      # All capable models handle this equally — capability weight 0.0 so cost+latency
      # decide. When cost tiers collapse (e.g. haiku/sonnet both tier 1 alongside opus),
      # the -total_cost tiebreaker in ranker.py naturally selects the cheapest model.
      capability: 0.0
      cost: 0.5
      latency: 0.5
    nl_to_sql_generation:
      # SQL generation sits inside the 8s analytics SLA, so latency dominates.
      # Capability weight 0.0 — any structured-output-capable model generates the
      # schema-constrained SQL; the ranker picks the fastest model the API key can
      # access (no model id is named here or anywhere in config).
      capability: 0.0
      cost: 0.3
      latency: 0.7
    nl_to_sql_verifier:
      # Verifier is a binary sufficiency judgment; latency dominates.
      # Capability weight 0.0 — fastest capable model wins.
      capability: 0.0
      cost: 0.3
      latency: 0.7
    l0_entity_extraction:
      # Slot-filling JSON — accuracy first (capability), then cost, then measured
      # inference latency (startup probe). Same score+cost: fastest, then latest SKU.
      capability: 0.5
      cost: 0.3
      latency: 0.2
    query_rewrite:
      # Condensation task under a tight timeout (2.5s). Capability irrelevant — any model
      # condenses keywords correctly. cost:1.0 zeroes out capability; when cost_tiers
      # collapse (haiku/sonnet both tier 1), the -total_cost tiebreaker in ranker.py
      # selects the cheapest model (haiku-class) over sonnet.
      capability: 0.0
      cost: 1.0
      latency: 0.0
  runtime_adaptation:
    enabled: false
    refresh_interval_s: 300
    min_samples: 20
    latency_window_s: 3600
    quality_window_s: 86400
    error_demotion_threshold: 0.25
    latency_buckets_ms: [500, 1500, 3000, 6000]
    max_entries_per_type: 5000
  task_type_preferences:
    query_intent_classification: 0.6
    # Registering nl_to_sql_generation here makes the provider build a latency-ranked
    # fallback chain for it (build_task_fallbacks only ranks task types listed here);
    # without it the task would fall back to the unranked available-model order.
    nl_to_sql_generation: 0.6
    nl_to_sql_verifier: 0.6
    l0_entity_extraction: 0.6
    query_rewrite: 0.6
  component_task_types:
    qi_llm_classifier: query_intent_classification
  dimension_task_types: {}
  # Optional per-task cost caps. Models with cost_tier > max_cost_tier are placed
  # AFTER preferred models in the fallback chain (never dropped — chain stays non-empty).
  # Cost tiers are relative (1=cheapest in the live model set, 5=most expensive).
  # Cap of 3 keeps cheap/mid-tier models first; high-cost models serve only as
  # absolute last-resort. No model names are hardcoded here.
  task_cost_caps:
    query_intent_classification:
      max_cost_tier: 3   # haiku/sonnet-class preferred; opus-class as last-resort
    nl_to_sql_generation:
      max_cost_tier: 3   # keep cheap/fast tiers first; top-cost models last-resort only
    nl_to_sql_verifier:
      max_cost_tier: 2   # binary judgment; restrict to cheapest tiers only
    l0_entity_extraction:
      max_cost_tier: 2   # allow mid-tier capable models; top-cost still last-resort only
    query_rewrite:
      max_cost_tier: 1   # cheapest tier only; rewrite is a condensation task under a tight timeout
  # Hard latency SLO from startup/runtime measured p50 (ms). Models at/under the
  # budget stay preferred; over-SLO / unprobed append as last-resort (never empty).
  # Classify / NER / filter-extract: 3s window (warm gpt-5-mini ~300ms; cold can
  # spike — startup probe prewarms the primary to keep most calls under budget).
  task_latency_slos:
    query_intent_classification:
      max_p50_latency_ms: 3000
    l0_entity_extraction:
      max_p50_latency_ms: 3000
  # Hard allowlist (preference order). First *discovered* model is primary; later
  # entries are fallbacks. Models not listed (e.g. o3 / opus / gemini-*-pro)
  # never enter the chain — unlike task_cost_caps which only reorder.
  # Shared 4-stage chain for classify / L0 extract / query rewrite (harness LLMJ
  # uses l0_entity_extraction primary unless L0_GROUNDING_MODEL overrides).
  # Still excluded: gemini-2.5-flash, gpt-5-mini (slow reasoning), undated haiku
  # (gateway 400).
  task_model_allowlists:
    query_intent_classification:
      # - gemini-2.5-flash-lite
      - gpt-5.4-mini
      # - claude-haiku-4-5-20251001
      # - gpt-4o-mini
    l0_entity_extraction:
      # - gemini-2.5-flash-lite
      - gpt-5.4-mini
      # - claude-haiku-4-5-20251001
      # - gpt-4o-mini
    query_rewrite:
      # - gemini-2.5-flash-lite
      - gpt-5.4-mini
      # - claude-haiku-4-5-20251001
      # - gpt-4o-mini

model_capability_overrides: {}
model_latency_overrides: {}

# ─────────────────────────────────────────────────────────────────────────────
# Output-side safety / egress guardrails.
# Three composed checks run on the FINAL ranked-results envelope BEFORE the
# orchestrator returns to the API:
#   1. PII scrub        — masks email / phone / SSN / credit-card patterns
#                         inside string-typed payload fields. Reuses the
#                         compiled regex set from `safety.ingress_sanitizer` so a
#                         policy change there propagates to BOTH the input-
#                         side gate and the output-side gate (single source
#                         of truth).
#   2. Lexical moderation — drops or masks items whose payload (concatenated
#                           configured fields) contains any token in the
#                           configured banned-term set. Stdlib-only,
#                           deterministic; an extension seam is left for a
#                           future model-backed `Moderator` implementation.
#   3. Grounding check  — when an item carries an LLM-generated explanation
#                         payload field, every cited item id must exist in the
#                         result set. Mismatched citations are masked at the
#                         span (the listing is preserved — only the unsafe
#                         explanation text is scrubbed).
# Default ships DISABLED so adopting deployments roll out the gate
# explicitly. Enabling requires (a) a curated banned-term list calibrated to
# the auctions domain (avoid generic word lists — they over-trigger on
# domain-name fragments like "sex" inside "sussex"), (b) a payload field
# convention for explanations, and (c) a verified PII pattern set on
# `safety.ingress_sanitizer.pii_patterns`. The gate is fail-closed at boot
# (malformed sub-configs refuse to construct) and fail-soft per item at
# runtime (an exception inside the gate drops the offending item rather than
# leaking unscrubbed payload).
# ─────────────────────────────────────────────────────────────────────────────
safety:
  ingress_sanitizer:
    enabled: true
    max_chars: 500           # cap for user-supplied query strings (the user_prompt side)
    system_max_chars: 50000  # cap for developer-authored system prompts; must accommodate the QI classify prompt (~8 KB)
    blocked_patterns:
      - "ignore previous instructions"
      - "ignore all previous"
      - "disregard the above"
      - "system prompt"
      - "you are now"
      - "</system>"
      - "<|im_start|>"
      - "<|im_end|>"
    pii_patterns:
      - "\\b\\d{3}-\\d{2}-\\d{4}\\b"
      - "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
      - "\\b\\d{16}\\b"
    applies_to_llm_ingress: true
    encoding_normalize: true
  egress_guard:
    enabled: true                   # Master switch. False = NoOpEgressGuard wired (zero-cost passthrough).
    pii_scrub:
      enabled: false                # When true, payload_fields must be a non-empty list (validated at boot).
      payload_fields: ["title", "description", "explanation"]
      max_field_chars: 4096         # Hard per-field length cap (>= 16) — bounds worst-case regex CPU on adversarial payloads.
    moderator:
      enabled: true
      backend: lexical_blocklist    # One of {noop, lexical_blocklist}. noop = typed-disabled identity.
      policy: drop                  # One of {drop, mask}. drop removes the item; mask redacts payload fields with [REDACTED].
      # Note: tokenizer uses [a-z0-9]+ runs so compound SLDs like "xxxvideo4k"
      # are a single token. Terms below target known full-SLD tokens and
      # short exact-match adult prefixes (e.g. sld="xxx").
      lexical:
        payload_fields: ["domain_name", "sld"]
        banned_terms:
          - "xxx"
          - "porn"
          - "pornhub"
          - "xvideos"
          - "xnxx"
          - "xxxvideo4k"
          - "sexvideo"
          - "sexvideos"
          - "adultcontent"
        min_term_length: 3
        max_terms: 500
        stopwords: []
    grounding_check:
      enabled: false
      explanation_field: explanation
      # Captures `item_42`, `item-42`, `item42` — the FIRST capture group is the cited id.
      # Pattern is compile-checked at boot; must contain >= 1 capture group.
      item_id_pattern: "\\b(item[_-]?[A-Za-z0-9_-]+)\\b"
      mask_token: "[UNVERIFIED]"

# Per-query + fleet LLM cost caps.
# Breach path for SEARCH / QI: `call_structured` converts budget denial to
# `LLMError` → L0/L2 treat as LLM unavailable → regex L0 + L1 semantic
# continue. Queries are NOT rejected / empty-resulted for spend policy.
# Analytics (NL-SQL) has no regex substrate → typed
# `failure_mode='cost_budget_exceeded'` if a budget exception escapes.
cost_budget:
  enabled: true
  # Hard USD cap per search()/analytics()/classify call.
  max_cost_usd_per_query: 0.05
  # Legacy flag (search no longer empty-rejects). Kept for config compat.
  fail_soft_on_breach: true
  # Fleet (cross-request) hour/day UTC windows. Sized for ~10% experiment;
  # raise when promoting toward 100%. `memory` = per-pod; `redis` = shared.
  fleet:
    enabled: true
    max_cost_usd_per_hour: 25.0
    max_cost_usd_per_day: 100.0
    backend: memory
    redis_url_env_var: SEMANTIC_SEARCH_REDIS_URL
    key_prefix: "ss:fleet_llm_cost:"
    socket_timeout_seconds: 1.0

# ---------------------------------------------------------------------------
# reasoning-trace explainability surface.
# ---------------------------------------------------------------------------
# Bounded, append-only audit trail of the pipeline stages that ran on a
# search call (spell-correct, cache lookup, QI classification, retrieve,
# fuse, personalize, diversify, truncate, egress guard). When enabled, the
# `SearchOrchestrator` constructs ONE `ReasoningTrace` per call and attaches
# it to the resulting `QueryIntent.reasoning_trace`. The trace is bounded
# by `max_steps_per_trace` — a guard against runaway emission — and rolls
# off the oldest real step (with a `_truncated` head sentinel showing the
# drop count) when the cap is hit.
# PII safety: every step records ONLY a structured `key=value` detail
# string capped to 256 chars (raw query text MUST NOT be written into the
# trace). The contract is enforced by `ReasoningStep.__post_init__` and
# `ReasoningTrace.add` (which truncate oversize details with an ellipsis
# rather than raising — a debug surface must never derail a search).
# Default-disabled. The block is OPTIONAL: omitting it keeps the legacy
# zero-overhead path (the orchestrator never constructs a trace at all).
# When enabling, start with a small `max_steps_per_trace` (e.g. 32) and
# raise only if you observe the truncation sentinel firing in practice.
# Uncomment + tune to enable:
# reasoning_trace:
#   enabled: false
#   # Hard ceiling on the number of steps a single `ReasoningTrace` may
#   # retain (>= 1; the underlying trace rolls off the oldest real step
#   # and stamps a head `_truncated` sentinel beyond this point). 64 is a
#   # safe default — covers an all-stages-enabled pipeline plus headroom
#   # for sub-intent fan-out without growing past ~16 KiB worst case.
#   max_steps_per_trace: 64

# ---------------------------------------------------------------------------
# vectorization — offline indexer + snapshot-version-aware refresh driver
# (plan §4.1.4 "Domain Vectorisation Pipeline")
# ---------------------------------------------------------------------------
# Top-level OPTIONAL block. Bundles the four offline-pipeline subsystems
# the registry composes when `vectorization.enabled=true`:
#   1. `bm25_doc_encoder` — corpus-side BM25 sparse encoder. Mirrors the
#      query-side hashing scheme from `retrieval.qdrant.hybrid.bm25_query_encoder`
#      so query and document sparse vectors line up bucket-for-bucket
#      inside Qdrant. The doc-side `vocab_size` is taken FROM
#      `retrieval.qdrant.hybrid.bm25_query_encoder.vocab_size` directly
#      (registry pulls it by reference, never duplicated here, so they
#      cannot drift apart).
#   2. `indexer` — batch-size + idempotency knobs for the Qdrant upsert
#      path. The `idempotency_key_field` is hashed to derive each point
#      id so re-running the indexer over the same input produces the
#      same id and Qdrant treats the upsert as an in-place replace.
#   3. `refresh` — background driver that triggers a re-index whenever
#      the process-wide `SnapshotVersionRegistry` advances. Owns no
#      business logic beyond version-bump detection and dispatch.
#   4. `synonyms` — OPTIONAL doc-side synonym expansion. When present
#      and enabled, the same map MUST also be wired into
#      `retrieval.qdrant.hybrid.bm25_query_encoder.synonyms` so query
#      and document terms align (a top-level cross-field check enforces
#      symmetry — both enabled with non-empty maps OR both disabled/empty).
# Vectorization pipeline: segment → expand → BM25-encode → Qdrant upsert.
# Runs offline / on snapshot-version advance. Disabled in test/CI (no Qdrant).
vectorization:
  enabled: true
  # Task-type prefix for dense document encoding. Must be "search_document: " for
  # nomic-ai/nomic-embed-text-v1.5 (query side uses "search_query: " — using the
  # wrong prefix here degrades dense retrieval recall). Hashing encoder requires no prefix.
  encoder_query_prefix: "search_document: "
  # Corpus-side BM25 sparse encoder. vocab_size is read FROM
  # retrieval.qdrant.hybrid.bm25_query_encoder.vocab_size by the registry
  # (not a YAML field here) so query and doc sides cannot drift apart.
  bm25_doc_encoder:
    # TF saturation. Typical 1.2–2.0.
    k1: 1.2
    # Length normalisation strength [0.0, 1.0]. 0.0 recommended for domain
    # names (short, low length variance — length norm hurts more than helps).
    b: 0.0
    # Average tokens per document across corpus (used only when b > 0).
    avg_doc_length: 4.0
  # Offline batch-upsert knobs for the Qdrant indexer.
  indexer:
    # Docs per Qdrant upsert call. 1024 reduces round-trips at 20M-record scale
    # (~19 500 calls vs ~78 000 at 256). Raise further only if Qdrant's gRPC
    # message size limit is not an issue (default limit is 4 MB per call).
    batch_size: 1024
    # false = fire-and-forget upserts (higher throughput for bulk backfills).
    # true = wait for searchability (required for integration tests / CI).
    wait_for_index: false
    # Payload field hashed to derive each Qdrant point id (int64).
    # Re-runs over the same input produce the same id → idempotent upsert.
    idempotency_key_field: domain
    # HNSW graph connectivity. Higher = better recall, higher RAM/build cost. 16 is the recommended default for 20M docs.
    hnsw_m: 16
    # HNSW graph build quality. Higher = better recall at index time, slower build. 200 is standard for high-recall indexing.
    hnsw_ef_construct: 200
    # INT8 scalar quantization percentile. 0.99 clips top 1% of values; raises quantization accuracy vs 1.0.
    quantization_quantile: 0.99
    # Qdrant optimizer: segments below this size skip HNSW rebuild during bulk load (prevents ~1000 rebuilds at 20M docs).
    optimizer_indexing_threshold: 100000
    # Qdrant optimizer: segments below this size stay in RAM (not memory-mapped). Set equal to indexing_threshold.
    optimizer_memmap_threshold: 100000
    # Per-call gRPC timeout for Qdrant upsert. 300s accommodates bulk indexing at 5M+ docs where
    # Qdrant segment merges can stall individual upsert calls well beyond 60s.
    upsert_timeout_seconds: 300
    # When true, shortlist + rerank dense vectors share one Matryoshka
    # encode_batch_at_dims call (one ONNX forward, two slices). When false,
    # each stage runs a separate encode_batch.
    shared_matryoshka_dense_encode: true
    # Max concurrent sparse-encode chunks in the indexer thread pool.
    # Keep low when BM42/ORT already saturates CPU (intra-op threads).
    sparse_encode_concurrency: 2
    # Texts per BM42 FastEmbed embed() call (also the sparse chunk width).
    sparse_embed_batch_size: 256
    # Number of shards for the collection. 1 = single-node default. Set to the
    # number of Qdrant data nodes in your cluster to distribute the index and
    # parallelize queries across nodes — directly reduces per-node ANN latency.
    shard_number: 2
  # Snapshot-version-aware background refresh driver.
  refresh:
    enabled: false
    # Seconds between version-check cycles. 60 s = stale window ≤ 1 min.
    interval_seconds: 60.0
    # Consecutive failures before interval doubles (back-off).
    max_consecutive_failures: 3
    # Reduced sleep after an auction-extension (priority) bump so the vector
    # index re-indexes faster than the normal cadence. Must be <= interval_seconds.
    priority_interval_seconds: 5.0
  # Doc-side synonym expansion. MUST mirror retrieval.qdrant.hybrid.bm25_query_encoder.synonyms
  # (same enabled flag, same synonym_map). Registry rejects asymmetric configs at boot.
  # synonym_map references the YAML anchor defined in the retrieval section above.
  synonyms:
    enabled: true
    expansion_weight: 0.5
    max_synonyms_per_token: 5
    max_tokens_to_expand: 16
    synonym_map: *synonym-map
  # ---------------------------------------------------------------------------
  # seed — boot-time domain corpus loader.
  #
  # Fetches real-time records from signals_platform_cln.auction_audit_cln.
  # No synthetic fallback — Athena credentials are required.
  #
  # source: which database instance to query
  #   "daily_snapshot" (default) — uses database.name below
  #   "realtime"                 — uses database.realtime_name when set
  #
  # Only domain_name is vectorized; all other columns are structured payload
  # for filter retrieval (plan_agentic_search.md §3.3).
  # ---------------------------------------------------------------------------
  seed:
    enabled: false
    # "daily_snapshot" | "realtime"
    source: daily_snapshot
    # Yield to the event loop every N documents during index loading.
    batch_yield_size: 200
    # Documents encoded per encode_batch() call. Larger batches improve ONNX throughput at cost of peak memory.
    encode_batch_size: 512
    # ClickHouse INSERT rows per round-trip for /data-build/seed and boot seed.
    clickhouse_batch_size: 2000
    # When true, CREATE DATABASE/TABLE IF NOT EXISTS runs once per seed job;
    # when false, every page re-runs DDL ensure.
    clickhouse_ensure_schema_once: true
    # Per-batch HTTP timeout (seconds) for ClickHouse INSERT.
    clickhouse_insert_timeout_seconds: 60.0
    # Per-DDL statement timeout (seconds) during schema ensure.
    clickhouse_schema_timeout_seconds: 30.0
    # Stage-wise wall-clock timing for /data-build/seed and boot seed.
    # All fields required. Logs via get_logger (data_build_stage_*).
    stage_timing:
      # Master switch. false = no stage start/end/summary lines.
      enabled: true
      # Per-page athena_page_fetch / load_indexes / qdrant_index / clickhouse_seed spans.
      log_page_stages: true
      # Athena merge create_database and CTAS spans.
      log_merge_phases: true
      # OfflineIndexer encode vs upsert totals per page run.
      log_indexer_substages: true
      # Attach stage_timing summary object to the HTTP JSON response.
      include_in_response: true
      # Decimal places for elapsed_ms in logs and response.
      elapsed_ms_decimals: 1
    # Seed data-build schedule (vectorization.seed.schedule).
    # enabled: master switch for scheduled ingest.
    # in_process: when true, the API process runs the background rebuild loop.
    # run_on_deploy: when true, workflow_call trigger=deploy may run seed (+ CH).
    # interval_hours: minimum hours between scheduled fires.
    # run_at_hour_utc: UTC hour (0-23) for scheduled fire; null = wait
    #   interval_hours after process start (in-process loop only).
    # max_runtime_seconds: wall-clock cap PER ingest step (seed OR analytics-backfill).
    #   Default 10800 = 3h per job. When clickhouse.enabled, GHA runs two sequential
    #   jobs so total sequence budget = 2 × max_runtime_seconds (6h = 3h + 3h).
    # seed_mode: Form field for POST /data-build/seed (auto|rebuild|append).
    # Environment (expanded at config load):
    #   SEED_SCHEDULE_RUN_ON_DEPLOY, SEED_SCHEDULE_INTERVAL_HOURS,
    #   SEED_SCHEDULE_RUN_AT_HOUR_UTC
    schedule:
      enabled: true
      in_process: false
      run_on_deploy: "${SEED_SCHEDULE_RUN_ON_DEPLOY:-true}"
      interval_hours: "${SEED_SCHEDULE_INTERVAL_HOURS:-24}"
      run_at_hour_utc: "${SEED_SCHEDULE_RUN_AT_HOUR_UTC:-2}"
      max_runtime_seconds: 10800
      seed_mode: rebuild
    database:
      # Real-time auction event log database.
      name: signals_platform_cln
      # Realtime replica name — leave empty until a live replica is provisioned.
      # Set via YAML overlay or env override; selecting source: realtime with an
      # empty value raises a ConfigurationError at boot.
      realtime_name: ""
      tables:
        # Priority inventory (Phase 2): live auctions + FIND types 16/20/38/39
        # (DESIGN.md §7.2 / DISCOVERY.md). Seed SQL always filters
        # auction_type_id IN (16,20,38,39); active_only + lookback/cap via YAML.
        - table_name: auction_audit_cln
          # "datewise" — records where auction_start_utc_ts >= NOW() - lookback_days days.
          # "count"    — latest max_records rows (ORDER BY auction_start_utc_ts DESC).
          # active_only: true — additionally filters auction_end_utc_ts > CURRENT_TIMESTAMP
          #   so only live, not-yet-closed auctions enter Qdrant. Recommended for
          #   semantic search indexes; set false only for analytics back-fills.
          strategy: datewise
          lookback_days: 14
          active_only: true
          # Per-table row cap; overridden per-request via the max_records form field.
          max_records: 1000000
      # Default row cap returned to callers when no per-request override is given.
      max_records: 1000000
      # YAML-configurable ceiling for the max_records form field.
      # Absolute system hard-cap is 30 000 000 (enforced in code).
      # Measured 2026-06-16: 782k live auctions (types 16/20/38/39) in 14-day active window.
      max_records_cap: 1000000
      # Athena query timeout in seconds.
      timeout_seconds: 21600.0
      # CTAS scratch-table staging (Option B pagination): bounds peak RAM to
      # O(page_size) instead of O(max_records) for both the Qdrant seed fetch
      # and analytics-backfill (data_build_analytics_backfill reuses this block).
      # page_fetch_timeout_seconds stays well under the 7200s STS session cap
      # so no single Athena call risks outliving one assumed-role session.
      # Disabled: assumed role agent-search-athena lacks glue:GetTable on
      # dynamically-created seed_scratch_* tables in signals_platform_cln
      # (Lake Formation/Glue grants are per-table, don't cover CTAS output),
      # so DROP TABLE IF EXISTS pre-cleanup 403s before CTAS ever runs.
      # Re-enable once IAM grants glue:GetTable/CreateTable/DeleteTable on
      # signals_platform_cln.seed_scratch_* (or DB-level) to that role.
      staging: null
        # staging_database: signals_platform_cln
        # table_prefix: seed_scratch
        # s3_scratch_location: "${S3_ATHENA_DIR:-}/scratch/"
        # page_size: 50000
        # ddl_timeout_seconds: 600.0
        # page_fetch_timeout_seconds: 1800.0
        # max_pages: 600
      # Internal payload key -> FIND listing alias keys dual-written at seed.
      find_payload_aliases:
        price: [auction_price, auction_price_usd]
        current_bid_price: [current_bid_price_usd]
        bid_count: [bids]
        ends_at: [auction_end_time, end_time]
        govalue_score: [valuation_price, valuation_price_usd, appraised_value]
        buy_it_now_price: [buy_it_now_amount, buy_it_now_amount_usd]
        reserved_price_amount: [reserved_price_amount_usd]
        starting_bid: [start_bid_amount, start_bid_amount_usd]
        status_code_id: [auction_status]
        member_id: [owner_member_id]
        domain_name: [fqdn, fqdn_from_feed, domain]
      find_bool_aliases:
        buy_it_now: buy_it_now_flag
        has_reserve_price: reserved_price_flag
        is_featured: feature_listing_flag
        adult_listing: auction_adult
        website_include: is_website_included
        search_eligible: include_in_search_flag
        display_in_category: display_result_in_category_list_flag
        sub_category_featured: sub_category_feature_listing_flag
        add_i_category: add_i_category_listing_flag
        bid_accepted_flag: bid_accepted_flag
        is_idn: isidn
      # Majestic SEO feature-mart snapshot, LEFT JOINed onto the seed rows by
      # domain_name (case-insensitive) to populate majestic_ext_back_links,
      # majestic_ref_domains_fm, majestic_citation_flow_score,
      # majestic_trust_flow_score, majestic_metric_exists.
      majestic:
        database: domain_feature_mart
        table_name: domain_majestic_metric_snap
        timeout_seconds: 120.0
      # Athena scratch database for seed_merge's CTAS staging/final tables
      # (vectorization/seed_merge.py). Staging mechanism ahead of Qdrant/
      # ClickHouse — everything under it is dropped once a run's Qdrant and
      # ClickHouse upserts both finish. Required env — no hardcoded DB name
      # (set ATHENA_TMP_DB in Katana / local .env). Empty fails SeedDatabaseConfig.
      merge_database: "${ATHENA_TMP_DB:-}"
      # S3 URI root for merge_database's own LOCATION (CREATE SCHEMA ...
      # LOCATION), distinct from the Athena query-results output prefix
      # (nl_to_sql.athena.s3_output_location / S3_ATHENA_DIR). Override via
      # ATHENA_TMP_DB_LOC.
      merge_database_location: "${ATHENA_TMP_DB_LOC:-}"
      # Bid-offer join source for seed_merge's stg_bid_offer_* CTAS, matching
      # event_ingest.bid_events. Required — no hardcoded fallback.
      bid_source_database: the_resale_place
      bid_source_table: item_bids_cln
      bid_winning_table: item_winning_bids_cln
      # Rows per page baked into the seed-merge final CTAS's _page_num column.
      # Athena has no efficient OFFSET, so pages are read back via a plain
      # equality filter. Required. Larger pages reduce Athena round-trips and
      # raise peak RAM for the in-flight page.
      merge_page_size: 100000
      # Aftermarket boost-tier flag, LEFT JOINed onto seed rows by domain_name
      # at seed time via the Athena seed_merge CTAS pipeline (stg_aftermarket_*)
      # so is_boosted_aftermarket is baked into the Qdrant payload rather than
      # looked up per /search request. Remove this block to disable the
      # feature entirely.
      aftermarket_boost:
        database: domain_aftermarket_mart
        table_name: ims_listing
        domain_name_column: domain_name
        tier_column: domain_boost_tier
        boosted_tier_values: [deluxe]
      # Search-log rollup, LEFT JOINed onto seed rows by domain_name (Athena,
      # same as majestic) to populate unique_search_count = COUNT(DISTINCT
      # customer_id) over lookback_days. Baked into the Qdrant payload at seed
      # time so /search filters and reads it without a ClickHouse dependency.
      # Remove this block to disable the feature entirely.
      search_rollup:
        database: domain_search
        table_name: domain_search_rollup
        lookback_days: 30
        timeout_seconds: 120.0
      # SEMrush domain-enrichment table, LEFT JOINed onto seed rows by
      # domain_name (case-insensitive) to populate semrush_ascore,
      # semrush_total, semrush_domains_num, semrush_urls_num, semrush_keyword,
      # semrush_search_volume, semrush_cpc, semrush_refdomains. Baked into the
      # Qdrant payload at seed time. Remove this block to disable the feature
      # entirely.
      semrush:
        database: domain_auction_mart
        table_name: semrush_domain_enrichments
        timeout_seconds: 120.0
      # Estibot domain-enrichment table, LEFT JOINed onto seed rows by
      # domain_name (case-insensitive) to populate estibot_domain_count,
      # estibot_domain_count_dev, estibot_ext_count, estibot_ext_count_dev.
      # Baked into the Qdrant payload at seed time. Remove this block to
      # disable the feature entirely.
      estibot:
        database: domain_auction_mart
        table_name: estibot_domain_enrichments
        timeout_seconds: 120.0
  # ===========================================================================
  # REALTIME DATA INGEST (Option A) — single control section
  # ---------------------------------------------------------------------------
  # Toggle panel (all default false). Restart service after any change.
  # Config load at boot → drivers start/stop only on process start.
  #
  #   delta_refresh.enabled                 → Athena listing delta → Qdrant payloads
  #                                           + CH auction_audit_cln mutables (when CH wired)
  #   event_ingest.bid_events.enabled       → Athena bids → ClickHouse bid_events
  #   event_ingest.watch_events.enabled     → Athena watches → ClickHouse watch_events
  #   event_ingest.qdrant_enrich.enabled    → CH MVs → Qdrant signal enrich (needs bid/watch)
  #
  # Env toggles (string true/false; _coerce_bool at load). Restart required.
  #   DELTA_REFRESH_ENABLED
  #   EVENT_INGEST_BID_ENABLED
  #   EVENT_INGEST_WATCH_ENABLED
  #   EVENT_INGEST_QDRANT_ENRICH_ENABLED
  # Defaults false when unset. Katana env blocks mirror these names.
  #
  # ON  (flag true  + Athena/Qdrant/CH healthy): background poll loops run.
  # OFF (flag false): that loop does not start (no NRT writes for that path).
  # delta_refresh is independent of event_ingest.* — toggle alone controls delta driver.
  # qdrant_enrich alone does nothing if bid_events and watch_events are both off.
  # Batch seed (/data-build/full, seed.schedule) is NOT controlled here.
  # ===========================================================================
  delta_refresh:
    # Master switch for DeltaRefreshDriver. Off by default at launch/deploy.
    enabled: "${DELTA_REFRESH_ENABLED:-false}"
    # Seconds between each poll cycle.
    interval_seconds: 60.0
    # Consecutive failures before the loop pauses for manual recovery.
    max_consecutive_failures: 3
    # Athena table name (no database prefix).
    source_table: auction_audit_cln
    # Athena database that owns source_table.
    source_database: signals_platform_cln
    # Cold-start lookback: on the first cycle query this many minutes of history.
    lookback_minutes: 60
    # Time-window slice per Athena query. Each _run_cycle iterates chunk_minutes
    # slices from since_ts to now_ts, advancing _last_polled_at per slice so
    # catch-up gaps are processed incrementally without truncation.
    chunk_minutes: 60
    # Safety cap — LIMIT applied to the dedup CTE. Set high enough to never
    # truncate a single chunk_minutes window in practice. Tune down only if
    # Athena memory pressure is observed.
    batch_size: 500000
    # Athena query wall-clock cap per chunk (seconds).
    timeout_seconds: 60.0
    # Payload keys to overwrite via Qdrant set_payload. Must match names in the
    # Qdrant payload schema exactly.
    mutable_fields:
      - price
      - current_bid_price
      - bid_count
      - auction_type
      - ends_at
      - buy_it_now
      - buy_it_now_price
      - is_featured
    find_payload_aliases:
      price: [auction_price, auction_price_usd]
      current_bid_price: [current_bid_price_usd]
      bid_count: [bids]
      ends_at: [auction_end_time, end_time]
      buy_it_now_price: [buy_it_now_amount, buy_it_now_amount_usd]
    find_bool_aliases:
      is_featured: feature_listing_flag

  event_ingest:
    bid_events:
      # Master switch for Athena→ClickHouse bid event ingest.
      enabled: "${EVENT_INGEST_BID_ENABLED:-false}"
      # Poll cadence in seconds.
      interval_seconds: 60.0
      # Pause after this many consecutive cycle errors.
      max_consecutive_failures: 3
      source_database: the_resale_place
      source_table: item_bids_cln
      # Used in LEFT JOIN to resolve auction_id from member_item_id.
      winning_bids_table: item_winning_bids_cln
      # Cold-start lookback window on first cycle.
      lookback_minutes: 60
      # Time-window slice per Athena query (partition-pruning boundary).
      chunk_minutes: 60
      # LIMIT on the dedup CTE — set high enough to capture all bids per chunk.
      batch_size: 10000
      # Athena query wall-clock cap per chunk (seconds).
      timeout_seconds: 60.0
    watch_events:
      # Master switch for Athena→ClickHouse watch event ingest.
      enabled: "${EVENT_INGEST_WATCH_ENABLED:-false}"
      # Poll cadence in seconds.
      interval_seconds: 120.0
      max_consecutive_failures: 3
      source_database: the_resale_place
      source_table: member_items_watch_cln
      # Dimension table for human-readable watch_type_label.
      watch_types_table: member_items_watch_types_cln
      lookback_minutes: 60
      chunk_minutes: 60
      batch_size: 10000
      timeout_seconds: 60.0
    qdrant_enrich:
      # After each bid/watch cycle, push CH MV aggregates into Qdrant payloads.
      # Requires at least one of bid_events / watch_events enabled + writes > 0.
      enabled: "${EVENT_INGEST_QDRANT_ENRICH_ENABLED:-false}"
      # Max auction_ids enriched per cycle (bounds Qdrant set_payload fan-out).
      enrich_limit: 5000

  # ===========================================================================
  # ENRICHMENT REFRESH (Option B) — Qdrant-only, independent of delta_refresh
  # ---------------------------------------------------------------------------
  # Periodically re-polls the seed-time-only enrichment sources (majestic,
  # semrush, estibot, search_rollup — see seed.database.* above) so those
  # fields refresh without a full seed pipeline rerun. Qdrant-only: no
  # ClickHouse write path. The 5 SEO columns on auction_audit_cln /
  # domain_snapshots are declared but never written or read anywhere in the
  # codebase, and estibot_*/unique_search_count/is_gem/is_boosted_aftermarket
  # have zero ClickHouse representation — user-confirmed Qdrant-only scope.
  #
  # One driver, one enabled flag, one shared cadence across all 4 sources —
  # each source still gets its own independent poll loop / cursor / failure
  # counter (EnrichmentRefreshDriver), so one source's outage doesn't stall
  # the others. A source is skipped entirely if its seed.database.<source>
  # block above is absent (e.g. estibot disabled).
  #
  # Env toggle: ENRICHMENT_REFRESH_ENABLED (string true/false). Restart required.
  #
  # [Uncertain] interval_seconds/chunk_minutes below are conservative
  # placeholders, not tuned against real Athena freshness data for these
  # 4 tables — revisit once that data is available.
  # ===========================================================================
  enrichment_refresh:
    # Master switch for EnrichmentRefreshDriver. Off by default at launch/deploy.
    enabled: "${ENRICHMENT_REFRESH_ENABLED:-false}"
    # Seconds between each poll cycle (shared across all 4 sources).
    interval_seconds: 900.0
    # Consecutive failures before a source's loop pauses for manual recovery.
    max_consecutive_failures: 3
    # Cold-start lookback: on the first cycle query this many minutes of history.
    lookback_minutes: 120
    # Safety cap — LIMIT applied to the dedup CTE per source per chunk.
    batch_size: 50000
    # Athena query wall-clock cap per chunk (seconds).
    timeout_seconds: 120.0
    # Time-window slice per Athena query for majestic/semrush/estibot
    # (search_rollup has no incremental cursor — always a full recompute).
    chunk_minutes: 120

  analytics_backfill:
    # Rolling window for POST /data-build/analytics-backfill (days).
    # 180 = two quarters; fits 22 GB ClickHouse budget (~10–16 GB compressed).
    # Measured 2026-06-17: 10.2M records/90 days (types 16/20/38/39) → ~20M/180 days.
    lookback_days: 180
    # Row cap per Athena query. 25 000 000 gives 25% headroom over ~20M/180-day window.
    # AnalyticsBackfillConfig has no code-enforced upper bound (separate from Qdrant seed cap).
    max_records: 25000000
    # ClickHouse INSERT batch size (rows per round-trip).
    batch_size: 2000
    # When true, schema DDL ensure runs once per backfill job; when false, every page.
    ensure_schema_once: true
    # Per-batch HTTP timeout (seconds) for ClickHouse INSERT.
    insert_timeout_seconds: 60.0
    # Per-DDL statement timeout (seconds) during schema ensure.
    schema_timeout_seconds: 30.0

# -----------------------------------------------------------------------------
# Vague-quantifier resolver — converts qualitative phrases to concrete filter
# Entity constraints that the structured retriever can apply.
# All thresholds are tunable without code changes.
# -----------------------------------------------------------------------------
vague_quantifier:
  enabled: true
  # traffic_min injected for "decent / reasonable / moderate traffic"
  decent_traffic_floor: 500
  # traffic_min injected for "significant / strong / high traffic"
  strong_traffic_floor: 2000
  # price_max injected for "affordable / cheap / budget / cheapest"
  affordable_price_cap: 1000
  # price_min injected for "expensive / high-end / pricey"
  expensive_price_floor: 5000
  # govalue_min injected for "premium / top-quality / high-value domain"
  premium_govalue_floor: 1000
  # time_remaining_max (seconds) for "expiring soon / ending soon" (72 h)
  expiring_soon_seconds: 259200
  # domain_age_min (years) for "mature / aged / established domain"
  domain_age_mature_years: 3
  # name_length_max for "short domain / short name"
  short_name_max_chars: 8
  # name_length_min for "long domain / long name"
  long_name_min_chars: 15
  # semrush_authority_min for "high authority / strong authority / authority score"
  high_authority_min: 30
  # majestic_tf_min for "strong backlinks / backlink juice / link equity" (not "good seo")
  strong_backlinks_tf_min: 15
